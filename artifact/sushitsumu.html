      c.strokeStyle = 'rgba(120,80,10,.55)'; c.lineWidth = 6;
      c.beginPath(); c.arc(0, 0, GR * 0.86, 0, 6.2832); c.stroke();
      var ig = c.createRadialGradient(0, -GR * 0.2, GR * 0.05, 0, 0, GR * 0.74);
      ig.addColorStop(0, '#fffbe6'); ig.addColorStop(1, '#e9ca45');

      c.fillStyle = '#7a1f14';

      c.beginPath(); c.arc(0, 0, GR * 0.93, -2.5, -1.7); c.stroke();

    }
  }
}

/* ---- ガリ（甘酢生姜の薄切り） ---- */
function drawGari(c) {
  var R = GARI.r;
  for (var i = 0; i < 3; i++) {
    c.save();
    c.translate((i - 1) * R * 0.3, (i - 1) * R * 0.16);
    c.rotate((i - 1) * 0.5);
    var g = c.createLinearGradient(0, -R, 0, R);
    g.addColorStop(0, '#fff2f5');
    g.addColorStop(1, '#ffa8c2');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-R * 0.95, R * 0.25);
    c.quadraticCurveTo(-R * 0.5, -R * 1.25, R * 0.55, -R * 0.5);
    c.quadraticCurveTo(R * 1.1, R * 0.2, 0, R * 0.95);
    c.quadraticCurveTo(-R * 0.6, R * 0.85, -R * 0.95, R * 0.25);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(198,104,138,.7)'; c.lineWidth = 0.9; c.stroke();
    c.restore();
  }
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.1;
  c.beginPath();
  c.moveTo(-R * 0.45, R * 0.35);
  c.quadraticCurveTo(0, -R * 0.3, R * 0.5, -R * 0.3);
  c.stroke();
}

/* ---- ネタをスプライトに焼く ----
   毎フレーム全ネタを描き直すと重いので、起動時に一度だけ
   オフスクリーンへ描いて、あとは drawImage で回す。 */
var sprites = [];
var gariSprite = null;
var SPR_SCALE = 3;

function makeSprite(w, h, pad, drawFn) {
  var cw = w + pad * 2, ch = h + pad * 2;
  var cv = document.createElement('canvas');
  cv.width = Math.ceil(cw * SPR_SCALE);
  cv.height = Math.ceil(ch * SPR_SCALE);
  var c = cv.getContext('2d');
  c.scale(SPR_SCALE, SPR_SCALE);
  c.translate(cw / 2, ch / 2);
  drawFn(c);
  return { cv: cv, w: cw, h: ch };
}

function buildSprites() {
  for (var i = 0; i < SUSHI.length; i++) {
    (function (lv) {
      var d = SUSHI[lv];
      sprites[lv] = makeSprite(d.hw * 2, d.hh * 2, d.pad || 8,
        function (c) { drawItem(c, lv); });
    })(i);
  }
  gariSprite = makeSprite(GARI.r * 2, GARI.r * 2, 8, drawGari);
}

function spriteOf(item) {
  return item.gari ? gariSprite : sprites[item.level];
}
function paintSprite(c, sp) {
  c.drawImage(sp.cv, -sp.w / 2, -sp.h / 2, sp.w, sp.h);
}

/* ---- 桶（枠）の描画 ----
   桶は動かないので、起動時にオフスクリーンへ一度だけ描いて
   毎フレームは drawImage 1回で済ませる（iPhone での負荷を抑える）。 */
var barrelCv = null;

/* 和紙の繊維テクスチャ（タイル）。
   目に見える「模様」にならないよう、ざらつきとして感じる程度に留める。 */
function buildWashiPattern(c) {
  var S = 256;
  var t = document.createElement('canvas');
  t.width = t.height = S;
  var x = t.getContext('2d');
  x.lineWidth = 0.6;
  for (var i = 0; i < 900; i++) {
    var px = Math.random() * S, py = Math.random() * S;
    var a = Math.random() * Math.PI, len = 1.5 + Math.random() * 5;
    x.strokeStyle = 'rgba(140,108,58,' + (0.012 + Math.random() * 0.026).toFixed(3) + ')';
    x.beginPath();
    x.moveTo(px, py);
    x.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len);
    x.stroke();
  }
  for (var j = 0; j < 1400; j++) {
    x.fillStyle = 'rgba(130,100,52,' + (0.01 + Math.random() * 0.028).toFixed(3) + ')';
    x.fillRect(Math.random() * S, Math.random() * S, 1, 1);
  }
  return c.createPattern(t, 'repeat');
}

/* 画面幅いっぱいの店の壁。
   桶の canvas は 9:16 と決まっていて、広い画面では左右が余る。そこを
   ただの地色にすると「スマホ画面が置いてある」ように見えるので、
   壁と暖簾を端まで延ばして、卓ごと画面に収まっているように見せる。
   端に寄るほど暗く落とし、脇に置いた文字が読めなくならないようにする。 */
var backCv = document.getElementById('backdrop');
function buildBackdrop(cssH, cssTop) {
  if (!deskQ.matches) return;
  var vw = window.innerWidth;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var k = cssH / H;                       // 桶と同じ縦の縮尺
  var lw = vw / k;                        // 論理座標での画面幅
  backCv.style.width = vw + 'px';
  backCv.style.height = cssH + 'px';
  backCv.style.top = cssTop + 'px';
  backCv.width = Math.round(vw * dpr);
  backCv.height = Math.round(cssH * dpr);
  var c = backCv.getContext('2d');
  c.setTransform(k * dpr, 0, 0, k * dpr, 0, 0);
  c.clearRect(0, 0, lw, H);

  // ---- 板壁 ----
  var wall = c.createLinearGradient(0, 0, 0, BARREL_TOP);
  wall.addColorStop(0, '#ddd1b7');
  wall.addColorStop(0.55, '#cbbc9c');
  wall.addColorStop(1, '#ac9a78');
  c.fillStyle = wall;
  c.fillRect(0, 0, lw, BARREL_TOP);
  // 縦羽目板の継ぎ目。桶の中の板と目地を揃える。
  // ずれると canvas の縁に段差が出て、そこで壁が切れて見える
  var pitch = W / 8, kx;
  var left = lw / 2 - W / 2;                 // 桶の canvas の左端
  for (kx = left - Math.ceil(left / pitch) * pitch; kx < lw; kx += pitch) {
    if (kx <= 0) continue;
    var gx = Math.round(kx) + 0.5;
    c.strokeStyle = 'rgba(96,70,36,.16)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(gx, 0); c.lineTo(gx, BARREL_TOP); c.stroke();
    c.strokeStyle = 'rgba(255,247,228,.3)';
    c.beginPath(); c.moveTo(gx + 1.5, 0); c.lineTo(gx + 1.5, BARREL_TOP); c.stroke();
  }
  // 和紙の地合い。桶の中と同じざらつきを乗せて continuity を保つ
  c.save();
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = buildWashiPattern(c);
  c.fillRect(0, 0, backCv.width, backCv.height);
  c.restore();

  // 壁の下、床にあたる帯
  var floor = c.createLinearGradient(0, BARREL_TOP, 0, H);
  floor.addColorStop(0, '#5d4a30');
  floor.addColorStop(1, '#20303f');
  c.fillStyle = floor;
  c.fillRect(0, BARREL_TOP, lw, H - BARREL_TOP);

  // ---- 暖簾（屋号は入れない。字は桶の canvas の側だけに出す）----
  var NOREN_H = 150, ROD_Y = 12;
  var rod = c.createLinearGradient(0, ROD_Y - 4, 0, ROD_Y + 4);
  rod.addColorStop(0, '#c9a86a');
  rod.addColorStop(0.5, '#9d7c42');
  rod.addColorStop(1, '#6f5527');
  c.fillStyle = rod;
  c.fillRect(0, ROD_Y - 4, lw, 8);

  var nw = (W - 32 - 3 * 5) / 4, gap = 5;
  var start = lw / 2 - W / 2 + 16;           // 桶の中の暖簾と目地を揃える
  var x0 = start - Math.ceil(start / (nw + gap)) * (nw + gap);
  var i = 0;
  for (var px = x0; px < lw; px += nw + gap, i++) {
    var ng = c.createLinearGradient(px, ROD_Y, px + nw, ROD_Y + NOREN_H);
    ng.addColorStop(0, '#22456b');
    ng.addColorStop(0.5, '#173250');
    ng.addColorStop(1, '#0f2339');
    c.fillStyle = ng;
    c.beginPath();
    c.moveTo(px, ROD_Y);
    c.lineTo(px + nw, ROD_Y);
    c.lineTo(px + nw, ROD_Y + NOREN_H - 6);
    c.quadraticCurveTo(px + nw * 0.5, ROD_Y + NOREN_H + (i % 2 ? 4 : -3),
                       px, ROD_Y + NOREN_H - 5);
    c.closePath();
    c.fill();
    c.save(); c.clip();
    c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 1;
    for (var wv = 0; wv < 6; wv++) {
      c.beginPath();
      c.moveTo(px + 6 + wv * (nw / 6), ROD_Y);
      c.lineTo(px + 6 + wv * (nw / 6), ROD_Y + NOREN_H);
      c.stroke();
    }
    c.restore();
  }

  // ---- 端へ向かって暗く落とす ----
  // 桶の左右は明るいまま、脇の文字が乗るあたりでは元の地色まで沈める
  // 明るいままの帯は桶より少し広く取る。桶の縁で明るさが変わると、
  // そこに段が出て「板が貼ってある」ように見えてしまう
  var cx = lw / 2, keep = W / 2 + 52, fade = 200;
  var vg = c.createLinearGradient(0, 0, lw, 0);
  var stops = [
    [0, 'rgba(10,18,26,.97)'],
    [Math.max(0, (cx - keep - fade) / lw), 'rgba(10,18,26,.97)'],
    [(cx - keep) / lw, 'rgba(10,18,26,0)'],
    [(cx + keep) / lw, 'rgba(10,18,26,0)'],
    [Math.min(1, (cx + keep + fade) / lw), 'rgba(10,18,26,.97)'],
    [1, 'rgba(10,18,26,.97)']
  ];
  stops.forEach(function (st) { vg.addColorStop(Math.max(0, Math.min(1, st[0])), st[1]); });
  c.fillStyle = vg;
  c.fillRect(0, 0, lw, H);
  // 上下も少し締めて、卓だけが照らされているように見せる
  var vv = c.createLinearGradient(0, 0, 0, H);
  vv.addColorStop(0, 'rgba(10,18,26,.34)');
  vv.addColorStop(0.3, 'rgba(10,18,26,0)');
  vv.addColorStop(0.82, 'rgba(10,18,26,0)');
  vv.addColorStop(1, 'rgba(10,18,26,.5)');
  c.fillStyle = vv;
  c.fillRect(0, 0, lw, H);
}

function buildBarrel() {
  barrelCv = document.createElement('canvas');
  barrelCv.width = W * 2;
  barrelCv.height = H * 2;
  var c = barrelCv.getContext('2d');
  c.scale(2, 2);
  drawBarrelTo(c);
}

function drawBarrelTo(c) {
  // ---- 店の板壁 ----
  var wall = c.createLinearGradient(0, 0, 0, BARREL_TOP);
  wall.addColorStop(0, '#ddd1b7');
  wall.addColorStop(0.55, '#cbbc9c');
  wall.addColorStop(1, '#ac9a78');
  c.fillStyle = wall;
  c.fillRect(0, 0, W, H);
  // 板の継ぎ目（縦羽目板）
  for (var pk = 1; pk < 8; pk++) {
    var kx = Math.round(pk * (W / 8)) + 0.5;
    c.strokeStyle = 'rgba(96,70,36,.16)';
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(kx, 0); c.lineTo(kx, BARREL_TOP); c.stroke();
    c.strokeStyle = 'rgba(255,247,228,.3)';
    c.beginPath(); c.moveTo(kx + 1.5, 0); c.lineTo(kx + 1.5, BARREL_TOP); c.stroke();
  }
  c.save();
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = buildWashiPattern(c);
  c.fillRect(0, 0, W * 2, H * 2);
  c.restore();

  // ---- 暖簾 ----
  var NOREN_H = 150, ROD_Y = 12;
  // 竹の掛け竿
  var rod = c.createLinearGradient(0, ROD_Y - 4, 0, ROD_Y + 4);
  rod.addColorStop(0, '#c9a86a');
  rod.addColorStop(0.5, '#9d7c42');
  rod.addColorStop(1, '#6f5527');
  c.fillStyle = rod;
  c.fillRect(6, ROD_Y - 4, W - 12, 8);

  var chars = t('noren') || TXT.en.noren;   // 屋号。日本語以外はローマ字で四つに割る
  var nx = 16, nw = (W - 32 - 3 * 5) / 4;
  for (var pn = 0; pn < 4; pn++) {
    var px = nx + pn * (nw + 5);
    var ng = c.createLinearGradient(px, ROD_Y, px + nw, ROD_Y + NOREN_H);
    ng.addColorStop(0, '#22456b');
    ng.addColorStop(0.5, '#173250');
    ng.addColorStop(1, '#0f2339');
    c.fillStyle = ng;
    c.beginPath();
    c.moveTo(px, ROD_Y);
    c.lineTo(px + nw, ROD_Y);
    c.lineTo(px + nw, ROD_Y + NOREN_H - 6);
    // 裾はわずかに揺れる
    c.quadraticCurveTo(px + nw * 0.5, ROD_Y + NOREN_H + (pn % 2 ? 4 : -3),
                       px, ROD_Y + NOREN_H - 5);
    c.closePath();
    c.fill();
    // 織りの縦筋
    c.save();
    c.clip();
    c.strokeStyle = 'rgba(255,255,255,.05)';
    c.lineWidth = 1;
    for (var wv = 0; wv < 6; wv++) {
      c.beginPath();
      c.moveTo(px + 6 + wv * (nw / 6), ROD_Y);
      c.lineTo(px + 6 + wv * (nw / 6), ROD_Y + NOREN_H);
      c.stroke();
    }
    c.restore();
    // 白抜きの文字
    c.fillStyle = '#f4efe2';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    // 一字とは限らないので、暖簾の幅に収まるまで詰める
    var fz = 46;
    c.font = '600 ' + fz + 'px ' + F_MIN;
    while (fz > 12 && c.measureText(chars[pn]).width > nw - 12) {
      fz -= 2;
      c.font = '600 ' + fz + 'px ' + F_MIN;
    }
    c.fillText(chars[pn], px + nw / 2, ROD_Y + NOREN_H * 0.52);
  }
  // 暖簾の落とす影
  var nsh = c.createLinearGradient(0, ROD_Y + NOREN_H - 4, 0, ROD_Y + NOREN_H + 44);
  nsh.addColorStop(0, 'rgba(40,25,8,.22)');
  nsh.addColorStop(1, 'rgba(40,25,8,0)');
  c.fillStyle = nsh;
  c.fillRect(0, ROD_Y + NOREN_H - 4, W, 48);

  // 桶が壁に落とす影
  var bsh = c.createLinearGradient(0, BARREL_TOP, 0, BARREL_TOP - 30);
  bsh.addColorStop(0, 'rgba(40,25,8,.28)');
  bsh.addColorStop(1, 'rgba(40,25,8,0)');
  c.fillStyle = bsh;
  c.fillRect(0, BARREL_TOP - 30, W, 30);

  // ---- すし桶の中（和紙）----
  var inner = c.createLinearGradient(0, BARREL_TOP, 0, FLOOR);
  inner.addColorStop(0, '#fefdfa');
  inner.addColorStop(0.5, '#f7f1e3');
  inner.addColorStop(1, '#e7dcc2');
  c.fillStyle = inner;
  c.fillRect(WALL, BARREL_TOP, W - WALL * 2, FLOOR - BARREL_TOP);

  c.save();
  c.beginPath();
  c.rect(WALL, BARREL_TOP, W - WALL * 2, FLOOR - BARREL_TOP);
  c.clip();

  // 桶の底の簀（すのこ）
  c.strokeStyle = 'rgba(150,115,65,.13)';
  c.lineWidth = 1;
  for (var i = 0; i < 6; i++) {
    var sy = FLOOR - 7 - i * 13;
    c.beginPath();
    c.moveTo(WALL + 7, sy + 0.5);
    c.lineTo(W - WALL - 7, sy + 0.5);
    c.stroke();
  }
  // 内側の陰
  function shade(x0, y0, x1, y1, w2, h2, a) {
    var g = c.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, 'rgba(88,62,26,' + a + ')');
    g.addColorStop(1, 'rgba(88,62,26,0)');
    c.fillStyle = g;
    c.fillRect(x0 < x1 ? x0 : x1, y0 < y1 ? y0 : y1, w2, h2);
  }
  shade(0, BARREL_TOP, 0, BARREL_TOP + 54, W, 54, .2);
  shade(0, FLOOR, 0, FLOOR - 70, W, 70, .17);
  shade(WALL, 0, WALL + 24, 0, 24, H, .14);
  shade(W - WALL, 0, W - WALL - 24, 0, 24, H, .14);

  // 落款
  var seal = document.createElement('canvas');
  seal.width = seal.height = 72;
  var sc = seal.getContext('2d');
  sc.fillStyle = '#c8402f';
  rr(sc, 4, 4, 64, 64, 10);
  sc.fill();
  sc.globalCompositeOperation = 'destination-out';
  sc.font = '600 44px ' + F_MIN;
  sc.textAlign = 'center';
  sc.textBaseline = 'middle';
  sc.fillText('寿', 36, 38);
  c.save();
  c.globalAlpha = 0.13;
  c.drawImage(seal, W - WALL - 42, BARREL_TOP + 26, 26, 26);
  c.restore();
  c.restore();

  // ---- 桶の枠（白木）----
  var wood = c.createLinearGradient(0, BARREL_TOP, 0, H);
  wood.addColorStop(0, '#eed8b2');
  wood.addColorStop(0.4, '#d0ae7d');
  wood.addColorStop(1, '#ab875a');
  c.fillStyle = wood;
  c.fillRect(0, BARREL_TOP, WALL, H - BARREL_TOP);
  c.fillRect(W - WALL, BARREL_TOP, WALL, H - BARREL_TOP);
  c.fillRect(0, H - WALL, W, WALL);

  // 木目
  c.strokeStyle = 'rgba(126,90,44,.22)';
  c.lineWidth = 1;
  for (var g2 = 0; g2 < 3; g2++) {
    var gx = 3 + g2 * 4;
    c.beginPath();
    c.moveTo(gx + 0.5, BARREL_TOP);
    c.bezierCurveTo(gx + 3, BARREL_TOP + (H - BARREL_TOP) * 0.35,
                    gx - 3, BARREL_TOP + (H - BARREL_TOP) * 0.7, gx + 1, H);
    c.stroke();
    c.beginPath();
    c.moveTo(W - gx - 0.5, BARREL_TOP);
    c.bezierCurveTo(W - gx - 3, BARREL_TOP + (H - BARREL_TOP) * 0.38,
                    W - gx + 3, BARREL_TOP + (H - BARREL_TOP) * 0.74, W - gx - 1, H);
    c.stroke();
  }
  for (var g3 = 0; g3 < 2; g3++) {
    var gy = H - WALL + 4 + g3 * 4;
    c.beginPath();
    c.moveTo(0, gy + 0.5);
    c.bezierCurveTo(W * 0.3, gy + 2.5, W * 0.7, gy - 1.5, W, gy + 0.5);
    c.stroke();
  }

  // 箍（たが）
  [BARREL_TOP + Math.round((H - BARREL_TOP) * 0.32),
   BARREL_TOP + Math.round((H - BARREL_TOP) * 0.74)].forEach(function (hy) {
    var hg = c.createLinearGradient(0, hy, 0, hy + 4);
    hg.addColorStop(0, '#c08145');
    hg.addColorStop(0.45, '#96602d');
    hg.addColorStop(1, '#77471f');
    c.fillStyle = hg;
    c.fillRect(0, hy, WALL, 4);
    c.fillRect(W - WALL, hy, WALL, 4);
    c.fillStyle = 'rgba(255,228,175,.3)';
    c.fillRect(0, hy, WALL, 1);
    c.fillRect(W - WALL, hy, WALL, 1);
  });

  // 桶の縁（木口）
  var rim = c.createLinearGradient(0, BARREL_TOP - 3, 0, BARREL_TOP + 5);
  rim.addColorStop(0, '#fff3dd');
  rim.addColorStop(1, '#c8a674');
  c.fillStyle = rim;
  c.fillRect(0, BARREL_TOP - 3, WALL, 8);
  c.fillRect(W - WALL, BARREL_TOP - 3, WALL, 8);
  c.strokeStyle = 'rgba(105,74,34,.6)';
  c.lineWidth = 1;
  c.strokeRect(0.5, BARREL_TOP - 2.5, WALL - 1, 7);
  c.strokeRect(W - WALL + 0.5, BARREL_TOP - 2.5, WALL - 1, 7);

  // 桶の内側の線
  c.strokeStyle = 'rgba(105,74,34,.5)';
  c.beginPath();
  c.moveTo(WALL + 0.5, BARREL_TOP);
  c.lineTo(WALL + 0.5, FLOOR + 0.5);
  c.lineTo(W - WALL - 0.5, FLOOR + 0.5);
  c.lineTo(W - WALL - 0.5, BARREL_TOP);
  c.stroke();
}

/* ---- デッドライン：文字を置かず、朱の目印だけで示す ---- */
function drawDeadline(danger) {
  ctx.save();
  ctx.setLineDash([2, 7]);
  ctx.lineWidth = 1;
  ctx.strokeStyle = danger ? 'rgba(200,64,47,.9)' : 'rgba(200,64,47,.26)';
  ctx.beginPath();
  ctx.moveTo(WALL + 10, DEAD_Y + 0.5);
  ctx.lineTo(W - WALL - 10, DEAD_Y + 0.5);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = danger ? '#c8402f' : 'rgba(200,64,47,.5)';
  ctx.beginPath();
  ctx.moveTo(WALL - 1, DEAD_Y - 5.5); ctx.lineTo(WALL + 10, DEAD_Y); ctx.lineTo(WALL - 1, DEAD_Y + 5.5);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W - WALL + 1, DEAD_Y - 5.5); ctx.lineTo(W - WALL - 10, DEAD_Y); ctx.lineTo(W - WALL + 1, DEAD_Y + 5.5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---- ガイドライン ---- */
function drawGuide() {
  if (!current || state !== 'ready') return;
  var hw = itemHalfWidth(current);
  ctx.save();
  ctx.setLineDash([2, 8]);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(40,52,68,.22)';
  ctx.beginPath();
  ctx.moveTo(previewX, previewY + itemHalfHeight(current) + 6);
  ctx.lineTo(previewX, FLOOR - 4);
  ctx.stroke();
  ctx.setLineDash([]);
  // 着地の見当（幅を示す横線と両端の爪）
  ctx.strokeStyle = 'rgba(40,52,68,.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(previewX - hw, FLOOR - 3.5);
  ctx.lineTo(previewX + hw, FLOOR - 3.5);
  ctx.moveTo(previewX - hw + 0.5, FLOOR - 9);
  ctx.lineTo(previewX - hw + 0.5, FLOOR - 3.5);
  ctx.moveTo(previewX + hw - 0.5, FLOOR - 9);
  ctx.lineTo(previewX + hw - 0.5, FLOOR - 3.5);
  ctx.stroke();
  ctx.restore();
}

/* ---- 待機中のネタ ---- */
function drawPreview() {
  if (!current || state !== 'ready') return;
  ctx.save();
  ctx.translate(previewX, previewY);
  ctx.globalAlpha = 0.97;
  paintSprite(ctx, spriteOf(current));
  ctx.restore();
  if (current.gari) {
    ctx.save();
    ctx.fillStyle = 'rgba(200,64,47,.72)';
    ctx.font = '600 9px ' + F_MIN;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(t('gari'), previewX, previewY + 12);
    ctx.restore();
  }
}

/* ---- NEXT プレビュー ---- */
var nextCv = document.getElementById('nextCv');
var nctx = nextCv.getContext('2d');
function drawNextPreview() {
  var S = nextCv.width;
  nctx.setTransform(1, 0, 0, 1, 0, 0);
  nctx.clearRect(0, 0, S, S);
  if (!next) return;
  var sp = spriteOf(next);
  var k = (S * 0.86) / Math.max(sp.w, sp.h);
  nctx.save();
  nctx.translate(S / 2, S / 2);
  nctx.scale(k, k);
  paintSprite(nctx, sp);
  nctx.restore();
}

/* ============================================================
   15. メインループ
   ============================================================ */
var lastTime = performance.now();
var acc = 0;
var STEP = 1000 / 60;

function loop(now) {
  requestAnimationFrame(loop);
  var dt = now - lastTime;
  lastTime = now;
  if (dt > 200) dt = 200;

  if (state !== 'title' && state !== 'over' && state !== 'paused') {
    acc += dt;
    var guard = 0;
    while (acc >= STEP && guard < 4) {
      Engine.update(engine, STEP);
      acc -= STEP; guard++;
    }
    if (acc > STEP * 4) acc = 0;
    flushOps();
    sweepStrays();
    orderTick(dt);
    keyMove(dt / 1000);
    checkGameOver(dt / 1000);
  }
  stepParticles();
  stepFloats();
  render();
}

/* 桶の外へこぼれたネタを片付ける */
function sweepStrays() {
  var bodies = Composite.allBodies(world);
  for (var i = 0; i < bodies.length; i++) {
    var b = bodies[i];
    if (b.isStatic || !(b.sushi || b.gari)) continue;
    if (b.position.y > H + 60 || b.position.x < -60 || b.position.x > W + 60) {
      Composite.remove(world, b);
    }
  }
}

function checkGameOver(dtSec) {
  var bodies = Composite.allBodies(world);
  var breach = false;
  var now = performance.now();
  var pileTop = FLOOR;
  for (var i = 0; i < bodies.length; i++) {
    var b = bodies[i];
    var meta = b.sushi || b.gari;
    if (!meta || b.isStatic) continue;
    if (b.bounds.min.y < pileTop && Math.abs(b.velocity.y) < 1.2) pileTop = b.bounds.min.y;
    if (now - meta.born < 900) continue;           // 落下直後は猶予
    if (b.bounds.min.y < DEAD_Y) breach = true;
  }
  bgmIntensity((FLOOR - pileTop) / (FLOOR - DEAD_Y), deadTimer > 0.05);
  if (breach) {
    deadTimer += dtSec;
    if (deadTimer >= DEAD_LIMIT) gameOver();
  } else {
    deadTimer = Math.max(0, deadTimer - dtSec * 2);
  }
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.drawImage(barrelCv, 0, 0, W, H);

  var danger = deadTimer > 0.05;
  drawDeadline(danger);
  drawGuide();

  // ボディ
  var bodies = Composite.allBodies(world);
  for (var i = 0; i < bodies.length; i++) {
    var b = bodies[i];
    if (b.isStatic) continue;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    // 影
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#4a3418';
    ctx.beginPath();
    var hh = b.gari ? GARI.r : SUSHI[b.sushi.level].hh;
    var hw = b.gari ? GARI.r : SUSHI[b.sushi.level].hw;
    ctx.ellipse(2, hh * 0.55 + 2, hw * 0.92, hh * 0.55, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();

    paintSprite(ctx, b.gari ? gariSprite : sprites[b.sushi.level]);
    ctx.restore();
  }

  drawOrder();
  drawPreview();

  // パーティクル
  for (var p2 = 0; p2 < particles.length; p2++) {
    var p = particles[p2];
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    if (p.sq) {
      ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
    } else {
      ctx.beginPath(); ctx.arc(0, 0, p.r * 0.85, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 加算点
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var fi = 0; fi < floats.length; fi++) {
    var f = floats[fi];
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life * 1.6);
    ctx.fillStyle = f.c;
    ctx.font = '700 16px ' + F_GO;
    ctx.fillText(f.t, f.x, f.y);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 危険警告：赤ベタではなく、上から差す朱の光で知らせる
  if (danger && state !== 'over') {
    var remain = Math.max(0, DEAD_LIMIT - deadTimer);
    var pulse = 0.45 + 0.55 * Math.abs(Math.sin(performance.now() / 165));
    ctx.save();
    var wg = ctx.createLinearGradient(0, BARREL_TOP, 0, BARREL_TOP - 96);
    wg.addColorStop(0, 'rgba(200,64,47,' + (0.42 * pulse).toFixed(3) + ')');
    wg.addColorStop(1, 'rgba(200,64,47,0)');
    ctx.fillStyle = wg;
    ctx.fillRect(WALL, BARREL_TOP - 96, W - WALL * 2, 96);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,250,242,' + (0.55 + 0.45 * pulse).toFixed(3) + ')';
    ctx.font = '600 17px ' + F_MIN;
    ctx.fillText(t('danger'), W / 2, BARREL_TOP - 62);
    ctx.font = '200 32px ' + F_GO;
    ctx.fillText(remain.toFixed(1), W / 2, BARREL_TOP - 30);
    ctx.restore();
  }
}

/* ============================================================
   16. ゲームオーバー / リスタート
   ============================================================ */
/* 結果札の文言。言葉を変えた時にも呼び直す */
function showResult() {
  var ri = rankIndex(score);
  document.getElementById('rankName').textContent = rankName(ri);
  document.getElementById('rankNote').textContent =
    (gameMode === 'order' ? t('modeTag') : '') + rankNote(ri) +
    (gameMode === 'order' && chainBest >= 2
      ? t('bestChain') + chainBest + t('bestChainTail') : '');
}
function gameOver() {
  if (state === 'over') return;
  state = 'over';
  pointerDown = false;
  showResult();
  document.getElementById('finalScore').textContent = fmt(score);
  document.getElementById('finalHi').textContent = fmt(hiScore);
  document.getElementById('overModal').hidden = false;
  seOver();
  bgmStop(0.8);
  countPlay();
  adGameStop();
  document.body.classList.remove('playing');

  // 名前を登録済みなら自動で送る。初回は本人が押すまで送らない
  if (rankApi) {
    sendNote.textContent = '';
    var savedName = cleanName(lsGet('sushitsumu.name') || '');
    nameInput.value = savedName;
    if (savedName && score > 0) doSubmit();
  }

  for (var i = 0; i < bodies.length; i++) {

    }

}

function resetGame() {
  var bodies = Composite.allBodies(world);
  for (var i = 0; i < bodies.length; i++) {
    if (!bodies[i].isStatic) Composite.remove(world, bodies[i]);
  }
  pendingOps.length = 0;
  particles.length = 0;
  floats.length = 0;
  score = 0; scoreEl.textContent = '0';
  rankShown = 0; startHi = hiScore; hiBeaten = false;
  deadTimer = 0;
  previewX = W / 2; previewY = DROP_Y;
  pointerDown = false; dropLock = false;
  lastPtr = { x: W / 2, y: DROP_Y + FINGER_OFFSET_Y };
  order = null; orderWait = 0; orderMult = 1; orderStreak = 0; maxLevelMade = 2;
  // 一戦ごとに種を引き直し、控えも白紙に戻す
  seedItems((Math.random() * 0x100000000) >>> 0);
  recReset();
  chainBest = 0;
  current = null; next = null;
  state = 'ready';
  acc = 0;
  lastTime = performance.now();
  nextTurn();
}

document.body.classList.add('titling');

function startFromTitle(mode) {

document.getElementById('startOrderBtn').addEventListener('click', function (e) {

/* ---- 中断 ----
   途中でやめる道が無かった。やめても一回は一回と数えるので、
   広告までの勘定は進む（そうしないと、やめ続ければ広告を避けられる）。 */
var pausedFrom = null;
function pauseGame() {
  if (adBusy || state === 'title' || state === 'over' || state === 'paused') return;
  pausedFrom = state;
  state = 'paused';
  pointerDown = false;
  keyDir = 0;
  bgmStop(0.3);
  document.getElementById('pauseModal').hidden = false;
}
function resumeGame() {
  if (state !== 'paused') return;
  document.getElementById('pauseModal').hidden = true;
  state = pausedFrom || 'ready';
  pausedFrom = null;
  lastTime = performance.now();     // 止まっていた分をまとめて進めない
  acc = 0;
  unlockAudio();
  bgmStart();
}
function quitGame() {
  if (state !== 'paused') return;
  document.getElementById('pauseModal').hidden = true;
  countPlay();                      // 途中でやめても、遊んだ一回は一回
  toTitle();
}
document.getElementById('pauseBtn').addEventListener('click', function (e) {

});

/* 別のタブに移った時。締切が進んで、戻ったら終わっていた、では困る。
   音も止める（ポータルは裏に回ったゲームが鳴り続けるのを嫌う） */
document.addEventListener('visibilitychange', function () {

    keyDir = 0;

/* ============================================================
   17. お品書き（注文モード）
   大将が注文を出し、その通りのネタを時間内に作ればボーナス点が入る。
   続けて捌くほど「のれん」倍率が上がり、落とすと一に戻る。
   注文の木札は、暖簾と桶のあいだの壁に掛ける。
   ============================================================ */
var gameMode = 'normal';     // normal | order
var order = null;            // {level, need, done, span, until}
var orderMult = 1;
var orderStreak = 0;
var orderWait = 0;           // 次の注文までの間(ms)
var maxLevelMade = 2;        // これまでに作れた最大レベル(0基点)

/* 連鎖（両モード共通）
   落とした直後の合体を数えると、ただの連打が連鎖になってしまう。
   「合体で生まれた駒が、間を置かずさらに合体した時」だけを連鎖と数える。 */
var CHAIN_WINDOW = 1400;   // 生まれてからこの時間内に合体すれば繋がったとみなす(ms)
var CHAIN_CAP = 4;         // 倍率の上限
var chainBest = 0;         // そのプレイでの最高連鎖

function chainMult(n) { return Math.min(CHAIN_CAP, 1 + (n - 1) * 0.7); }

var CHAIN_KANJI = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function chainLabel(n) {
  if (n >= 5) return t('megaChain');
  return (t('chainKanji') ? CHAIN_KANJI[n] : String(n)) + t('chainSuffix');
}

/* 合体しようとしている二つが、直前の合体から続いているか */
function chainDepthOf(a, b) {
  var now = performance.now(), inherited = 0, i, bd, list = [a, b];
  for (i = 0; i < 2; i++) {
    bd = list[i];
    if (bd.sushi && bd.sushi.mergedAt && now - bd.sushi.mergedAt < CHAIN_WINDOW) {
      if (bd.sushi.chain > inherited) inherited = bd.sushi.chain;
    }
  }
  return inherited + 1;
}

function orderReward(L) { return MERGE_SCORE[L - 1] * 6; }

function newOrder() {
  // 作れる見込みのある範囲から選ぶ。届かない注文は出さない
  var top = Math.min(maxLevelMade + 1, SUSHI.length - 2);
  var lo = Math.max(1, top - 2);
  var L = lo + Math.floor(Math.random() * (top - lo + 1));
  var need = L <= 3 ? 2 + Math.floor(Math.random() * 2)
           : L <= 6 ? 1 + Math.floor(Math.random() * 2)
           : 1;
  var sec = 18 + L * 4 + (need - 1) * 10;
  order = { level: L, need: need, done: 0, span: sec * 1000, until: performance.now() + sec * 1000 };
}

function orderTick(dtMs) {
  if (gameMode !== 'order' || state === 'title' || state === 'over') return;
  if (orderWait > 0) {
    orderWait -= dtMs;
    if (orderWait <= 0) newOrder();
    return;
  }
  if (!order) { newOrder(); return; }
  if (performance.now() > order.until) {
    showPop(t('orderFail'), 1);
    recAdd('x');
    seOrderFail();
    orderStreak = 0;
    orderMult = 1;
    order = null;
    orderWait = 900;
  }
}

/* 合体で level が出来たときに呼ぶ */
function orderMade(level) {
  if (level > maxLevelMade) maxLevelMade = level;
  if (gameMode !== 'order' || !order || level !== order.level) return;
  order.done++;
  if (order.done < order.need) { seOrderStep(); return; }

  var bonus = Math.round(orderReward(order.level) * order.need * orderMult);
  recAdd('o', order.level, order.need);
  addScore(bonus);
  addFloat(W / 2, BARREL_TOP - 46, '+' + fmt(bonus), '#c8402f');
  orderStreak++;
  orderMult = Math.min(3, 1 + orderStreak * 0.5);
  var ch = t('cheers');
  showPop(orderStreak >= 4 ? t('cheerTop') : ch[Math.min(orderStreak, ch.length) - 1], 1);
  seOrder(orderStreak);
  burst(W / 2, BARREL_TOP - 34, ['#c8402f', '#ffd76a', '#fffaf0'], 34, 5.5);
  order = null;
  orderWait = 1100;
}

/* 注文の木札（壁に掛ける） */
function drawOrder() {
  if (gameMode !== 'order') return;
  var PW = 224, PH = 78;
  var px = (W - PW) / 2, py = BARREL_TOP - 98;   // 待機中のネタと重ならない位置

  // 掛け紐
  ctx.strokeStyle = 'rgba(70,45,16,.5)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(px + PW * 0.5 - 20, py - 12);
  ctx.lineTo(px + PW * 0.5, py + 2);
  ctx.lineTo(px + PW * 0.5 + 20, py - 12);
  ctx.stroke();

  // 木札
  var wg = ctx.createLinearGradient(0, py, 0, py + PH);
  wg.addColorStop(0, '#f3e0bd');
  wg.addColorStop(0.5, '#e3caa0');
  wg.addColorStop(1, '#c8a878');
  ctx.fillStyle = wg;
  rr(ctx, px, py, PW, PH, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(96,66,26,.6)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,250,232,.55)';
  ctx.lineWidth = 1;
  rr(ctx, px + 3.5, py + 3.5, PW - 7, PH - 7, 4);
  ctx.stroke();

  ctx.textBaseline = 'middle';

  if (!order) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(90,62,24,.75)';
    ctx.font = '600 15px ' + F_MIN;
    ctx.font = (lang === 'en' ? '600 13px ' : '600 15px ') + F_MIN;
    ctx.fillText(t('orderWait'), px + PW / 2, py + PH / 2);
    return;
  }

  // ネタ
  var sp = sprites[order.level];
  var k = Math.min(52 / sp.w, 46 / sp.h);
  ctx.save();
  ctx.translate(px + 36, py + 32);
  ctx.scale(k, k);
  paintSprite(ctx, sp);
  ctx.restore();

  // 一行目：見出しと、のれん倍率
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(120,86,38,.85)';
  ctx.font = '600 9.5px ' + F_MIN;
  ctx.fillText(t('orderHead'), px + 70, py + 15);
  if (orderMult > 1) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#c8402f';
    ctx.font = '700 12px ' + F_GO;
    ctx.fillText(t('noren2') + orderMult.toFixed(1), px + PW - 12, py + 15);
  }

  // 二行目：品名。長い名前は札からはみ出すので自動で縮める
  ctx.textAlign = 'left';
  ctx.fillStyle = '#4a3212';
  var nm = sushiName(order.level);
  var avail = PW - 70 - 14, fs = 17;
  ctx.font = '600 ' + fs + 'px ' + F_MIN;
  while (fs > 11 && ctx.measureText(nm).width > avail) {
    fs -= 1;
    ctx.font = '600 ' + fs + 'px ' + F_MIN;
  }
  ctx.fillText(nm, px + 70, py + 36);

  // 三行目：貫数を丸で数える
  for (var i = 0; i < order.need; i++) {
    var cx = px + 75 + i * 15, cy = py + 55;
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, 6.2832);
    ctx.fillStyle = i < order.done ? '#c8402f' : 'rgba(120,86,38,.22)';
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(120,86,38,.85)';
  ctx.font = '600 10px ' + F_MIN;
  ctx.fillText(order.need + t('pieces'), px + 75 + order.need * 15 + 3, py + 56);

  // 残り時間
  var left = Math.max(0, order.until - performance.now());
  var ratio = Math.max(0, Math.min(1, left / order.span));
  var bx = px + 70, bw = PW - 82;
  ctx.fillStyle = 'rgba(120,86,38,.2)';
  rr(ctx, bx, py + PH - 16, bw, 5, 2.5);
  ctx.fill();
  ctx.fillStyle = ratio < 0.25 ? '#c8402f' : '#8a6a2c';
  rr(ctx, bx, py + PH - 16, Math.max(2, bw * ratio), 5, 2.5);
  ctx.fill();
}

/* ============================================================
   18. オンライン番付
   置き場所によって裏側が変わるので、呼び出し口を一つに絞る。
     ・アーティファクト  → window.claude の共有データベース
     ・ポータル / 自前   → RANK_API に置いた HTTP サーバ
   どちらも無ければ番付の UI ごと隠して、端末内のハイスコアだけで動く。
   ============================================================ */
var RANK_API  = 'https://sushitsumu-rank.murakamikoshin.workers.dev';   // 番付サーバー（server/ 参照）
var RANK_SHOW = 20;      // 一覧に出す人数
var RANK_SCAN = 100;     // 自分の順位を数えるために見る範囲
var rankApi = null;      // { top(kind,mode,n), submit(id,name,score,kind) }
var rankMode = 'day';
var rankKind = 'normal';     // どちらの遊び方の番付か
var rankBusy = false;

/* 日付は日本時間で切る。閲覧者の時計に任せると日替わりがばらつく */
function jstDay(ms) {
  var d = new Date((ms || Date.now()) + 9 * 3600 * 1000);
  return d.getUTCFullYear() + '-' +
         ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' +
         ('0' + d.getUTCDate()).slice(-2);
}
/* ---- 控えの置き場 ----
   ポータルはゲームを別ドメインの iframe で動かすので、ブラウザによっては
   localStorage が塞がれる。高得点も図鑑も毎回消えてしまう。
   ポータル側の保存棚があればそちらを使い、無ければ今まで通り端末に置く。
   どちらも使えない時は黙って諦める（読めなくても遊べる作りにしてある）。 */
var keepStore = null;
function keeper() {
  if (keepStore) return keepStore;
  try {
    var CG = window.CrazyGames && window.CrazyGames.SDK;
    if (CG && CG.data && typeof CG.data.getItem === 'function') keepStore = CG.data;
  } catch (e) {}
  return keepStore;               // 見つからない間は毎回探しにいく（SDK は後から来る）
}
function lsGet(k) {
  var d = keeper();
  try { return d ? d.getItem(k) : localStorage.getItem(k); } catch (e) { return null; }
}
function lsSet(k, v) {
  var d = keeper();
  try { if (d) d.setItem(k, v); else localStorage.setItem(k, v); } catch (e) {}
}

function playerId() {
  var v = lsGet('sushitsumu.pid');
  if (!v) {
    v = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    lsSet('sushitsumu.pid', v);
  }
  return v;
}
/* 他人が書いた名前は信用しない。制御文字を落として長さを切る */
function cleanName(n) {
  var src = String(n == null ? '' : n), out = '', i, c;
  for (i = 0; i < src.length && out.length < 12; i++) {
    c = src.charCodeAt(i);
    if (c < 32 || c === 127) continue;
    out += src.charAt(i);
  }
  return out.trim().slice(0, 12);
}
function rankFields(kind) {
  return kind === 'order'
    ? { all: 'bestO', day: 'dayBestO' }
    : { all: 'best',  day: 'dayBest'  };
}

/* ---- 裏側 その一：アーティファクトの共有データベース ---- */
function claudeBackend(db) {
  return {
    top: function (kind, mode, n) {
      var f = rankFields(kind), col = db.collection('scores');
      var q = mode === 'day'
        ? col.where('day', '==', jstDay()).orderBy(f.day, 'desc').limit(n)
        : col.orderBy(f.all, 'desc').limit(n);
      return q.get().then(function (snap) {
        var out = [];
        if (!snap || !snap.docs) return out;
        snap.docs.forEach(function (d) {
          var r = d.data() || {};
          out.push({
            id: d.id, name: r.name,
            score: Number(mode === 'day' ? r[f.day] : r[f.all]) || 0
          });
        });
        return out;
      });
    },
    /* 一人一文書。文書数が青天井にならないよう、自己ベストだけを持たせる */
    /* 共有DBには辻褄を見る側も順位を数える側も居ないので、手順は使わず順位も返さない */
    submit: function (id, name, sc, kind) {
      var today = jstDay(), f = rankFields(kind), ref = db.doc('scores/' + id);
      return ref.get().then(function (snap) {
        var cur = (snap && snap.exists && snap.data()) || {};
        var sameDay = (cur.day === today);
        // set は全置換なので、触らない側の記録も持ち回す
        var body = {
          name: name, day: today, updatedAt: new Date().toISOString(),
          best:     Number(cur.best)  || 0,
          bestO:    Number(cur.bestO) || 0,
          dayBest:  sameDay ? (Number(cur.dayBest)  || 0) : 0,
          dayBestO: sameDay ? (Number(cur.dayBestO) || 0) : 0
        };
        body[f.all] = Math.max(body[f.all], sc);
        body[f.day] = Math.max(body[f.day], sc);
        return ref.set(body).then(function () { return null; });
      });
    }
  };
}

/* ---- 裏側 その二：自前の HTTP サーバ（server/ の Worker を想定）----
   自己ベストの取り回しは向こう側でやるので、こちらは投げるだけ。 */
function httpBackend(base) {
  function ask(path, opt) {
    return fetch(base + path, opt).then(function (r) {
      if (r.ok) return r.json();
      // 断られた理由は本文に入っている。読めなければ通信の失敗として扱う
      return r.json()['catch'](function () { return {}; }).then(function (body) {
        throw { code: (body && body.error) || (r.status === 429 ? 'busy' : 'http') };
      });
    });
  }
  return {
    top: function (kind, mode, n) {
      return ask('/top?kind=' + encodeURIComponent(kind) +
                 '&mode=' + encodeURIComponent(mode) +
                 '&day='  + encodeURIComponent(jstDay()) +
                 '&limit=' + n).then(function (rows) {
        return (rows || []).map(function (r) {
          return { id: String(r.id), name: r.name, score: Number(r.score) || 0 };
        });
      });
    },
    /* 返り値の順位は向こうが数えたもの。無ければ null（＝こちらで数える） */
    submit: function (id, name, sc, kind) {
      // text/plain で送ると前置きの OPTIONS が要らなくなり、
      // 一回の登録が二呼び出しから一呼び出しに減る。中身は JSON のまま
      return ask('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({
          id: id, name: name, score: sc, kind: kind, day: jstDay(), log: recDump()
        })
      }).then(function (r) {
        return (r && r.rankDay !== undefined)
          ? { day: r.rankDay, all: r.rankAll, scan: r.scan || RANK_SCAN } : null;
      });
    }
  };
}

/* 順位を向こうが数えて返してくれたならそれを使う。
   一覧を二度引かずに済むので、呼び出しも読み込み行数もずっと減る。 */
function afterSubmit(res) {
  loadSidePanel();                     // 自分の名前が載ったはずなので入れ直す
  if (res && res.day !== undefined) {
    showRanks(res.day, res.all, res.scan);
    return Promise.resolve();
  }
  var keep = rankMode;
  rankKind = gameMode;
  rankMode = 'day';
  return myRank().then(function (d) {
    rankMode = 'all';
    return myRank().then(function (a) { return [d, a]; });
  }).then(function (r) {
    rankMode = keep;
    showRanks(r[0], r[1], RANK_SCAN);
  });

function doSubmit() {
  if (!rankApi || rankBusy) return;
  var name = cleanName(nameInput.value);

  lsSet('sushitsumu.name', name);
  rankBusy = true;
  sendNote.textContent = t('sending');
  rankApi.submit(playerId(), name, score, gameMode).then(afterSubmit)['catch'](function (e) {
    var code = e && e.code;
    sendNote.textContent =
      code === 'quota_exceeded' ? t('errFull')      :
      code === 'busy'           ? t('errBusy')      :
      code === 'too-long'       ? t('errTooLong')   :
      code === 'mismatch'       ? t('errMismatch')  :
      t('errNet');

}

/* 広い画面の右柱。いま遊んでいる方の、本日と総合を並べて出す */

function loadRank() {

/* ============================================================
   18.5 寿司図鑑
   作ったことのあるネタだけ姿が見える。まだのものは影だけ。
   端末ごとの控えなので、人それぞれ埋まり方が違う。
   ============================================================ */
var DEX_N = SUSHI.length + 1;        // ネタ 11 種 ＋ ガリ
var GARI_IX = SUSHI.length;
var seen = (function () {
  var v = lsGet('sushitsumu.dex') || '';
  var a = [], i;
  for (i = 0; i < DEX_N; i++) a.push(v.charAt(i) === '1');
  return a;
})();
function markSeen(ix) {
  if (ix < 0 || ix >= DEX_N || seen[ix]) return;
  seen[ix] = true;
  lsSet('sushitsumu.dex', seen.map(function (v) { return v ? '1' : '0'; }).join(''));
}
function dexName(ix) { return ix === GARI_IX ? t('gariName') : netaName(ix); }
function dexSprite(ix) { return ix === GARI_IX ? gariSprite : sprites[ix]; }

/* 影は絵の形そのものから起こす（source-in で抜く） */
function drawDexCell(cv, ix) {
  var sp = dexSprite(ix);
  if (!sp) return;
  var c = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var cw = 56, ch = 40;
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, cw, ch);
  var k = Math.min((cw - 6) / sp.w, (ch - 6) / sp.h, 1.6);
  c.save();
  c.translate(cw / 2, ch / 2);
  c.scale(k, k);
  if (seen[ix]) {
    paintSprite(c, sp);
    c.restore();
    return;
  }
  c.restore();
  // まだのものは影。いったん絵を描いてから、その形だけを塗り潰す
  var tmp = document.createElement('canvas');
  tmp.width = cv.width; tmp.height = cv.height;
  var x = tmp.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.translate(cw / 2, ch / 2);
  x.scale(k, k);
  paintSprite(x, sp);
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalCompositeOperation = 'source-in';
  x.fillStyle = 'rgba(74,50,18,.26)';
  x.fillRect(0, 0, tmp.width, tmp.height);
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.drawImage(tmp, 0, 0);
}

function buildDex() {
  var grid = document.getElementById('dexGrid');
  grid.innerHTML = '';
  var got = 0, i;
  for (i = 0; i < DEX_N; i++) {
    if (seen[i]) got++;
    var cell = document.createElement('div');
    cell.className = 'dexCell' + (seen[i] ? ' got' : '');
    var cv = document.createElement('canvas');
    var nm = document.createElement('div');
    nm.className = 'dexName';
    nm.textContent = seen[i] ? dexName(i) : t('dexUnknown');
    cell.appendChild(cv); cell.appendChild(nm);
    grid.appendChild(cell);
    drawDexCell(cv, i);
  }
  var cnt = document.getElementById('dexCount');
  cnt.innerHTML = '';
  cnt.appendChild(document.createTextNode(t('dexCountPre')));
  var b = document.createElement('b');
  b.textContent = got + t('dexCountMid') + DEX_N;
  cnt.appendChild(b);
  cnt.appendChild(document.createTextNode(t('dexCountPost')));
}

document.getElementById('openDex').addEventListener('click', function (e) {
  e.preventDefault();
  buildDex();
  document.getElementById('dexModal').hidden = false;
});

/* ============================================================
   19. 広告
   ポータル（CrazyGames / Poki / Google H5 Games Ads）に載せた時だけ
   何プレイかに一本、区切りで挟む。SDK が無ければ丸ごと素通りするので、
   単体の index.html でもアーティファクトでも今まで通り動く。
   載せる先が決まったら <head> に SDK の script を一行足すだけでよい。
   ============================================================ */
var AD_EVERY = 5;        // 何プレイごとに一本挟むか
var AD_SKIP  = 1;        // 最初の何プレイは出さないか（第一印象を損ねない）
var adHost = null, adReady = false, adBusy = false;

/* 置き場所を見て裏側を選ぶ。増やす時はここに一つ足すだけ */
function detectAdHost() {
  // ?ad=demo を付けると、SDK が無くても幕の出方だけ確かめられる。
  // ポータルに載せる前に、遊びの流れが途切れないか見るためのもの
  if (/[?&]ad=demo\b/.test(location.search)) return {
    name: 'demo',
    boot: function () {}, start: function () {}, stop: function () {}, happy: function () {},
    show: function () {
      return new Promise(function (done) { setTimeout(done, 3000); });
    }
  };
  var CG = window.CrazyGames && window.CrazyGames.SDK;
  if (CG) return {
    name: 'crazygames',
    boot:  function () { return CG.init ? CG.init() : null; },
    start: function () { try { CG.game.gameplayStart(); } catch (e) {} },
    stop:  function () { try { CG.game.gameplayStop();  } catch (e) {} },
    happy: function () { try { CG.game.happytime();     } catch (e) {} },
    show:  function () {
      return new Promise(function (done) {
        try {
          CG.ad.requestAd('midgame', {
            adFinished: function () { done('done'); },
            adError:    function () { done('error'); }
          });
        } catch (e) { done('error'); }
      });
    }
  };
  var P = window.PokiSDK;
  if (P) return {
    name: 'poki',
    boot:  function () { return P.init ? P.init() : null; },
    start: function () { try { P.gameplayStart(); } catch (e) {} },
    stop:  function () { try { P.gameplayStop();  } catch (e) {} },
    happy: function () {},
    show:  function () {
      try { return Promise.resolve(P.commercialBreak()); } catch (e) { return Promise.resolve('error'); }
    }
  };
  if (typeof window.adBreak === 'function') return {     // Google H5 Games Ads
    name: 'google',
    boot:  function () { try { window.adConfig({ preloadAdBreaks: 'on' }); } catch (e) {} },
    start: function () {}, stop: function () {}, happy: function () {},
    show:  function () {
      return new Promise(function (done) {
        try {
          window.adBreak({
            type: 'next', name: 'between-games',
            adBreakDone: function () { done('done'); }
          });
        } catch (e) { done('error'); }
      });
    }
  };
  return null;
}
function initAds() {
  adHost = detectAdHost();
  if (!adHost) return;
  try {
    Promise.resolve(adHost.boot())
      .then(function () { adReady = true; })['catch'](function () { adReady = true; });
  } catch (e) { adReady = true; }
}
function adGameStart() { if (adHost) adHost.start(); }
function adGameStop()  { if (adHost) adHost.stop();  }
function adHappy()     { if (adHost) adHost.happy(); }

/* 広告のあいだは音を止める。soundOn は触らないので音入/音切の表示は動かない */
function adMute(on) {
  if (!actx) return;
  try { if (on) actx.suspend(); else actx.resume(); } catch (e) {}
}
function adCurtain(on) {
  var el = document.getElementById('adCurtain');
  if (on && adHost && adHost.name === 'demo') {
    el.querySelector('.noren').textContent = t('adTitle') + '（demo）';
  }
  el.hidden = !on;
}
function playCount() { return parseInt(lsGet('sushitsumu.plays') || '0', 10) || 0; }
function countPlay() { lsSet('sushitsumu.plays', String(playCount() + 1)); }

/* 一区切りついた時に呼ぶ。出し終える（あるいは出さないと決める）まで待てる */
function adBreakPoint() {
  var n = playCount();
  if (!adHost || !adReady || adBusy) return Promise.resolve(false);
  if (n <= AD_SKIP || n % AD_EVERY !== 0) return Promise.resolve(false);
  adBusy = true;
  adGameStop();
  adMute(true);
  adCurtain(true);
  return Promise.resolve(adHost.show())['catch'](function () { return 'error'; })
    .then(function () {
      adCurtain(false);
      adMute(false);
      adBusy = false;
      return true;
    });
}

/* 触る端末か、指し示す道具か。遊び方の書き方がこれで変わる */
var coarseQ = window.matchMedia('(pointer: coarse)');

/* 漢字・仮名・ハングルは字間を広げても様になるが、欧文はそうならない */
var WIDE_SCRIPT = { ja:1, ko:1, zh:1 };

/* 印の付いた場所に、選んだ言葉を当てる */
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('title');
  var i, cls = document.body.classList;
  for (i = 0; i < LANGS.length; i++) cls.remove('lang-' + LANGS[i].c);
  cls.add('lang-' + lang);
  cls.toggle('lat', !WIDE_SCRIPT[lang]);
  var el, nodes = document.querySelectorAll('[data-t]');
  for (i = 0; i < nodes.length; i++) {
    el = nodes[i];
    el.textContent = t(el.getAttribute('data-t'));
  }
  nodes = document.querySelectorAll('[data-tp]');
  for (i = 0; i < nodes.length; i++) {
    nodes[i].placeholder = t(nodes[i].getAttribute('data-tp'));
  }
  // 改行を含む二つだけは innerHTML で入れる（表の中身はこちらで書いた文だけ）
  document.getElementById('rotateMsg').innerHTML = t('rotate');
  document.getElementById('libBody').innerHTML = t('libBody');
  applySound();
  document.getElementById('langBtn').textContent = langInfo(lang).s;
  // 「指でなぞって」はマウスの前では嘘になる。言い換えて、鍵盤の案内も足す
  var h1 = document.querySelector('[data-t="hint1"]');
  if (h1 && !coarseQ.matches && TXT[lang] && TXT[lang].hint1m) h1.textContent = TXT[lang].hint1m;
  var hk = document.getElementById('hintKeys');
  hk.hidden = coarseQ.matches;
  if (!hk.hidden) {
    hk.innerHTML = '';
    hk.appendChild(document.createElement('br'));
    hk.appendChild(document.createTextNode(t('hintKeys')));
  }
  // PC のつまみかた。b は書体を変えたいので要素を組んで入れる
  var kb = document.getElementById('kbdHint');
  kb.innerHTML = '';
  [[t('kbdKeys'), t('kbdMove')], [t('kbdDropKey'), t('kbdDrop')]].forEach(function (row, i) {
    if (i) kb.appendChild(document.createElement('br'));
    var b = document.createElement('b');
    b.textContent = row[0];
    kb.appendChild(b);
    kb.appendChild(document.createTextNode(' ' + row[1]));
  });
  document.getElementById('langBtn2Name').textContent = langInfo(lang).n;
  buildBarrel();                       // 暖簾の屋号を書き直す
  if (state === 'over') showResult();  // 結果を開いたまま切り替えた時
  if (current) drawNextPreview();
  if (rankApi && !rankModal.hidden) loadRank();
  loadSidePanel();
  if (!document.getElementById('titleModal').hidden) showTitleProgress();
  var g = document.getElementById('langGrid');
  var on = g.querySelectorAll('button');
  for (i = 0; i < on.length; i++) on[i].classList.toggle('is-on', on[i].dataset.lang === lang);
}
function setLang(c) {
  if (!TXT[c] || c === lang) return;
  lang = c;
  lsSet('sushitsumu.lang', lang);
  applyLang();
}
function buildLangGrid() {
  var g = document.getElementById('langGrid');
  g.innerHTML = '';
  LANGS.forEach(function (L) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = L.n;
    b.dataset.lang = L.c;
    b.addEventListener('click', function () {
      setLang(L.c);
      document.getElementById('langModal').hidden = true;
    });
    g.appendChild(b);
  });
}

/* ============================================================
   20. 起動
   ============================================================ */
seedItems((Math.random() * 0x100000000) >>> 0);
soundOn = lsGet('sushitsumu.snd') !== '0';
lang = pickLang();
buildLangGrid();
function openLangModal(e) {
  e.preventDefault();
  document.getElementById('langModal').hidden = false;
}
document.getElementById('langBtn').addEventListener('click', openLangModal);
document.getElementById('langBtn2').addEventListener('click', openLangModal);
document.getElementById('closeLang').addEventListener('click', function () {
  document.getElementById('langModal').hidden = true;
});
document.getElementById('sndBtn').addEventListener('click', function (e) {
  e.preventDefault(); toggleSound();
});
initRanking();
initAds();
buildSprites();
buildBarrel();
applyLang();
resize();
// 明朝が遅れて読み込まれた場合、文字を含む絵（寿）を焼き直す
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () {
    buildSprites();
    buildBarrel();
  })['catch'](function () {});
}
setTimeout(resize, 60);
setTimeout(resize, 400);
showTitleProgress();
next = rollItem();
drawNextPreview();
requestAnimationFrame(loop);

})();
</script>
