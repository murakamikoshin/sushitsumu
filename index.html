<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- iOS: 拡大禁止 + ノッチ領域まで描画(viewport-fit=cover) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3b2415">
<!-- iOS: ホーム画面追加 / WKWebView フルスクリーン -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="すし積む">
<meta name="format-detection" content="telephone=no,address=no,email=no,date=no">
<title>すし積む</title>
<style>
/* ============================================================
   すし積む  -  iOS(Safari / WKWebView) 最適化 落ち物合体パズル
   意匠：藍の壁に白木のすし桶。差し色は朱と金のみ。
   ============================================================ */

:root{
  --sumi:  #0a121a;   /* 墨紺 */
  --washi: #faf6ec;   /* 和紙 */
  --kiji:  #e6cda6;   /* 白木 */
  --shu:   #c8402f;   /* 朱 */
  --kin:   #c9a227;   /* 金 */
  --mincho:"Hiragino Mincho ProN","ヒラギノ明朝 ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Yu Gothic",sans-serif;
}

/* ---- リセット & iOS挙動の完全封じ込め ---- */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  /* ダブルタップ拡大・スクロール・ピンチを全部殺す */
  touch-action: none;
  -ms-touch-action: none;
  /* 長押しでのテキスト選択・コールアウト(コピー/検索メニュー)を禁止 */
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  /* タップ時の青いハイライトを消す */
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  -webkit-user-drag: none;
}

html, body {
  width: 100%;
  height: 100%;
  height: -webkit-fill-available;   /* iOS Safari のアドレスバー対策 */
  overflow: hidden;
  /* 引っ張った時のバウンス(ラバーバンド)を禁止 */
  overscroll-behavior: none;
  -webkit-overflow-scrolling: auto;
  position: fixed;
  inset: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: var(--mincho);
  color: var(--washi);
  background-color: var(--sumi);
  /* 藍の壁。極細の織り目だけ乗せる */
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.014) 0 1px, transparent 1px 5px),
    radial-gradient(135% 105% at 50% -15%, #2d5175 0%, #18304a 40%, #0a121a 100%);
  overscroll-behavior: none;
}

/* ---- ルートレイアウト（セーフエリア対応） ---- */
#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  /* Notch / Dynamic Island / ホームバー を避ける */
  padding-top:    calc(env(safe-area-inset-top, 0px)    + 10px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left:   calc(env(safe-area-inset-left, 0px)   + 14px);
  padding-right:  calc(env(safe-area-inset-right, 0px)  + 14px);
}

/* ---- ヘッダー：枠を持たせず、字組みだけで見せる ---- */
.hud {
  transition: opacity .4s ease;
  flex: 0 0 auto;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 0 2px 14px;
}
.hud-r { display: flex; flex-direction: column; align-items: center; gap: 5px; }

.lbl {
  font-size: 9.5px;
  letter-spacing: .34em;
  text-indent: .34em;
  color: rgba(230,205,166,.72);
  line-height: 1;
}
.score {
  font-family: var(--gothic);
  font-weight: 300;
  font-size: 33px;
  line-height: 1.05;
  margin-top: 6px;
  color: var(--washi);
  font-variant-numeric: tabular-nums;
}
.hi { font-size: 10px; letter-spacing: .14em; color: rgba(250,246,236,.46); margin-top: 5px; }
.hi b {
  font-family: var(--gothic); font-weight: 400; font-size: 11.5px;
  letter-spacing: 0; color: rgba(250,246,236,.7);
}

/* NEXT は白木の丸盆に乗せる */
.tray {
  width: 52px; height: 52px; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #fdfaf3 0%, #efe3ca 68%, #e0d0ae 100%);
  box-shadow: 0 3px 12px rgba(0,0,0,.42), inset 0 0 0 1px rgba(201,162,39,.5);
  display: flex; align-items: center; justify-content: center;
}
#nextCv { width: 42px; height: 42px; display: block; }
body.titling .hud { opacity: 0; pointer-events: none; }

/* ---- ステージ（すし桶キャンバス） ---- */
.stage {
  flex: 1 1 auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}
#game {
  display: block;
  border-radius: 2px;
  box-shadow: 0 26px 62px rgba(0,0,0,.68), 0 6px 16px rgba(0,0,0,.35);
}

/* ---- 中央ポップアップ（へい大将！など） ---- */
#popLayer {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  overflow: hidden;
}
.pop {
  position: absolute;
  font-family: var(--mincho);
  font-weight: 600;
  font-size: clamp(25px, 7.2vw, 40px);
  letter-spacing: .16em;
  text-indent: .16em;
  color: #fdf8ec;
  white-space: nowrap;
  background: rgba(196,58,42,.95);
  padding: 9px 24px 11px;
  border-radius: 1px;
  box-shadow: 0 14px 38px rgba(60,10,4,.45), inset 0 0 0 1px rgba(255,232,200,.28);
  animation: popIn 1.2s cubic-bezier(.16,.9,.28,1) forwards;
}
@keyframes popIn {
  0%   { opacity: 0; transform: translateY(14px) scale(.9); }
  18%  { opacity: 1; transform: translateY(0) scale(1.02); }
  30%  { transform: scale(1); }
  70%  { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-38px); }
}

/* ---- モーダル（タイトル / 結果）：和紙の額装 ---- */
.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(6,12,18,.72);
  -webkit-backdrop-filter: blur(7px);
  backdrop-filter: blur(7px);
  z-index: 20;
  padding: 18px;
}
.modal[hidden] { display: none !important; }
.card {
  position: relative;
  width: min(86%, 318px);
  background: var(--washi);
  color: #1d1a15;
  border-radius: 2px;
  padding: 34px 26px 30px;
  text-align: center;
  box-shadow: 0 26px 70px rgba(0,0,0,.6);
}
.card::before {
  content: '';
  position: absolute; inset: 8px;
  border: 1px solid rgba(185,148,95,.5);
  pointer-events: none;
}
.card h1 { font-size: 40px; font-weight: 600; letter-spacing: .24em; text-indent: .24em; }
.card h2 { font-size: 19px; font-weight: 500; letter-spacing: .4em; text-indent: .4em; color: #6d6154; }
.rule { width: 40px; height: 1px; background: var(--shu); margin: 16px auto 14px; }
.sub  { font-size: 10px; letter-spacing: .44em; text-indent: .44em; color: #9a8a72; }

.rankName { font-size: 27px; font-weight: 600; letter-spacing: .12em; text-indent: .12em; margin-top: 4px; }
.rankNote { font-size: 11.5px; letter-spacing: .06em; color: #9a8a72; margin-top: 8px; }

.scoreRow { display: flex; justify-content: center; gap: 42px; margin: 22px 0 4px; }
.scoreRow div { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.scoreRow .k { font-size: 9px; letter-spacing: .3em; text-indent: .3em; color: #9a8a72; }
.scoreRow .v {
  font-family: var(--gothic); font-weight: 300; font-size: 25px;
  color: #1d1a15; font-variant-numeric: tabular-nums;
}

.btn {
  display: inline-block;
  margin-top: 26px;
  font-family: var(--mincho);
  font-size: 13.5px;
  letter-spacing: .3em;
  text-indent: .3em;
  color: #fff;
  background: var(--shu);
  border: 0;
  border-radius: 2px;
  padding: 13px 26px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0,0,0,.22);
  transition: opacity .14s ease;
}
.btn:active { opacity: .72; }

.hint { font-size: 11px; color: #9a8a72; margin-top: 22px; line-height: 2.05; letter-spacing: .04em; }
.err  { color: var(--shu); font-size: 12.5px; line-height: 2; }

/* ---- 遊び方の選択 ---- */
.modeRow { display: flex; flex-direction: column; gap: 9px; margin-top: 22px; }
.modeBtn {
  font-family: var(--mincho); font-size: 15px; letter-spacing: .26em; text-indent: .26em;
  color: #fff; background: var(--shu); border: 0; border-radius: 2px;
  padding: 13px 10px; cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.22);
  transition: opacity .14s ease;
}
.modeBtn.alt { background: #1f3b57; }
.modeBtn:active { opacity: .72; }
.modeBtn small {
  display: block; margin-top: 5px; font-size: 9.5px; letter-spacing: .1em;
  text-indent: .1em; opacity: .8;
}

/* ---- 番付（オンラインランキング） ---- */
/* 共有データベースが使えない配布（単体の index.html など）では丸ごと隠す */
body:not(.has-rank) .needs-rank { display: none !important; }

.btnRow { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 22px; }
.btnRow .btn { margin-top: 0; }
.btn.ghost {
  background: transparent; color: var(--shu);
  border: 1px solid rgba(200,64,47,.55); box-shadow: none;
}
.btn.small {
  font-size: 11.5px; padding: 11px 14px; letter-spacing: .16em; text-indent: .16em;
  white-space: nowrap; flex: 0 0 auto;
}

.nameRow { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
#nameInput {
  flex: 1 1 auto; min-width: 0;
  font-family: var(--mincho); font-size: 14px; color: #1d1a15;
  padding: 10px 12px; border: 1px solid rgba(185,148,95,.75); border-radius: 2px;
  background: #fffdf7;
  -webkit-user-select: text; user-select: text; touch-action: auto;
}
#nameInput::placeholder { color: #b6a68c; }
#nameInput:focus { outline: 2px solid rgba(200,64,47,.45); outline-offset: 1px; }

.rankNote { font-size: 11px; color: #9a8a72; margin-top: 10px; line-height: 1.9; letter-spacing: .04em; }
.rankNote b { font-family: var(--gothic); font-weight: 600; color: #c8402f; font-size: 12.5px; }

.rtabs { display: flex; gap: 6px; justify-content: center; margin: 4px 0 12px; }
.rtab {
  font-family: var(--mincho); font-size: 11.5px; letter-spacing: .2em; text-indent: .2em;
  padding: 7px 16px; border: 1px solid rgba(185,148,95,.7); border-radius: 2px;
  background: transparent; color: #8a7a63; cursor: pointer;
}
.rtab.is-on { background: var(--shu); border-color: var(--shu); color: #fff; }

.rlist {
  list-style: none; text-align: left;
  max-height: 44vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  touch-action: pan-y; overscroll-behavior: contain;
  border-top: 1px dashed rgba(185,148,95,.6);
}
.rlist li {
  display: flex; align-items: baseline; gap: 10px; padding: 8px 4px;
  border-bottom: 1px dashed rgba(185,148,95,.32); font-size: 13px;
}
.rlist .rk {
  font-family: var(--gothic); font-weight: 600; font-size: 12px; color: #9a8a72;
  width: 2.4em; text-align: right; flex: 0 0 auto; font-variant-numeric: tabular-nums;
}
.rlist .rk.g1 { color: #b8901b; } .rlist .rk.g2 { color: #8d8d8d; } .rlist .rk.g3 { color: #a5713c; }
.rlist .rn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rlist .rs {
  font-family: var(--gothic); font-weight: 500; flex: 0 0 auto;
  font-variant-numeric: tabular-nums; color: #1d1a15;
}
.rlist li.me { background: rgba(200,64,47,.1); }
.rlist li.me .rn { font-weight: 700; }
.rEmpty { font-size: 12px; color: #9a8a72; padding: 26px 0; text-align: center; line-height: 2; }

/* ---- 横向き（ランドスケープ）警告 ---- */
#rotate { display: none; }
@media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) {
  #rotate {
    position: fixed; inset: 0; z-index: 60;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(8,16,24,.96);
    color: var(--washi); text-align: center;
    padding: calc(env(safe-area-inset-top, 0px) + 10px)
             calc(env(safe-area-inset-right, 0px) + 10px)
             calc(env(safe-area-inset-bottom, 0px) + 10px)
             calc(env(safe-area-inset-left, 0px) + 10px);
  }
  #rotate .ico { font-size: 34px; opacity: .85; animation: tilt 1.8s ease-in-out infinite; }
  #rotate p { font-size: 14px; letter-spacing: .3em; text-indent: .3em; line-height: 2.2; }
}
@keyframes tilt {
  0%, 100% { transform: rotate(-10deg); }
  50%      { transform: rotate(10deg); }
}
</style>
</head>
<body>

<div id="app">
  <header class="hud">
    <div class="hud-l">
      <div class="lbl">スコア</div>
      <div class="score" id="scoreEl">0</div>
      <div class="hi">高得点 <b id="hiEl">0</b></div>
    </div>
    <div class="hud-r">
      <div class="lbl">つぎ</div>
      <div class="tray"><canvas id="nextCv" width="132" height="132"></canvas></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="game"></canvas>
    <div id="popLayer"></div>

    <!-- タイトル -->
    <div class="modal" id="titleModal">
      <div class="card">
        <h1>すし積む</h1>
        <div class="rule"></div>
        <div class="sub">江戸前合体遊戯</div>
        <div class="modeRow">
          <button class="modeBtn" id="startBtn">お 任 せ<small>心ゆくまで積む</small></button>
          <button class="modeBtn alt" id="startOrderBtn">お 品 書 き<small>注文で祝儀、連鎖で加増</small></button>
        </div>
        <button class="btn ghost small needs-rank" id="openRank">番 付 を 見 る</button>
        <p class="hint">
          指でなぞって位置を決め、離せば落ちる。<br>
          同じネタが触れ合えば合体。<br>
          「ガリ」は触れたネタを一つ消す。
        </p>
      </div>
    </div>

    <!-- 結果 -->
    <div class="modal" id="overModal" hidden>
      <div class="card">
        <h2>しまい</h2>
        <div class="rule"></div>
        <div class="rankName" id="rankName">見習い職人</div>
        <div class="rankNote" id="rankNote"></div>
        <div class="scoreRow">
          <div><span class="k">スコア</span><span class="v" id="finalScore">0</span></div>
          <div><span class="k">高得点</span><span class="v" id="finalHi">0</span></div>
        </div>
        <div class="nameRow needs-rank">
          <input id="nameInput" type="text" maxlength="12" placeholder="名前（12文字まで）"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button class="btn small" id="sendBtn">載 せ る</button>
        </div>
        <div class="rankNote needs-rank" id="sendNote"></div>

        <div class="btnRow">
          <button class="btn ghost needs-rank" id="openRank2">番 付</button>
          <button class="btn" id="retryBtn">もう一丁</button>
        </div>
      </div>
    </div>

    <!-- 番付（オンラインランキング） -->
    <div class="modal" id="rankModal" hidden>
      <div class="card">
        <h2>番付</h2>
        <div class="rule"></div>
        <div class="rtabs">
          <button class="rtab is-on" id="tabDay">本 日</button>
          <button class="rtab" id="tabAll">総 合</button>
        </div>
        <div class="rtabs">
          <button class="rtab is-on" id="tabNormal">お 任 せ</button>
          <button class="rtab" id="tabOrder">お 品 書 き</button>
        </div>
        <ol class="rlist" id="rlist"></ol>
        <div class="rankNote" id="rankScope"></div>
        <button class="btn" id="closeRank">閉 じ る</button>
      </div>
    </div>

    <!-- ライブラリ読み込み失敗時 -->
    <div class="modal" id="libModal" hidden>
      <div class="card">
        <h2>準備中</h2>
        <div class="rule"></div>
        <p class="err">
          物理エンジンを初期化できませんでした。<br>
          ページを再読み込みしてください。
        </p>
      </div>
    </div>
  </main>

  <!-- 横向き時のご案内 -->
  <div id="rotate">
    <div class="ico">📱</div>
    <p>画面を縦にして<br>お楽しみください</p>
  </div>
</div>

<script>
(function () {
'use strict';

/* ============================================================
   0. iOS の余計な挙動を JS 側でも殺す
   ============================================================ */
// スクロール／ラバーバンド禁止
document.addEventListener('touchmove', function (e) {
  // 番付の一覧だけは指で送れるようにする
  var t = e.target;
  while (t && t !== document) {
    if (t.classList && t.classList.contains('rlist')) return;
    t = t.parentNode;
  }
  if (e.cancelable) e.preventDefault();
}, { passive: false });
// ピンチズーム(Safari独自イベント)禁止
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
  document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
});
// ダブルタップズーム禁止（300ms判定つき）
var lastTouchEnd = 0;
document.addEventListener('touchend', function (e) {
  var now = Date.now();
  if (now - lastTouchEnd <= 350) { if (e.cancelable) e.preventDefault(); }
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
// 長押しメニュー禁止
document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });
// 誤ってページがスクロールされた場合の復帰
window.addEventListener('scroll', function () { window.scrollTo(0, 0); }, { passive: true });

/* ============================================================
   1. ライブラリ確認
   ============================================================ */
if (typeof Matter === 'undefined') {
  document.getElementById('titleModal').hidden = true;
  document.getElementById('libModal').hidden = false;
  return;
}
var Engine    = Matter.Engine,
    Composite = Matter.Composite,
    Bodies    = Matter.Bodies,
    Body      = Matter.Body,
    Events    = Matter.Events,
    Sleeping  = Matter.Sleeping;

/* ============================================================
   2. 定数・ワールド定義（論理座標 450 x 800 = 9:16）
   ============================================================ */
var W = 360, H = 640;          // 論理サイズ（9:16）
var WALL = 12;                 // 桶の枠の厚み
var LEFT = WALL, RIGHT = W - WALL, FLOOR = H - WALL;
var BARREL_TOP = 320;          // すし桶の縁（ここから下が桶の中）
var DROP_Y = 200;              // ネタの待機高さ（桶の上の開けた場所）
var DEAD_Y = BARREL_TOP + 6;   // デッドライン＝桶の縁
var DEAD_LIMIT = 3.0;          // 3秒滞留でゲームオーバー
var FINGER_OFFSET_Y = 56;      // 指でネタが隠れないよう上にオフセット
var GARI_RATE = 20;            // 20回に1回ガリ
var DROP_INTERVAL = 420;       // 次のネタが出るまで(ms)

/* ---- 寿司ネタ 11段階 ---- */
var SUSHI = [
  { n:'シャリ',           shape:'circle',  r:19,           col:'#ffffff' },
  { n:'玉子',             shape:'rrect',   w:49,  h:33,  ch:11, col:'#f7c53c' },
  { n:'エビ',             shape:'rrect',   w:64,  h:35,  ch:16, col:'#ff9fb0' },
  { n:'サーモン',         shape:'ellipse', w:85,  h:47,         col:'#ff9245' },
  { n:'マグロ',           shape:'rrect',   w:91,  h:49,  ch:7,  col:'#d5323c' },
  { n:'いくら軍艦',       shape:'rrect',   w:94,  h:67,  ch:14, col:'#a51f22', nori:true },
  { n:'ウニ軍艦',         shape:'rrect',   w:111, h:79,  ch:16, col:'#d79c33', nori:true },
  { n:'大トロ',           shape:'rrect',   w:149, h:83,  ch:29, col:'#f2a3ad' },
  { n:'あなご一本焼き',   shape:'rrect',   w:247, h:71,  ch:25, col:'#7a4a22', bar:true },
  { n:'伊勢海老',         shape:'rrect',   w:230, h:107, ch:34, col:'#a8324e' },
  { n:'ゴールデンすし桶', shape:'circle',  r:105,          col:'#e8b62c', gold:true }
];
SUSHI[9].pad = 58;   // 触角が本体から大きくはみ出す   // 伊勢海老は触角と脚が本体からはみ出す
SUSHI.forEach(function (d) {
  if (d.shape === 'circle') { d.hw = d.r; d.hh = d.r; }
  else { d.hw = d.w / 2; d.hh = d.h / 2; }
});
// レベル i(0基点) 同士の合体で入るスコア
var MERGE_SCORE = [8, 18, 36, 70, 130, 230, 380, 600, 950, 1500];
var GOLDEN_BONUS = 8000;   // ゴールデン同士 → 消滅して大得点
var GARI_SCORE   = 40;

var GARI = { n:'ガリ', r:9, col:'#ffc7d4' };

/* 威勢のいい掛け声（レベル8以上の合体で表示） */
var SHOUTS = ['へい大将！', '極上！', 'いよっ、名人！', 'これぞ江戸前！', '大将、いい仕事！', 'あがりでィ！'];

/* ランク判定 */
var RANKS = [
  { s: 0,     name: '見習い職人',     note: 'まずは飯炊き三年から。' },

  { s: 6000,  name: '中堅職人',       note: '常連がつき始めた腕前。' },
  { s: 11000, name: '花板',           note: '厨房を任される男。' },
  { s: 18000, name: '大将',           note: 'その握り、値千金。' },
  { s: 30000, name: '伝説のすし職人', note: 'へい、お待ち。—— 神域。' }
];

/* ============================================================
   3. 物理エンジン
   ============================================================ */
var engine = Engine.create({
  enableSleeping: false,
  positionIterations: 8,
  velocityIterations: 8,
  constraintIterations: 3
});
engine.gravity.y = 1.1;
var world = engine.world;

// 壁と床は見た目の厚み(WALL)より十分厚くする。
// 薄いと、重くなった大きなネタが一枚板をすり抜けて桶の外へ落ちる。
var WALL_T = 80;
var walls = [
  Bodies.rectangle(WALL - WALL_T / 2, H / 2, WALL_T, H * 3,
    { isStatic: true, friction: 0.5, label: 'wall' }),
  Bodies.rectangle(W - WALL + WALL_T / 2, H / 2, WALL_T, H * 3,
    { isStatic: true, friction: 0.5, label: 'wall' }),
  Bodies.rectangle(W / 2, FLOOR + WALL_T / 2, W + WALL_T * 2, WALL_T,
    { isStatic: true, friction: 0.7, label: 'wall' })
];
Composite.add(world, walls);

/* ============================================================
   4. ゲーム状態
   ============================================================ */
var state       = 'title';     // title | ready | dropping | over
var score       = 0;
var hiScore     = loadHi();
var current     = null;        // {level:int} または {gari:true}
var next        = null;
var previewX    = W / 2;
var previewY    = DROP_Y;
var pointerDown = false;       // 指が触れているか
var lastPtr     = { x: W / 2, y: DROP_Y + FINGER_OFFSET_Y };
var dropLock    = false;
var deadTimer   = 0;
var particles   = [];
var pendingOps  = [];          // 物理ステップ後にまとめて処理
var bodySeq     = 0;

var F_MIN = '"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif';
var F_GO  = '"Helvetica Neue",Arial,"Hiragino Sans",sans-serif';
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

var scoreEl = document.getElementById('scoreEl');
var hiEl    = document.getElementById('hiEl');
hiEl.textContent = fmt(hiScore);

function loadHi() {
  try { return parseInt(localStorage.getItem('sushitsumu.hi') || '0', 10) || 0; }
  catch (e) { return 0; }
}
function saveHi(v) {
  try { localStorage.setItem('sushitsumu.hi', String(v)); } catch (e) {}
}

/* ============================================================
   5. ボディ生成
   ============================================================ */
function makeSushi(level, x, y) {
  var d = SUSHI[level];
  var opt = {
    label: 'sushi',
    density: 0.0011,
    friction: d.nori ? 0.92 : (d.bar ? 0.9 : 0.36),
    frictionStatic: d.nori ? 1.1 : (d.bar ? 1.2 : 0.6),
    frictionAir: d.bar ? 0.02 : (d.nori ? 0.018 : 0.006),  // 軍艦は海苔でクルクル回りにくい
    restitution: d.nori ? 0.02 : (d.bar ? 0.0 : (d.gold ? 0.04 : 0.09)),
    slop: 0.02
  };
  var b;
  if (d.shape === 'circle') {
    b = Bodies.circle(x, y, d.r, opt, d.r > 60 ? 34 : 22);
  } else if (d.shape === 'ellipse') {
    b = Bodies.polygon(x, y, 16, d.w / 2, opt);
    Body.scale(b, 1, d.h / d.w);
  } else {
    opt.chamfer = { radius: Math.min(d.ch, Math.min(d.w, d.h) / 2 - 0.5) };
    b = Bodies.rectangle(x, y, d.w, d.h, opt);
  }
  b.sushi = { level: level, merged: false, born: performance.now(), id: ++bodySeq,
              mergedAt: 0, chain: 0 };
  return b;
}

function makeGari(x, y) {
  var b = Bodies.circle(x, y, GARI.r, {
    label: 'gari',
    density: 0.0012,
    friction: 0.5,
    frictionStatic: 0.7,
    restitution: 0.15,
    slop: 0.02
  }, 10);
  b.gari = { used: false, born: performance.now() };
  return b;
}

/* ============================================================
   6. 出題（1〜3 からランダム / 20回に1回ガリ）
   ============================================================ */
function rollItem() {
  if (Math.floor(Math.random() * GARI_RATE) === 0) return { gari: true };
  return { level: Math.floor(Math.random() * 3) };  // 0,1,2 = シャリ/玉子/エビ
}
function itemHalfWidth(it) {
  return it.gari ? GARI.r : SUSHI[it.level].hw;
}
function itemHalfHeight(it) {
  return it.gari ? GARI.r : SUSHI[it.level].hh;
}

function nextTurn() {
  current = next || rollItem();
  next = rollItem();
  drawNextPreview();
  // 指を置いたまま待っていた場合、新しいネタをすぐ指の位置に追従させる
  if (pointerDown) {
    previewX = lastPtr.x;
    previewY = Math.max(172, Math.min(DROP_Y, lastPtr.y - FINGER_OFFSET_Y));
  }
  clampPreview();
  dropLock = false;
  if (state !== 'over') state = 'ready';
}

function clampPreview() {
  if (!current) return;
  var hw = itemHalfWidth(current);
  previewX = Math.max(LEFT + hw + 1, Math.min(RIGHT - hw - 1, previewX));
}

/* ============================================================
   7. 落下
   ============================================================ */
function dropCurrent() {
  if (state !== 'ready' || dropLock || !current) return;
  clampPreview();
  var b = current.gari ? makeGari(previewX, previewY)
                       : makeSushi(current.level, previewX, previewY);
  Body.setVelocity(b, { x: 0, y: 1.2 });
  Composite.add(world, b);
  beep(current.gari ? 900 : 520, 0.05, 'triangle');

  current = null;
  dropLock = true;
  state = 'dropping';
  setTimeout(function () { if (state !== 'over') nextTurn(); }, DROP_INTERVAL);
}

/* ============================================================
   8. 衝突判定 → 合体 / ガリ
   ============================================================ */
Events.on(engine, 'collisionStart', function (ev) {
  if (state === 'over') return;
  for (var i = 0; i < ev.pairs.length; i++) {
    var a = ev.pairs[i].bodyA, b = ev.pairs[i].bodyB;

    /* --- ガリ：触れたネタをレベル問わず1つ消す --- */
    var g = a.gari ? a : (b.gari ? b : null);
    if (g) {
      var target = (g === a) ? b : a;
      if (!g.gari.used && target.sushi && !target.sushi.merged) {
        g.gari.used = true;
        target.sushi.merged = true;
        pendingOps.push({ type: 'gari', gari: g, target: target });
      }
      continue;
    }

    /* --- 合体：同レベル同士 --- */
    if (!a.sushi || !b.sushi) continue;
    if (a.sushi.merged || b.sushi.merged) continue;
    if (a.sushi.level !== b.sushi.level) continue;
    a.sushi.merged = true;
    b.sushi.merged = true;
    pendingOps.push({ type: 'merge', a: a, b: b, level: a.sushi.level });
  }
});

function flushOps() {
  if (!pendingOps.length) return;
  var ops = pendingOps;
  pendingOps = [];
  for (var i = 0; i < ops.length; i++) {
    var op = ops[i];
    if (op.type === 'gari') {
      var gx = op.target.position.x, gy = op.target.position.y;
      var lv = op.target.sushi.level;
      Composite.remove(world, op.gari);
      Composite.remove(world, op.target);
      burst(gx, gy, ['#ffc7d4', '#ffffff', '#ff88a6'], 16, 3.4);
      burst(op.gari.position.x, op.gari.position.y, ['#ffc7d4'], 8, 2.2);
      addScore(GARI_SCORE + lv * 10);
      addFloat(gx, gy - 12, '+' + fmt(GARI_SCORE + lv * 10), '#c8402f');
      beep(1250, 0.07, 'square');
      showPop('お口直し！', 0.8);
    } else {
      var mx = (op.a.position.x + op.b.position.x) / 2;
      var my = (op.a.position.y + op.b.position.y) / 2;
      Composite.remove(world, op.a);
      Composite.remove(world, op.b);

      if (op.level >= SUSHI.length - 1) {
        /* ゴールデンすし桶同士 → 消滅して大得点 */
        addScore(GOLDEN_BONUS);
        addFloat(mx, my - 20, '+' + fmt(GOLDEN_BONUS), '#96690a');
        burst(mx, my, ['#ffe89a', '#ffd45a', '#fff8dc', '#e8b62c'], 60, 8);
        showPop('大 入 袋 ！', 1);
        beep(1600, 0.25, 'sawtooth');
        continue;
      }

      // 生成位置が壁に食い込むと、押し出されて桶の外へ飛び出すことがある
      var nhw = SUSHI[op.level + 1].hw;
      mx = Math.max(LEFT + nhw + 1, Math.min(RIGHT - nhw - 1, mx));
      my = Math.max(SUSHI[op.level + 1].hh + 2, my);
      var chain = chainDepthOf(op.a, op.b);
      var nb = makeSushi(op.level + 1, mx, my);
      nb.sushi.chain = chain;
      nb.sushi.mergedAt = performance.now();
      Composite.add(world, nb);
      Body.setVelocity(nb, { x: 0, y: -1.6 });

      var gain = Math.round(MERGE_SCORE[op.level] * chainMult(chain));
      addScore(gain);
      orderMade(op.level + 1);
      var fy = my - SUSHI[op.level + 1].hh - 6;
      if (chain >= 2) {
        if (chain > chainBest) chainBest = chain;
        addFloat(mx, fy, chain + '連鎖 +' + fmt(gain), chain >= 3 ? '#c8402f' : '#c2690f');
      } else {
        addFloat(mx, fy, '+' + fmt(gain),
                 op.level + 1 >= 7 ? '#c8402f' : 'rgba(58,40,16,.95)');
      }
      var col = SUSHI[op.level + 1].col;
      burst(mx, my, [col, '#ffffff', '#fff2c8'],
            (14 + op.level * 3) * (chain >= 2 ? 2 : 1), (3 + op.level * 0.5) * (chain >= 2 ? 1.5 : 1));
      beep(420 + op.level * 70 + (chain - 1) * 120, 0.06 + (chain >= 2 ? 0.04 : 0), 'triangle');
      if (chain >= 3) {
        showPop(chainLabel(chain), 1);
        beep(880 + chain * 90, 0.2, 'square');
      }

      if (op.level + 1 >= 7) {   // 出来上がりがレベル8(大トロ)以上
        showPop(SHOUTS[Math.floor(Math.random() * SHOUTS.length)], 1);
        beep(880 + op.level * 40, 0.16, 'square');
      }
    }
  }
}

function addScore(v) {
  score += v;
  scoreEl.textContent = fmt(score);
  if (score > hiScore) {
    hiScore = score;
    hiEl.textContent = fmt(hiScore);
    saveHi(hiScore);
  }
}

/* ============================================================
   9. パーティクル
   ============================================================ */
function burst(x, y, colors, n, spd) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var s = (0.4 + Math.random() * 0.9) * (spd || 3);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 1.2,
      life: 1, decay: 0.016 + Math.random() * 0.02,
      r: 2 + Math.random() * 4,
      c: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 0.4,
      sq: Math.random() < 0.45
    });
  }
  if (particles.length > 500) particles.splice(0, particles.length - 500);
}
function stepParticles() {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.22; p.vx *= 0.985;
    p.rot += p.vr;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ---- 加算点の浮き文字 ---- */
var floats = [];
function addFloat(x, y, text, color) {
  floats.push({ x: x, y: y, t: text, c: color, life: 1 });
  if (floats.length > 24) floats.shift();
}
function stepFloats() {
  for (var i = floats.length - 1; i >= 0; i--) {
    var f = floats[i];
    f.y -= 0.62;
    f.life -= 0.017;
    if (f.life <= 0) floats.splice(i, 1);
  }
}

/* ============================================================
   10. ポップアップ（DOM）
   ============================================================ */
var popLayer = document.getElementById('popLayer');
function showPop(text, scale) {
  var stale = popLayer.firstChild;
  while (stale) { popLayer.removeChild(stale); stale = popLayer.firstChild; }
  var el = document.createElement('div');
  el.className = 'pop';
  el.textContent = text;
  if (scale && scale !== 1) el.style.fontSize = (scale * 100) + '%';
  // 注文の木札を覆わないよう、桶の中ほどに出す
  el.style.top = (54 + Math.random() * 10) + '%';
  popLayer.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1250);
}

/* ============================================================
   11. サウンド（WebAudio・軽量）
   ============================================================ */
var actx = null;
function unlockAudio() {
  if (actx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    if (actx.state === 'suspended') actx.resume();
    var b = actx.createBuffer(1, 1, 22050);
    var s = actx.createBufferSource();
    s.buffer = b; s.connect(actx.destination); s.start(0);
  } catch (e) { actx = null; }
}
function beep(freq, dur, type) {
  if (!actx) return;
  try {
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * 0.6, actx.currentTime + dur);
    g.gain.setValueAtTime(0.09, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  } catch (e) {}
}

/* ============================================================
   12. キャンバス & レスポンシブ
   ============================================================ */
var cv  = document.getElementById('game');
var ctx = cv.getContext('2d');
var stage = document.getElementById('stage');
var hud = document.querySelector('.hud');
var scale = 1;

function resize() {
  var r = stage.getBoundingClientRect();
  var availW = r.width, availH = r.height;
  if (availW <= 0 || availH <= 0) return;
  var s = Math.min(availW / W, availH / H);
  var cssW = Math.floor(W * s), cssH = Math.floor(H * s);
  var dpr = Math.min(window.devicePixelRatio || 1, 2);  // iOS(x3)は重いので2で頭打ち
  cv.style.width  = cssW + 'px';
  cv.style.height = cssH + 'px';
  hud.style.width = cssW + 'px';   // スコアと NEXT を桶の左右端に揃える
  cv.width  = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  scale = (cssW * dpr) / W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* ============================================================
   13. 入力（PointerEvent / TouchEvent フォールバック）
   ============================================================ */
function toWorld(clientX, clientY) {
  var r = cv.getBoundingClientRect();
  return {
    x: (clientX - r.left) / r.width * W,
    y: (clientY - r.top) / r.height * H
  };
}
function onDown(clientX, clientY) {
  unlockAudio();
  if (state === 'title' || state === 'over') return;
  // 落下クールダウン中に触れても取りこぼさない
  pointerDown = true;
  onMove(clientX, clientY);
}
function onMove(clientX, clientY) {
  if (!pointerDown) return;
  lastPtr = toWorld(clientX, clientY);
  if (!current) return;                 // 次のネタ待ち。位置だけ覚えておく
  previewX = lastPtr.x;
  // 指の真上に出して、ネタが指で隠れないようにする
  previewY = Math.max(172, Math.min(DROP_Y, lastPtr.y - FINGER_OFFSET_Y));
  clampPreview();
}
function onUp() {
  if (!pointerDown) return;
  pointerDown = false;
  dropCurrent();
  previewY = DROP_Y;
}

if (window.PointerEvent) {
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    onDown(e.clientX, e.clientY);
  }, { passive: false });
  cv.addEventListener('pointermove', function (e) {
    e.preventDefault();
    onMove(e.clientX, e.clientY);
  }, { passive: false });
  cv.addEventListener('pointerup',     function (e) { e.preventDefault(); onUp(); }, { passive: false });
  cv.addEventListener('pointercancel', function ()  { pointerDown = false; previewY = DROP_Y; }, { passive: false });
} else {
  cv.addEventListener('touchstart', function (e) {
    e.preventDefault(); onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  cv.addEventListener('touchmove', function (e) {
    e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  cv.addEventListener('touchend', function (e) { e.preventDefault(); onUp(); }, { passive: false });
  cv.addEventListener('mousedown', function (e) { onDown(e.clientX, e.clientY); });
  window.addEventListener('mousemove', function (e) { onMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', onUp);
}

/* ============================================================
   14. 描画ユーティリティ
   ============================================================ */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);       c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);   c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);       c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);           c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}
/* 軍艦の海苔の外形。
   上の角は丸めるのではなく斜めに削ぎ落とす。角丸だと角が残って見える。
   削ぎの繋ぎ目だけわずかに均して、折り紙のように尖らせない。 */
function noriPath(c, w, h, bottom, cutX, cutY, rBot, soft) {
  var L = -w / 2, R = w / 2, T = -h / 2, B = bottom;
  c.beginPath();
  c.moveTo(0, T);
  c.arcTo(R - cutX, T, R, T + cutY, soft);
  c.arcTo(R, T + cutY, R, B, soft);
  c.arcTo(R, B, L, B, rBot);
  c.arcTo(L, B, L, T + cutY, rBot);
  c.arcTo(L, T + cutY, L + cutX, T, soft);
  c.arcTo(L + cutX, T, 0, T, soft);
  c.closePath();
}

/* 角ごとに半径を変えられる角丸矩形 */
function rr4(c, x, y, w, h, rtl, rtr, rbr, rbl) {
  var m = Math.min(w, h) / 2;
  rtl = Math.min(rtl, m); rtr = Math.min(rtr, m);
  rbr = Math.min(rbr, m); rbl = Math.min(rbl, m);
  c.beginPath();
  c.moveTo(x + rtl, y);
  c.lineTo(x + w - rtr, y);        c.quadraticCurveTo(x + w, y, x + w, y + rtr);
  c.lineTo(x + w, y + h - rbr);    c.quadraticCurveTo(x + w, y + h, x + w - rbr, y + h);
  c.lineTo(x + rbl, y + h);        c.quadraticCurveTo(x, y + h, x, y + h - rbl);
  c.lineTo(x, y + rtl);            c.quadraticCurveTo(x, y, x + rtl, y);
  c.closePath();
}

function lg(c, x0, y0, x1, y1, stops) {
  var g = c.createLinearGradient(x0, y0, x1, y1);
  for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
  return g;
}

/* ---- 握りの基本パーツ ----------------------------------------
   「寿司に見える」条件は二つ。
   (1) シャリが俵形の山で、米粒が見えること
   (2) ネタがシャリより大きく、両端からはみ出して垂れること
   平たい板を白い棒に載せると消しゴムに見えるので、必ずこの形で作る。 */

/* シャリ（俵形の山） */
function riceBase(c, w, h) {
  var rw = w * 0.87, rh = h * 0.55;
  var top = h * 0.5 - rh;
  var g = c.createLinearGradient(0, top, 0, h * 0.5);
  g.addColorStop(0, '#fdfbf5');
  g.addColorStop(0.5, '#f5f1e5');
  g.addColorStop(1, '#dbd5c1');
  c.fillStyle = g;
  rr(c, -rw / 2, top, rw, rh, Math.min(rh * 0.5, rw * 0.22));
  c.fill();
  c.strokeStyle = 'rgba(156,144,113,.55)';
  c.lineWidth = 1;
  c.stroke();

  // 米粒
  var n = Math.max(4, Math.round(rw / 7.5));
  var grx = Math.min(3.1, rw * 0.055), gry = Math.min(2.0, rh * 0.13);
  for (var i = 0; i < n; i++) {
    var gx = -rw / 2 + rw * (0.14 + 0.72 * ((i + 0.5) / n)) + (Math.random() - 0.5) * 2.6;
    var gy = top + rh * (0.44 + Math.random() * 0.42);
    c.save();
    c.translate(gx, gy);
    c.rotate((Math.random() - 0.5) * 1.5);
    c.fillStyle = 'rgba(255,255,255,.96)';
    c.beginPath(); c.ellipse(0, 0, grx, gry, 0, 0, 6.2832); c.fill();
    c.strokeStyle = 'rgba(176,166,138,.55)'; c.lineWidth = 0.6; c.stroke();
    c.restore();
  }
}

/* ネタの輪郭。上は丸く盛り、下端は中央が垂れてシャリに被さる */
function netaPath(c, w, h) {
  var top = -h * 0.5, bot = h * 0.1;
  var r = Math.min(h * 0.42, w * 0.2);
  c.beginPath();
  c.moveTo(-w / 2, bot - h * 0.15);
  c.quadraticCurveTo(-w / 2, top, -w / 2 + r, top);
  c.lineTo(w / 2 - r, top);
  c.quadraticCurveTo(w / 2, top, w / 2, bot - h * 0.15);
  c.quadraticCurveTo(0, bot + h * 0.12, -w / 2, bot - h * 0.15);
  c.closePath();
}

/* 握り一貫を組み立てる */
function nigiri(c, w, h, fill, detail, edge) {
  riceBase(c, w, h);
  netaPath(c, w, h);
  c.fillStyle = fill;
  c.fill();
  if (detail) {
    c.save(); netaPath(c, w, h); c.clip(); detail(c); c.restore();
  }
  // 上面のつや
  c.save();
  netaPath(c, w, h); c.clip();
  var sg = c.createLinearGradient(0, -h * 0.5, 0, h * 0.05);
  sg.addColorStop(0, 'rgba(255,255,255,.4)');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = sg;
  c.fillRect(-w / 2, -h * 0.5, w, h * 0.6);
  c.restore();
  netaPath(c, w, h);
  c.strokeStyle = edge || 'rgba(80,40,30,.3)';
  c.lineWidth = 1.2;
  c.stroke();
}

/* 軍艦巻き
   海苔は胴に「巻いてある」ので、横から見たときの外形は海苔そのもの。
   シャリの上に黒い帯を載せる描き方だと、帯が別の物に見えて軍艦にならない。
   海苔を外形にし、その内側の窪みへ具を盛る。シャリは底から少しだけ覗かせる。 */
function gunkan(c, w, h, topping) {
  var cutX = w * 0.13;                      // 上の角の削ぎ（横）
  var cutY = h * 0.21;                      // 上の角の削ぎ（縦）
  var rBot = Math.min(h * 0.18, w * 0.10);
  var soft = Math.min(h * 0.06, w * 0.035); // 削ぎの繋ぎ目を均す量
  var nt = Math.max(3.5, w * 0.055);   // 海苔の厚み（左右に縁として見える）
  var noriBot = h * 0.43;              // 海苔の下端（巻いてあるので、シャリはほぼ隠れる）
  var rimY = -h * 0.04;                // 海苔の縁（具はここから上）
  var crest = -h * 0.52;               // 具の盛り上がりの頂点

  // シャリ（底からわずかに覗く）
  var rg = c.createLinearGradient(0, h * 0.2, 0, h / 2);
  rg.addColorStop(0, '#fdfbf5');
  rg.addColorStop(1, '#dbd5c1');
  c.fillStyle = rg;
  rr(c, -w * 0.46, h * 0.22, w * 0.92, h * 0.28, Math.min(h * 0.12, w * 0.08));
  c.fill();
  c.strokeStyle = 'rgba(156,144,113,.6)';
  c.lineWidth = 1;
  c.stroke();
  for (var i = 0; i < 4; i++) {
    c.save();
    c.translate(-w * 0.24 + i * (w * 0.16), h * 0.47);
    c.rotate((i - 1.5) * 0.35);
    c.fillStyle = 'rgba(255,255,255,.9)';
    c.beginPath(); c.ellipse(0, 0, w * 0.03, h * 0.018, 0, 0, 6.2832); c.fill();
    c.restore();
  }

  // 海苔＝胴の外形
  var ng = c.createLinearGradient(-w / 2, 0, w / 2, 0);
  ng.addColorStop(0, '#0d120e');
  ng.addColorStop(0.14, '#283326');
  ng.addColorStop(0.44, '#36432f');
  ng.addColorStop(0.82, '#1d261d');
  ng.addColorStop(1, '#0b0f0b');
  c.fillStyle = ng;
  noriPath(c, w, h, noriBot, cutX, cutY, rBot, soft);
  c.fill();

  c.save();
  noriPath(c, w, h, noriBot, cutX, cutY, rBot, soft);
  c.clip();
  // 海苔の繊維
  c.strokeStyle = 'rgba(255,255,255,.05)';
  c.lineWidth = 1.2;
  for (var v = -6; v <= 6; v++) {
    c.beginPath();
    c.moveTo(v * w * 0.075, -h / 2);
    c.lineTo(v * w * 0.075, noriBot);
    c.stroke();
  }
  // 巻き終わりの継ぎ目
  c.strokeStyle = 'rgba(255,255,255,.12)';
  c.lineWidth = 1.8;
  c.beginPath();
  c.moveTo(-w * 0.28, -h / 2);
  c.lineTo(-w * 0.28, noriBot);
  c.stroke();
  // 巻きの丸みを出すつや
  var sh = c.createLinearGradient(-w / 2, 0, w / 2, 0);
  sh.addColorStop(0, 'rgba(255,255,255,0)');
  sh.addColorStop(0.3, 'rgba(255,255,255,.10)');
  sh.addColorStop(0.55, 'rgba(255,255,255,.03)');
  sh.addColorStop(1, 'rgba(0,0,0,.25)');
  c.fillStyle = sh;
  c.fillRect(-w / 2, -h / 2, w, noriBot + h / 2);
  c.restore();

  // 具（海苔の縁から上へ浅く盛り上がる。深い窓にすると画面に見えてしまう）
  c.save();
  var tx0 = -w / 2 + nt, tx1 = w / 2 - nt;
  c.beginPath();
  c.moveTo(tx0, rimY);
  c.bezierCurveTo(tx0 + w * 0.045, rimY - h * 0.22,
                  -w * 0.35, crest,
                  -w * 0.25, crest);
  c.lineTo(w * 0.25, crest);
  c.bezierCurveTo(w * 0.35, crest,
                  tx1 - w * 0.045, rimY - h * 0.22,
                  tx1, rimY);
  c.closePath();
  c.clip();
  topping(c, w, h);
  c.restore();

  // 具と海苔の境
  c.strokeStyle = 'rgba(0,0,0,.45)';
  c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(-w / 2 + nt * 0.6, rimY);
  c.lineTo(w / 2 - nt * 0.6, rimY);
  c.stroke();

  // 海苔の切り口（具の左右に覗く縁）
  c.strokeStyle = 'rgba(196,186,168,.35)';
  c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(-w / 2 + nt * 0.7, rimY - h * 0.02);
  c.lineTo(-w / 2 + nt * 0.7, -h * 0.17);
  c.moveTo(w / 2 - nt * 0.7, rimY - h * 0.02);
  c.lineTo(w / 2 - nt * 0.7, -h * 0.17);
  c.stroke();

  // 全体の縁
  c.strokeStyle = 'rgba(0,0,0,.55)';
  c.lineWidth = 1.4;
  noriPath(c, w, h, noriBot, cutX, cutY, rBot, soft);
  c.stroke();
}

/* ---- ネタ描画（原点中心・ローカル座標） ---- */
function drawItem(c, level) {
  var d = SUSHI[level];
  var w = d.w, h = d.h;

  switch (level) {

    /* 1. シャリ（握る前の飯玉） */
    case 0: {
      var R = d.r;
      var g = c.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.1, 0, 0, R);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.6, '#f7f3e8');
      g.addColorStop(1, '#ddd7c5');
      c.fillStyle = g;
      c.beginPath(); c.arc(0, 0, R, 0, 6.2832); c.fill();
      c.strokeStyle = 'rgba(156,144,113,.6)'; c.lineWidth = 1; c.stroke();
      // 米粒をはっきり見せる
      c.save();
      c.beginPath(); c.arc(0, 0, R - 0.6, 0, 6.2832); c.clip();
      for (var i = 0; i < 11; i++) {
        var a = i * 1.13, rad = R * (0.18 + 0.62 * ((i % 4) / 3));
        c.save();
        c.translate(Math.cos(a) * rad, Math.sin(a) * rad);
        c.rotate(a * 1.7);
        c.fillStyle = 'rgba(255,255,255,.98)';
        c.beginPath(); c.ellipse(0, 0, R * 0.24, R * 0.145, 0, 0, 6.2832); c.fill();
        c.strokeStyle = 'rgba(178,168,140,.6)'; c.lineWidth = 0.7; c.stroke();
        c.restore();
      }
      c.restore();
      break;
    }

    /* 2. 玉子（海苔の帯で締める） */
    case 1: {
      nigiri(c, w, h,
        lg(c, 0, -h * 0.5, 0, h * 0.1, [[0, '#ffe081'], [0.45, '#f8c53a'], [1, '#e0a01c']]),
        function (cc) {
          cc.strokeStyle = 'rgba(255,255,255,.5)';
          cc.lineWidth = h * 0.09;
          cc.beginPath();
          cc.moveTo(-w * 0.36, -h * 0.3);
          cc.lineTo(w * 0.36, -h * 0.34);
          cc.stroke();
          cc.fillStyle = 'rgba(190,120,26,.35)';
          cc.fillRect(-w / 2, h * 0.0, w, h * 0.1);
        },
        'rgba(150,95,15,.55)');
      // 海苔の帯（ネタとシャリをまたいで巻く）
      var bw = Math.max(4.5, w * 0.17);
      var bg = c.createLinearGradient(-bw / 2, 0, bw / 2, 0);
      bg.addColorStop(0, '#171410');
      bg.addColorStop(0.45, '#372f26');
      bg.addColorStop(1, '#191612');
      c.fillStyle = bg;
      c.fillRect(-bw / 2, -h * 0.5, bw, h);
      c.fillStyle = 'rgba(255,255,255,.1)';
      c.fillRect(-bw / 2, -h * 0.5, bw * 0.22, h);
      break;
    }

    /* 3. エビ（白地に紅の縞。茹でエビの配色） */
    case 2: {
      nigiri(c, w, h,
        lg(c, 0, -h * 0.5, 0, h * 0.1, [[0, '#fff4f3'], [0.55, '#ffe4e2'], [1, '#f7cdc9']]),
        function (cc) {
          // 紅の帯を斜めに走らせる
          cc.fillStyle = '#f2603f';
          for (var k = -2; k <= 2; k++) {
            var x = k * (w * 0.2) + w * 0.02;
            cc.beginPath();
            cc.moveTo(x - w * 0.055, -h * 0.7);
            cc.lineTo(x + w * 0.055, -h * 0.7);
            cc.lineTo(x + w * 0.015, h * 0.5);
            cc.lineTo(x - w * 0.095, h * 0.5);
            cc.closePath();
            cc.fill();
          }
          // 背側の濃い筋
          cc.strokeStyle = 'rgba(198,52,32,.55)';
          cc.lineWidth = h * 0.1;
          cc.beginPath();
          cc.moveTo(-w * 0.46, -h * 0.34);
          cc.quadraticCurveTo(0, -h * 0.46, w * 0.46, -h * 0.32);
          cc.stroke();
        },
        'rgba(196,86,72,.6)');
      // 尾（右端で跳ね上げる）
      c.fillStyle = '#e8452a';
      c.beginPath();
      c.moveTo(w * 0.42, -h * 0.26);
      c.lineTo(w * 0.62, -h * 0.66);
      c.lineTo(w * 0.66, -h * 0.24);
      c.lineTo(w * 0.5, -h * 0.12);
      c.closePath(); c.fill();
      c.strokeStyle = 'rgba(150,30,18,.65)'; c.lineWidth = 0.9; c.stroke();
      break;
    }

    /* 4. サーモン（強い白い脂の筋） */
    case 3: {
      nigiri(c, w, h,
        lg(c, 0, -h * 0.5, 0, h * 0.1, [[0, '#ffb377'], [0.45, '#ff8d3f'], [1, '#ea6f22']]),
        function (cc) {
          cc.strokeStyle = 'rgba(255,252,246,.92)';
          cc.lineWidth = h * 0.105;
          cc.lineCap = 'round';
          for (var m = 0; m < 3; m++) {
            var y = -h * 0.3 + m * h * 0.21;
            cc.beginPath();
            cc.moveTo(-w * 0.48, y + h * 0.05);
            cc.bezierCurveTo(-w * 0.16, y - h * 0.1, w * 0.16, y + h * 0.08, w * 0.48, y - h * 0.03);
            cc.stroke();
          }
          cc.lineCap = 'butt';
        },
        'rgba(178,84,20,.6)');
      break;
    }

    /* 5. マグロ（深い赤身に細い筋） */
    case 4: {
      nigiri(c, w, h,
        lg(c, 0, -h * 0.5, 0, h * 0.1, [[0, '#e84550'], [0.5, '#cf2635'], [1, '#a81628']]),
        function (cc) {
          cc.strokeStyle = 'rgba(255,255,255,.2)';
          cc.lineWidth = h * 0.06;
          for (var t = 0; t < 3; t++) {
            var y = -h * 0.28 + t * h * 0.2;
            cc.beginPath();
            cc.moveTo(-w * 0.46, y);
            cc.quadraticCurveTo(0, y - h * 0.05, w * 0.46, y + h * 0.02);
            cc.stroke();
          }
        },
        'rgba(120,15,30,.65)');
      break;
    }

    /* 6. いくら軍艦 */
    case 5: {
      gunkan(c, w, h, function (cc, gw, gh) {
        cc.fillStyle = '#7e1517';
        cc.fillRect(-gw, -gh, gw * 2, gh * 2);
        var pr = gh * 0.095;
        var cols = 8, rows = 4;   // 最下段は海苔の縁で切れる
        for (var row = 0; row < rows; row++) {
          for (var col = 0; col < cols; col++) {
            var px = -gw * 0.44 + col * (gw * 0.125) + (row % 2 ? gw * 0.062 : 0);
            var py = -gh * 0.45 + row * (gh * 0.145);
            var rgd = cc.createRadialGradient(px - pr * 0.35, py - pr * 0.42, pr * 0.1, px, py, pr);
            rgd.addColorStop(0, '#ffc078');
            rgd.addColorStop(0.5, '#f0611f');
            rgd.addColorStop(1, '#a5230f');
            cc.fillStyle = rgd;
            cc.beginPath(); cc.arc(px, py, pr, 0, 6.2832); cc.fill();
            cc.strokeStyle = 'rgba(120,20,8,.45)'; cc.lineWidth = 0.8; cc.stroke();
            cc.fillStyle = 'rgba(255,255,255,.8)';
            cc.beginPath(); cc.arc(px - pr * 0.33, py - pr * 0.38, pr * 0.22, 0, 6.2832); cc.fill();
          }
        }
      });
      break;
    }

    /* 7. ウニ軍艦
       濃い斑点を打つと虫の卵に見え、一枚の面にすると
       バターの塊に見える。左から順に重ねた5つの弁として描き、
       隣の弁との境目だけを溝として残すと、うにの盛りになる。 */
    case 6: {
      gunkan(c, w, h, function (cc, gw, gh) {
        var nt2 = Math.max(3.5, gw * 0.055);
        var x0 = -gw * 0.5 + nt2, x1 = gw * 0.5 - nt2, span = x1 - x0;
        var crestY = -gh * 0.52, rimY2 = -gh * 0.04;
        var n = 5;
        var lw = (span / n) * 0.74;        // 半幅。隣と重ねて隙間を作らない
        var shoulder = gh * 0.11;

        for (var u = 0; u < n; u++) {
          var t = (u + 0.5) / n;
          var cx = x0 + span * t;
          // 中央の弁ほど高く盛る
          var topY = crestY - gh * 0.035 + (1 - Math.sin(Math.PI * t)) * gh * 0.15
                            + (u % 2 ? gh * 0.022 : 0);

          function lobePath() {
            cc.beginPath();
            cc.moveTo(cx - lw, rimY2);
            cc.lineTo(cx - lw, topY + shoulder);
            cc.quadraticCurveTo(cx - lw, topY, cx - lw * 0.1, topY);
            cc.quadraticCurveTo(cx + lw, topY, cx + lw, topY + shoulder);
            cc.lineTo(cx + lw, rimY2);
            cc.closePath();
          }

          lobePath();
          var g = cc.createLinearGradient(cx - lw, topY, cx + lw * 0.4, rimY2);
          g.addColorStop(0, u % 2 ? '#ffdf90' : '#ffe6a4');
          g.addColorStop(0.3, '#f3bf52');
          g.addColorStop(0.7, '#d4931f');
          g.addColorStop(1, '#a86c14');
          cc.fillStyle = g;
          cc.fill();

          // 弁の丸みを出す照り
          cc.save();
          lobePath();
          cc.clip();
          var hl = cc.createLinearGradient(cx - lw * 0.6, topY, cx + lw * 0.2, topY + gh * 0.22);
          hl.addColorStop(0, 'rgba(255,250,220,.55)');
          hl.addColorStop(1, 'rgba(255,250,220,0)');
          cc.fillStyle = hl;
          cc.fillRect(cx - lw, topY - gh * 0.05, lw * 2, gh * 0.3);
          // 根元の陰
          var sd = cc.createLinearGradient(0, rimY2, 0, rimY2 - gh * 0.2);
          sd.addColorStop(0, 'rgba(104,60,6,.5)');
          sd.addColorStop(1, 'rgba(104,60,6,0)');
          cc.fillStyle = sd;
          cc.fillRect(cx - lw, rimY2 - gh * 0.2, lw * 2, gh * 0.2);
          cc.restore();

          // 左側の輪郭＝隣の弁との溝
          cc.strokeStyle = 'rgba(134,80,6,.6)';
          cc.lineWidth = Math.max(1.4, gw * 0.013);
          cc.beginPath();
          cc.moveTo(cx - lw, rimY2);
          cc.lineTo(cx - lw, topY + shoulder);
          cc.quadraticCurveTo(cx - lw, topY, cx - lw * 0.1, topY);
          cc.stroke();
        }

        // 右端の弁の輪郭
        var tl = (n - 0.5) / n;
        var cxr = x0 + span * tl;
        var topR = crestY - gh * 0.035 + (1 - Math.sin(Math.PI * tl)) * gh * 0.15;
        cc.strokeStyle = 'rgba(134,80,6,.6)';
        cc.lineWidth = Math.max(1.4, gw * 0.013);
        cc.beginPath();
        cc.moveTo(cxr + lw * 0.1, topR);
        cc.quadraticCurveTo(cxr + lw, topR, cxr + lw, topR + shoulder);
        cc.lineTo(cxr + lw, rimY2);
        cc.stroke();
      });
      break;
    }

    /* 8. 大トロ（霜降り） */
    case 7: {
      nigiri(c, w, h,
        lg(c, 0, -h * 0.5, 0, h * 0.1, [[0, '#ffd9de'], [0.45, '#f5a8b3'], [1, '#e08794']]),
        function (cc) {
          cc.strokeStyle = 'rgba(255,255,255,.95)';
          cc.lineWidth = h * 0.085;
          cc.lineCap = 'round';
          for (var f = 0; f < 5; f++) {
            var y = -h * 0.34 + f * h * 0.15;
            cc.beginPath();
            cc.moveTo(-w * 0.48, y + h * 0.03);
            cc.bezierCurveTo(-w * 0.16, y - h * 0.07, w * 0.16, y + h * 0.06, w * 0.48, y - h * 0.02);
            cc.stroke();
          }
          cc.lineCap = 'butt';
        },
        'rgba(180,105,118,.6)');
      break;
    }

    /* 9. あなご一本焼き
       等間隔の濃い縦線を入れると板の継ぎ目に見えて、木材になる。
       焼き目は柔らかい斑に留め、皮は細い横筋で出す。
       主役はタレの照りなので、上辺に沿って強い光を一本通す。 */
    case 8: {
      var top = -h * 0.34;
      // シャリ（あなごの下に全長）
      var rgd = c.createLinearGradient(0, h * 0.02, 0, h * 0.5);
      rgd.addColorStop(0, '#fdfbf5');
      rgd.addColorStop(0.55, '#f4f0e4');
      rgd.addColorStop(1, '#dbd5c1');
      c.fillStyle = rgd;
      rr(c, -w * 0.47, h * 0.02, w * 0.94, h * 0.48, h * 0.2);
      c.fill();
      c.strokeStyle = 'rgba(156,144,113,.55)';
      c.lineWidth = 1;
      c.stroke();
      for (var gi = 0; gi < 12; gi++) {
        c.save();
        c.translate(-w * 0.42 + gi * (w * 0.077), h * 0.34 + (gi % 2 ? h * 0.08 : 0));
        c.rotate((gi - 6) * 0.16);
        c.fillStyle = 'rgba(255,255,255,.85)';
        c.beginPath(); c.ellipse(0, 0, w * 0.016, h * 0.028, 0, 0, 6.2832); c.fill();
        c.strokeStyle = 'rgba(176,166,138,.45)'; c.lineWidth = 0.6; c.stroke();
        c.restore();
      }

      // あなごの身（上辺をゆるく波打たせ、両端は垂れる）
      function anagoPath(cc) {
        cc.beginPath();
        cc.moveTo(-w / 2, h * 0.2);
        cc.quadraticCurveTo(-w / 2 - h * 0.04, top + h * 0.16, -w * 0.42, top + h * 0.04);
        var seg = 4, xa = -w * 0.42, sp = w * 0.84;
        for (var q = 0; q < seg; q++) {
          var x1 = xa + sp * q / seg, x2 = xa + sp * (q + 1) / seg;
          cc.quadraticCurveTo((x1 + x2) / 2, top - (q % 2 ? h * 0.03 : h * 0.07),
                              x2, top + (q % 2 ? h * 0.05 : h * 0.01));
        }
        cc.quadraticCurveTo(w / 2 + h * 0.04, top + h * 0.16, w / 2, h * 0.2);
        cc.quadraticCurveTo(0, h * 0.38, -w / 2, h * 0.2);
        cc.closePath();
      }

      anagoPath(c);
      var eg = c.createLinearGradient(0, top, 0, h * 0.3);
      eg.addColorStop(0, '#9a6529');
      eg.addColorStop(0.34, '#6b3d15');
      eg.addColorStop(0.78, '#48260c');
      eg.addColorStop(1, '#2e1706');
      c.fillStyle = eg;
      c.fill();

      c.save();
      anagoPath(c);
      c.clip();
      // 皮の細い横筋
      c.strokeStyle = 'rgba(20,10,2,.16)';
      c.lineWidth = 1;
      for (var sk = 0; sk < 7; sk++) {
        var sy = top + h * 0.08 + sk * h * 0.075;
        c.beginPath();
        c.moveTo(-w / 2, sy);
        c.bezierCurveTo(-w * 0.2, sy + h * 0.02, w * 0.2, sy - h * 0.02, w / 2, sy);
        c.stroke();
      }
      // 焼き目（柔らかい斑）
      for (var ch2 = 0; ch2 < 7; ch2++) {
        var cx2 = -w * 0.4 + ch2 * (w * 0.133) + (ch2 % 2 ? w * 0.02 : 0);
        var cy2 = top + h * 0.3 + (ch2 % 3) * h * 0.1;
        var cg = c.createRadialGradient(cx2, cy2, 1, cx2, cy2, w * 0.06);
        cg.addColorStop(0, 'rgba(22,10,2,.42)');
        cg.addColorStop(1, 'rgba(22,10,2,0)');
        c.fillStyle = cg;
        c.beginPath();
        c.ellipse(cx2, cy2, w * 0.06, h * 0.17, 0.3, 0, 6.2832);
        c.fill();
      }
      // タレの照り（上辺に沿って一本）
      var tg = c.createLinearGradient(0, top, 0, top + h * 0.2);
      tg.addColorStop(0, 'rgba(255,220,158,.62)');
      tg.addColorStop(0.55, 'rgba(255,196,120,.2)');
      tg.addColorStop(1, 'rgba(255,196,120,0)');
      c.fillStyle = tg;
      c.beginPath();
      c.moveTo(-w * 0.44, top + h * 0.16);
      var seg2 = 4, xa2 = -w * 0.42, sp2 = w * 0.84;
      c.lineTo(-w * 0.42, top + h * 0.05);
      for (var q2 = 0; q2 < seg2; q2++) {
        var a2 = xa2 + sp2 * q2 / seg2, b2 = xa2 + sp2 * (q2 + 1) / seg2;
        c.quadraticCurveTo((a2 + b2) / 2, top - (q2 % 2 ? h * 0.02 : h * 0.06),
                           b2, top + (q2 % 2 ? h * 0.06 : h * 0.02));
      }
      c.lineTo(w * 0.44, top + h * 0.16);
      c.closePath();
      c.fill();
      // 腹側の明るい縁
      c.strokeStyle = 'rgba(214,158,92,.3)';
      c.lineWidth = h * 0.05;
      c.beginPath();
      c.moveTo(-w * 0.44, h * 0.22);
      c.quadraticCurveTo(0, h * 0.34, w * 0.44, h * 0.22);
      c.stroke();
      c.restore();

      anagoPath(c);
      c.strokeStyle = 'rgba(28,14,4,.7)';
      c.lineWidth = 1.4;
      c.stroke();

      // 山椒（控えめに）
      c.fillStyle = 'rgba(126,158,72,.85)';
      for (var s3 = 0; s3 < 3; s3++) {
        c.beginPath();
        c.arc(-w * 0.18 + s3 * (w * 0.18), top + h * 0.24 + (s3 % 2) * h * 0.12, 1.3, 0, 6.2832);
        c.fill();
      }
      break;
    }

    /* 10. 伊勢海老
       縦横比 1.5 の箱に上から見た姿を詰めると、どう描いてもダンゴムシになる。
       面積はそのままに胴を長くし（230x107）、体と同じくらい長い太い触角を
       前方へ振ることで伊勢海老になる。 */
    case 9: {
      // 230x107 を基準に描いてあるので実寸へ合わせる（縦横比 2.15 は不変）
      c.save();
      c.scale(w / 230, w / 230);
      var hh = 53.5;
      var SHELL_D = 'rgba(104,20,4,.85)';

      function feeler(x0, y0, x1, y1, x2, y2, wb, wt, col) {
        c.beginPath();
        c.moveTo(x0, y0 - wb / 2);
        c.quadraticCurveTo(x1, y1 - wt, x2, y2 - wt / 2);
        c.lineTo(x2, y2 + wt / 2);
        c.quadraticCurveTo(x1, y1 + wt, x0, y0 + wb / 2);
        c.closePath();
        c.fillStyle = col;
        c.fill();
        c.strokeStyle = SHELL_D;
        c.lineWidth = 1.2;
        c.stroke();
      }

      // 触角（この一対が伊勢海老の顔）
      [-1, 1].forEach(function (d) {
        feeler(-92, d * 14, -132, d * 34, -166, d * 50, 17, 4, '#e2542c');
        feeler(-97, d * 5, -134, d * 10, -156, d * 6, 7, 2.4, '#ef7a52');
      });

      // 歩脚
      c.strokeStyle = '#c8391c';
      c.lineCap = 'round';
      for (var lg2 = 0; lg2 < 4; lg2++) {
        var lx = -80 + lg2 * 13;
        [-1, 1].forEach(function (d) {
          c.lineWidth = 4;
          c.beginPath(); c.moveTo(lx, d * 26); c.lineTo(lx + 10, d * 38); c.stroke();
          c.lineWidth = 3;
          c.beginPath(); c.moveTo(lx + 10, d * 38); c.lineTo(lx + 24, d * 44); c.stroke();
        });
      }
      c.lineCap = 'butt';

      // 尾扇
      for (var t = -2; t <= 2; t++) {
        c.save();
        c.translate(52, 0);
        c.rotate(t * 0.52);
        c.fillStyle = lg(c, 0, 0, 46, 0, [[0, '#c2340f'], [1, '#ffb190']]);
        c.beginPath();
        c.moveTo(0, -12);
        c.quadraticCurveTo(34, -16, 46, 0);
        c.quadraticCurveTo(34, 16, 0, 12);
        c.closePath();
        c.fill();
        c.strokeStyle = SHELL_D; c.lineWidth = 1.5; c.stroke();
        c.restore();
      }

      // 腹節
      for (var sg = 4; sg >= 0; sg--) {
        var sx = -22 + sg * 18;
        var sh2 = 41 - sg * 3.6;
        var sgd = c.createLinearGradient(0, -sh2, 0, sh2);
        sgd.addColorStop(0, '#ff9666');
        sgd.addColorStop(0.34, '#e84a22');
        sgd.addColorStop(0.78, '#b32a0e');
        sgd.addColorStop(1, '#7d1a06');
        c.fillStyle = sgd;
        rr(c, sx - 15, -sh2, 32, sh2 * 2, 13);
        c.fill();
        c.strokeStyle = SHELL_D; c.lineWidth = 1.6; c.stroke();
        c.fillStyle = 'rgba(255,255,255,.24)';
        rr(c, sx - 9, -sh2 + 6, 20, 6, 3);
        c.fill();
      }

      // 頭胸甲（前を丸く狭め、後ろを広く）
      var hg = c.createLinearGradient(0, -hh, 0, hh);
      hg.addColorStop(0, '#ff9061');
      hg.addColorStop(0.36, '#e2481f');
      hg.addColorStop(0.8, '#ab2409');
      hg.addColorStop(1, '#791805');
      c.fillStyle = hg;
      c.beginPath();
      c.moveTo(-98, -20);
      c.quadraticCurveTo(-100, -14, -104, -8);
      c.lineTo(-97, 0);
      c.lineTo(-104, 8);
      c.quadraticCurveTo(-100, 14, -98, 20);
      c.quadraticCurveTo(-105, 26, -98, 20);
      c.moveTo(-98, -20);
      c.quadraticCurveTo(-102, -32, -88, -35);
      c.lineTo(-40, -43);
      c.quadraticCurveTo(-26, 0, -40, 43);
      c.lineTo(-88, 35);
      c.quadraticCurveTo(-102, 32, -98, 20);
      c.quadraticCurveTo(-105, 0, -98, -20);
      c.closePath();
      c.fill();
      c.strokeStyle = SHELL_D; c.lineWidth = 2; c.stroke();

      // 甲羅のトゲ
      c.fillStyle = '#ffb695';
      for (var sp = 0; sp < 10; sp++) {
        var col2 = sp % 5;
        c.beginPath();
        c.arc(-92 + col2 * 12, (sp < 5 ? -1 : 1) * (13 + col2 * 3.4), 2.6, 0, 6.2832);
        c.fill();
      }
      c.strokeStyle = 'rgba(255,190,160,.4)';
      c.lineWidth = 2.4;
      c.beginPath(); c.moveTo(-92, 0); c.lineTo(-46, 0); c.stroke();

      // 目（前端に小さく）
      [-1, 1].forEach(function (d) {
        c.fillStyle = '#1b0b08';
        c.beginPath(); c.arc(-94, d * 11, 4.2, 0, 6.2832); c.fill();
        c.fillStyle = 'rgba(255,255,255,.9)';
        c.beginPath(); c.arc(-95.4, d * 11 - 1.4, 1.5, 0, 6.2832); c.fill();
      });

      c.restore();
      break;
    }

    /* 11. ゴールデンすし桶 */
    case 10: {
      var GR = d.r;
      var gg = c.createRadialGradient(-GR * 0.3, -GR * 0.35, GR * 0.1, 0, 0, GR);
      gg.addColorStop(0, '#fff6c9'); gg.addColorStop(0.45, '#f2ce4e');
      gg.addColorStop(0.8, '#d19a1c'); gg.addColorStop(1, '#8f6008');
      c.fillStyle = gg;
      c.beginPath(); c.arc(0, 0, GR, 0, 6.2832); c.fill();
      c.strokeStyle = '#7a5106'; c.lineWidth = 4; c.stroke();
      c.strokeStyle = 'rgba(120,80,10,.55)'; c.lineWidth = 6;
      c.beginPath(); c.arc(0, 0, GR * 0.86, 0, 6.2832); c.stroke();
      var ig = c.createRadialGradient(0, -GR * 0.2, GR * 0.05, 0, 0, GR * 0.74);
      ig.addColorStop(0, '#fffbe6'); ig.addColorStop(1, '#e9ca45');
      c.fillStyle = ig;
      c.beginPath(); c.arc(0, 0, GR * 0.74, 0, 6.2832); c.fill();
      c.fillStyle = '#7a1f14';
      c.font = '700 ' + (GR * 0.95) + 'px ' + F_MIN;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('寿', 0, GR * 0.04);
      c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 3; c.lineCap = 'round';
      c.beginPath(); c.arc(0, 0, GR * 0.93, -2.5, -1.7); c.stroke();
      c.lineCap = 'butt';
      break;
    }
  }
}

/* ---- ガリ（甘酢生姜の薄切り） ---- */
function drawGari(c) {
  var R = GARI.r;
  for (var i = 0; i < 3; i++) {
    c.save();
    c.translate((i - 1) * R * 0.3, (i - 1) * R * 0.16);
    c.rotate((i - 1) * 0.5);
    var g = c.createLinearGradient(0, -R, 0, R);
    g.addColorStop(0, '#fff2f5');
    g.addColorStop(1, '#ffa8c2');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-R * 0.95, R * 0.25);
    c.quadraticCurveTo(-R * 0.5, -R * 1.25, R * 0.55, -R * 0.5);
    c.quadraticCurveTo(R * 1.1, R * 0.2, 0, R * 0.95);
    c.quadraticCurveTo(-R * 0.6, R * 0.85, -R * 0.95, R * 0.25);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(198,104,138,.7)'; c.lineWidth = 0.9; c.stroke();
    c.restore();
  }
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.1;
  c.beginPath();
  c.moveTo(-R * 0.45, R * 0.35);
  c.quadraticCurveTo(0, -R * 0.3, R * 0.5, -R * 0.3);
  c.stroke();
}

/* ---- ネタをスプライトに焼く ----
   毎フレーム全ネタを描き直すと重いので、起動時に一度だけ
   オフスクリーンへ描いて、あとは drawImage で回す。 */
var sprites = [];
var gariSprite = null;
var SPR_SCALE = 3;

function makeSprite(w, h, pad, drawFn) {
  var cw = w + pad * 2, ch = h + pad * 2;
  var cv = document.createElement('canvas');
  cv.width = Math.ceil(cw * SPR_SCALE);
  cv.height = Math.ceil(ch * SPR_SCALE);
  var c = cv.getContext('2d');
  c.scale(SPR_SCALE, SPR_SCALE);
  c.translate(cw / 2, ch / 2);
  drawFn(c);
  return { cv: cv, w: cw, h: ch };
}

function buildSprites() {
  for (var i = 0; i < SUSHI.length; i++) {
    (function (lv) {
      var d = SUSHI[lv];
      sprites[lv] = makeSprite(d.hw * 2, d.hh * 2, d.pad || 8,
        function (c) { drawItem(c, lv); });
    })(i);
  }
  gariSprite = makeSprite(GARI.r * 2, GARI.r * 2, 8, drawGari);
}

function spriteOf(item) {
  return item.gari ? gariSprite : sprites[item.level];
}
function paintSprite(c, sp) {
  c.drawImage(sp.cv, -sp.w / 2, -sp.h / 2, sp.w, sp.h);
}

/* ---- 桶（枠）の描画 ----
   桶は動かないので、起動時にオフスクリーンへ一度だけ描いて
   毎フレームは drawImage 1回で済ませる（iPhone での負荷を抑える）。 */
var barrelCv = null;

/* 和紙の繊維テクスチャ（タイル）。
   目に見える「模様」にならないよう、ざらつきとして感じる程度に留める。 */
function buildWashiPattern(c) {
  var S = 256;
  var t = document.createElement('canvas');
  t.width = t.height = S;
  var x = t.getContext('2d');
  x.lineWidth = 0.6;
  for (var i = 0; i < 900; i++) {
    var px = Math.random() * S, py = Math.random() * S;
    var a = Math.random() * Math.PI, len = 1.5 + Math.random() * 5;
    x.strokeStyle = 'rgba(140,108,58,' + (0.012 + Math.random() * 0.026).toFixed(3) + ')';
    x.beginPath();
    x.moveTo(px, py);
    x.lineTo(px + Math.cos(a) * len, py + Math.sin(a) * len);
    x.stroke();
  }
  for (var j = 0; j < 1400; j++) {
    x.fillStyle = 'rgba(130,100,52,' + (0.01 + Math.random() * 0.028).toFixed(3) + ')';
    x.fillRect(Math.random() * S, Math.random() * S, 1, 1);
  }
  return c.createPattern(t, 'repeat');
}

function buildBarrel() {
  barrelCv = document.createElement('canvas');
  barrelCv.width = W * 2;
  barrelCv.height = H * 2;
  var c = barrelCv.getContext('2d');
  c.scale(2, 2);
  drawBarrelTo(c);
}

function drawBarrelTo(c) {
  // ---- 店の板壁 ----
  var wall = c.createLinearGradient(0, 0, 0, BARREL_TOP);
  wall.addColorStop(0, '#ddd1b7');
  wall.addColorStop(0.55, '#cbbc9c');
  wall.addColorStop(1, '#ac9a78');
  c.fillStyle = wall;
  c.fillRect(0, 0, W, H);
  // 板の継ぎ目（縦羽目板）
  for (var pk = 1; pk < 8; pk++) {
    var kx = Math.round(pk * (W / 8)) + 0.5;
    c.strokeStyle = 'rgba(96,70,36,.16)';
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(kx, 0); c.lineTo(kx, BARREL_TOP); c.stroke();
    c.strokeStyle = 'rgba(255,247,228,.3)';
    c.beginPath(); c.moveTo(kx + 1.5, 0); c.lineTo(kx + 1.5, BARREL_TOP); c.stroke();
  }
  c.save();
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = buildWashiPattern(c);
  c.fillRect(0, 0, W * 2, H * 2);
  c.restore();

  // ---- 暖簾 ----
  var NOREN_H = 150, ROD_Y = 12;
  // 竹の掛け竿
  var rod = c.createLinearGradient(0, ROD_Y - 4, 0, ROD_Y + 4);
  rod.addColorStop(0, '#c9a86a');
  rod.addColorStop(0.5, '#9d7c42');
  rod.addColorStop(1, '#6f5527');
  c.fillStyle = rod;
  c.fillRect(6, ROD_Y - 4, W - 12, 8);

  var chars = ['す', 'し', '積', 'む'];
  var nx = 16, nw = (W - 32 - 3 * 5) / 4;
  for (var pn = 0; pn < 4; pn++) {
    var px = nx + pn * (nw + 5);
    var ng = c.createLinearGradient(px, ROD_Y, px + nw, ROD_Y + NOREN_H);
    ng.addColorStop(0, '#22456b');
    ng.addColorStop(0.5, '#173250');
    ng.addColorStop(1, '#0f2339');
    c.fillStyle = ng;
    c.beginPath();
    c.moveTo(px, ROD_Y);
    c.lineTo(px + nw, ROD_Y);
    c.lineTo(px + nw, ROD_Y + NOREN_H - 6);
    // 裾はわずかに揺れる
    c.quadraticCurveTo(px + nw * 0.5, ROD_Y + NOREN_H + (pn % 2 ? 4 : -3),
                       px, ROD_Y + NOREN_H - 5);
    c.closePath();
    c.fill();
    // 織りの縦筋
    c.save();
    c.clip();
    c.strokeStyle = 'rgba(255,255,255,.05)';
    c.lineWidth = 1;
    for (var t = 0; t < 6; t++) {
      c.beginPath();
      c.moveTo(px + 6 + t * (nw / 6), ROD_Y);
      c.lineTo(px + 6 + t * (nw / 6), ROD_Y + NOREN_H);
      c.stroke();
    }
    c.restore();
    // 白抜きの文字
    c.fillStyle = '#f4efe2';
    c.font = '600 46px ' + F_MIN;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(chars[pn], px + nw / 2, ROD_Y + NOREN_H * 0.52);
  }
  // 暖簾の落とす影
  var nsh = c.createLinearGradient(0, ROD_Y + NOREN_H - 4, 0, ROD_Y + NOREN_H + 44);
  nsh.addColorStop(0, 'rgba(40,25,8,.22)');
  nsh.addColorStop(1, 'rgba(40,25,8,0)');
  c.fillStyle = nsh;
  c.fillRect(0, ROD_Y + NOREN_H - 4, W, 48);

  // 桶が壁に落とす影
  var bsh = c.createLinearGradient(0, BARREL_TOP, 0, BARREL_TOP - 30);
  bsh.addColorStop(0, 'rgba(40,25,8,.28)');
  bsh.addColorStop(1, 'rgba(40,25,8,0)');
  c.fillStyle = bsh;
  c.fillRect(0, BARREL_TOP - 30, W, 30);

  // ---- すし桶の中（和紙）----
  var inner = c.createLinearGradient(0, BARREL_TOP, 0, FLOOR);
  inner.addColorStop(0, '#fefdfa');
  inner.addColorStop(0.5, '#f7f1e3');
  inner.addColorStop(1, '#e7dcc2');
  c.fillStyle = inner;
  c.fillRect(WALL, BARREL_TOP, W - WALL * 2, FLOOR - BARREL_TOP);

  c.save();
  c.beginPath();
  c.rect(WALL, BARREL_TOP, W - WALL * 2, FLOOR - BARREL_TOP);
  c.clip();

  // 桶の底の簀（すのこ）
  c.strokeStyle = 'rgba(150,115,65,.13)';
  c.lineWidth = 1;
  for (var i = 0; i < 6; i++) {
    var sy = FLOOR - 7 - i * 13;
    c.beginPath();
    c.moveTo(WALL + 7, sy + 0.5);
    c.lineTo(W - WALL - 7, sy + 0.5);
    c.stroke();
  }
  // 内側の陰
  function shade(x0, y0, x1, y1, w2, h2, a) {
    var g = c.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, 'rgba(88,62,26,' + a + ')');
    g.addColorStop(1, 'rgba(88,62,26,0)');
    c.fillStyle = g;
    c.fillRect(x0 < x1 ? x0 : x1, y0 < y1 ? y0 : y1, w2, h2);
  }
  shade(0, BARREL_TOP, 0, BARREL_TOP + 54, W, 54, .2);
  shade(0, FLOOR, 0, FLOOR - 70, W, 70, .17);
  shade(WALL, 0, WALL + 24, 0, 24, H, .14);
  shade(W - WALL, 0, W - WALL - 24, 0, 24, H, .14);

  // 落款
  var seal = document.createElement('canvas');
  seal.width = seal.height = 72;
  var sc = seal.getContext('2d');
  sc.fillStyle = '#c8402f';
  rr(sc, 4, 4, 64, 64, 10);
  sc.fill();
  sc.globalCompositeOperation = 'destination-out';
  sc.font = '600 44px ' + F_MIN;
  sc.textAlign = 'center';
  sc.textBaseline = 'middle';
  sc.fillText('寿', 36, 38);
  c.save();
  c.globalAlpha = 0.13;
  c.drawImage(seal, W - WALL - 42, BARREL_TOP + 26, 26, 26);
  c.restore();
  c.restore();

  // ---- 桶の枠（白木）----
  var wood = c.createLinearGradient(0, BARREL_TOP, 0, H);
  wood.addColorStop(0, '#eed8b2');
  wood.addColorStop(0.4, '#d0ae7d');
  wood.addColorStop(1, '#ab875a');
  c.fillStyle = wood;
  c.fillRect(0, BARREL_TOP, WALL, H - BARREL_TOP);
  c.fillRect(W - WALL, BARREL_TOP, WALL, H - BARREL_TOP);
  c.fillRect(0, H - WALL, W, WALL);

  // 木目
  c.strokeStyle = 'rgba(126,90,44,.22)';
  c.lineWidth = 1;
  for (var g2 = 0; g2 < 3; g2++) {
    var gx = 3 + g2 * 4;
    c.beginPath();
    c.moveTo(gx + 0.5, BARREL_TOP);
    c.bezierCurveTo(gx + 3, BARREL_TOP + (H - BARREL_TOP) * 0.35,
                    gx - 3, BARREL_TOP + (H - BARREL_TOP) * 0.7, gx + 1, H);
    c.stroke();
    c.beginPath();
    c.moveTo(W - gx - 0.5, BARREL_TOP);
    c.bezierCurveTo(W - gx - 3, BARREL_TOP + (H - BARREL_TOP) * 0.38,
                    W - gx + 3, BARREL_TOP + (H - BARREL_TOP) * 0.74, W - gx - 1, H);
    c.stroke();
  }
  for (var g3 = 0; g3 < 2; g3++) {
    var gy = H - WALL + 4 + g3 * 4;
    c.beginPath();
    c.moveTo(0, gy + 0.5);
    c.bezierCurveTo(W * 0.3, gy + 2.5, W * 0.7, gy - 1.5, W, gy + 0.5);
    c.stroke();
  }

  // 箍（たが）
  [BARREL_TOP + Math.round((H - BARREL_TOP) * 0.32),
   BARREL_TOP + Math.round((H - BARREL_TOP) * 0.74)].forEach(function (hy) {
    var hg = c.createLinearGradient(0, hy, 0, hy + 4);
    hg.addColorStop(0, '#c08145');
    hg.addColorStop(0.45, '#96602d');
    hg.addColorStop(1, '#77471f');
    c.fillStyle = hg;
    c.fillRect(0, hy, WALL, 4);
    c.fillRect(W - WALL, hy, WALL, 4);
    c.fillStyle = 'rgba(255,228,175,.3)';
    c.fillRect(0, hy, WALL, 1);
    c.fillRect(W - WALL, hy, WALL, 1);
  });

  // 桶の縁（木口）
  var rim = c.createLinearGradient(0, BARREL_TOP - 3, 0, BARREL_TOP + 5);
  rim.addColorStop(0, '#fff3dd');
  rim.addColorStop(1, '#c8a674');
  c.fillStyle = rim;
  c.fillRect(0, BARREL_TOP - 3, WALL, 8);
  c.fillRect(W - WALL, BARREL_TOP - 3, WALL, 8);
  c.strokeStyle = 'rgba(105,74,34,.6)';
  c.lineWidth = 1;
  c.strokeRect(0.5, BARREL_TOP - 2.5, WALL - 1, 7);
  c.strokeRect(W - WALL + 0.5, BARREL_TOP - 2.5, WALL - 1, 7);

  // 桶の内側の線
  c.strokeStyle = 'rgba(105,74,34,.5)';
  c.beginPath();
  c.moveTo(WALL + 0.5, BARREL_TOP);
  c.lineTo(WALL + 0.5, FLOOR + 0.5);
  c.lineTo(W - WALL - 0.5, FLOOR + 0.5);
  c.lineTo(W - WALL - 0.5, BARREL_TOP);
  c.stroke();
}

/* ---- デッドライン：文字を置かず、朱の目印だけで示す ---- */
function drawDeadline(danger) {
  ctx.save();
  ctx.setLineDash([2, 7]);
  ctx.lineWidth = 1;
  ctx.strokeStyle = danger ? 'rgba(200,64,47,.9)' : 'rgba(200,64,47,.26)';
  ctx.beginPath();
  ctx.moveTo(WALL + 10, DEAD_Y + 0.5);
  ctx.lineTo(W - WALL - 10, DEAD_Y + 0.5);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = danger ? '#c8402f' : 'rgba(200,64,47,.5)';
  ctx.beginPath();
  ctx.moveTo(WALL - 1, DEAD_Y - 5.5); ctx.lineTo(WALL + 10, DEAD_Y); ctx.lineTo(WALL - 1, DEAD_Y + 5.5);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(W - WALL + 1, DEAD_Y - 5.5); ctx.lineTo(W - WALL - 10, DEAD_Y); ctx.lineTo(W - WALL + 1, DEAD_Y + 5.5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---- ガイドライン ---- */
function drawGuide() {
  if (!current || state !== 'ready') return;
  var hw = itemHalfWidth(current);
  ctx.save();
  ctx.setLineDash([2, 8]);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(40,52,68,.22)';
  ctx.beginPath();
  ctx.moveTo(previewX, previewY + itemHalfHeight(current) + 6);
  ctx.lineTo(previewX, FLOOR - 4);
  ctx.stroke();
  ctx.setLineDash([]);
  // 着地の見当（幅を示す横線と両端の爪）
  ctx.strokeStyle = 'rgba(40,52,68,.3)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(previewX - hw, FLOOR - 3.5);
  ctx.lineTo(previewX + hw, FLOOR - 3.5);
  ctx.moveTo(previewX - hw + 0.5, FLOOR - 9);
  ctx.lineTo(previewX - hw + 0.5, FLOOR - 3.5);
  ctx.moveTo(previewX + hw - 0.5, FLOOR - 9);
  ctx.lineTo(previewX + hw - 0.5, FLOOR - 3.5);
  ctx.stroke();
  ctx.restore();
}

/* ---- 待機中のネタ ---- */
function drawPreview() {
  if (!current || state !== 'ready') return;
  ctx.save();
  ctx.translate(previewX, previewY);
  ctx.globalAlpha = 0.97;
  paintSprite(ctx, spriteOf(current));
  ctx.restore();
  if (current.gari) {
    ctx.save();
    ctx.fillStyle = 'rgba(200,64,47,.72)';
    ctx.font = '600 9px ' + F_MIN;
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('ガ リ', previewX, previewY + 12);
    ctx.restore();
  }
}

/* ---- NEXT プレビュー ---- */
var nextCv = document.getElementById('nextCv');
var nctx = nextCv.getContext('2d');
function drawNextPreview() {
  var S = nextCv.width;
  nctx.setTransform(1, 0, 0, 1, 0, 0);
  nctx.clearRect(0, 0, S, S);
  if (!next) return;
  var sp = spriteOf(next);
  var k = (S * 0.86) / Math.max(sp.w, sp.h);
  nctx.save();
  nctx.translate(S / 2, S / 2);
  nctx.scale(k, k);
  paintSprite(nctx, sp);
  nctx.restore();
}

/* ============================================================
   15. メインループ
   ============================================================ */
var lastTime = performance.now();
var acc = 0;
var STEP = 1000 / 60;

function loop(now) {
  requestAnimationFrame(loop);
  var dt = now - lastTime;
  lastTime = now;
  if (dt > 200) dt = 200;

  if (state !== 'title' && state !== 'over') {
    acc += dt;
    var guard = 0;
    while (acc >= STEP && guard < 4) {
      Engine.update(engine, STEP);
      acc -= STEP; guard++;
    }
    if (acc > STEP * 4) acc = 0;
    flushOps();
    sweepStrays();
    orderTick(dt);
    checkGameOver(dt / 1000);
  }
  stepParticles();
  stepFloats();
  render();
}

/* 桶の外へこぼれたネタを片付ける */
function sweepStrays() {
  var bodies = Composite.allBodies(world);
  for (var i = 0; i < bodies.length; i++) {
    var b = bodies[i];
    if (b.isStatic || !(b.sushi || b.gari)) continue;
    if (b.position.y > H + 60 || b.position.x < -60 || b.position.x > W + 60) {
      Composite.remove(world, b);
    }
  }
}

function checkGameOver(dtSec) {
  var bodies = Composite.allBodies(world);
  var breach = false;
  var now = performance.now();
  for (var i = 0; i < bodies.length; i++) {
    var b = bodies[i];
    var meta = b.sushi || b.gari;
    if (!meta || b.isStatic) continue;
    if (now - meta.born < 900) continue;           // 落下直後は猶予
    if (b.bounds.min.y < DEAD_Y) { breach = true; break; }
  }
  if (breach) {
    deadTimer += dtSec;
    if (deadTimer >= DEAD_LIMIT) gameOver();
  } else {
    deadTimer = Math.max(0, deadTimer - dtSec * 2);
  }
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.drawImage(barrelCv, 0, 0, W, H);

  var danger = deadTimer > 0.05;
  drawDeadline(danger);
  drawGuide();

  // ボディ
  var bodies = Composite.allBodies(world);
  for (var i = 0; i < bodies.length; i++) {
    var b = bodies[i];
    if (b.isStatic) continue;
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    // 影
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#4a3418';
    ctx.beginPath();
    var hh = b.gari ? GARI.r : SUSHI[b.sushi.level].hh;
    var hw = b.gari ? GARI.r : SUSHI[b.sushi.level].hw;
    ctx.ellipse(2, hh * 0.55 + 2, hw * 0.92, hh * 0.55, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();

    paintSprite(ctx, b.gari ? gariSprite : sprites[b.sushi.level]);
    ctx.restore();
  }

  drawOrder();
  drawPreview();

  // パーティクル
  for (var p2 = 0; p2 < particles.length; p2++) {
    var p = particles[p2];
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    if (p.sq) {
      ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1);
    } else {
      ctx.beginPath(); ctx.arc(0, 0, p.r * 0.85, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 加算点
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var fi = 0; fi < floats.length; fi++) {
    var f = floats[fi];
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life * 1.6);
    ctx.fillStyle = f.c;
    ctx.font = '700 16px ' + F_GO;
    ctx.fillText(f.t, f.x, f.y);
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 危険警告：赤ベタではなく、上から差す朱の光で知らせる
  if (danger && state !== 'over') {
    var remain = Math.max(0, DEAD_LIMIT - deadTimer);
    var pulse = 0.45 + 0.55 * Math.abs(Math.sin(performance.now() / 165));
    ctx.save();
    var wg = ctx.createLinearGradient(0, BARREL_TOP, 0, BARREL_TOP - 96);
    wg.addColorStop(0, 'rgba(200,64,47,' + (0.42 * pulse).toFixed(3) + ')');
    wg.addColorStop(1, 'rgba(200,64,47,0)');
    ctx.fillStyle = wg;
    ctx.fillRect(WALL, BARREL_TOP - 96, W - WALL * 2, 96);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,250,242,' + (0.55 + 0.45 * pulse).toFixed(3) + ')';
    ctx.font = '600 17px ' + F_MIN;
    ctx.fillText('の れ ん 際', W / 2, BARREL_TOP - 62);
    ctx.font = '200 32px ' + F_GO;
    ctx.fillText(remain.toFixed(1), W / 2, BARREL_TOP - 30);
    ctx.restore();
  }
}

/* ============================================================
   16. ゲームオーバー / リスタート
   ============================================================ */
function rankOf(s) {
  var r = RANKS[0];
  for (var i = 0; i < RANKS.length; i++) if (s >= RANKS[i].s) r = RANKS[i];
  return r;
}
function gameOver() {
  if (state === 'over') return;
  state = 'over';
  pointerDown = false;
  var r = rankOf(score);
  document.getElementById('rankName').textContent = r.name;
  document.getElementById('rankNote').textContent =
    (gameMode === 'order' ? '［お品書き］ ' : '') + r.note +
    (gameMode === 'order' && chainBest >= 2 ? '　最高 ' + chainBest + '連鎖' : '');
  document.getElementById('finalScore').textContent = fmt(score);
  document.getElementById('finalHi').textContent = fmt(hiScore);
  document.getElementById('overModal').hidden = false;
  beep(180, 0.5, 'sawtooth');

  // 名前を登録済みなら自動で送る。初回は本人が押すまで送らない
  if (rankDb) {
    sendNote.textContent = '';
    var savedName = cleanName(lsGet('sushitsumu.name') || '');
    nameInput.value = savedName;
    if (savedName && score > 0) doSubmit();
  }
  var bodies = Composite.allBodies(world);
  for (var i = 0; i < bodies.length; i++) {
    if (!bodies[i].isStatic) {
      burst(bodies[i].position.x, bodies[i].position.y, ['#ffffff', '#ffd9a0'], 3, 2);
    }
  }
}

function resetGame() {
  var bodies = Composite.allBodies(world);
  for (var i = 0; i < bodies.length; i++) {
    if (!bodies[i].isStatic) Composite.remove(world, bodies[i]);
  }
  pendingOps.length = 0;
  particles.length = 0;
  floats.length = 0;
  score = 0; scoreEl.textContent = '0';
  deadTimer = 0;
  previewX = W / 2; previewY = DROP_Y;
  pointerDown = false; dropLock = false;
  lastPtr = { x: W / 2, y: DROP_Y + FINGER_OFFSET_Y };
  order = null; orderWait = 0; orderMult = 1; orderStreak = 0; maxLevelMade = 2;
  chainBest = 0;
  current = null; next = null;
  state = 'ready';
  acc = 0;
  lastTime = performance.now();
  nextTurn();
}

document.body.classList.add('titling');
