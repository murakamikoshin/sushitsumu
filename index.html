/* ============================================================
   17. お品書き（注文モード）
   大将が注文を出し、その通りのネタを合体で作れば祝儀が付く。
   続けて捌くほど「のれん」倍率が上がり、落とすと一に戻る。
   注文の木札は、暖簾と桶のあいだの壁に掛ける。
   ============================================================ */
var gameMode = 'normal';     // normal | order
var order = null;            // {level, need, done, span, until}
var orderMult = 1;
var orderStreak = 0;
var orderWait = 0;           // 次の注文までの間(ms)
var maxLevelMade = 2;        // これまでに作れた最大レベル(0基点)

var ORDER_CHEERS = ['へい、お待ち！', 'あいよ、上がり！', 'ありがとうございます！'];

/* 連鎖（お品書きのみ）
   落とした直後の合体を数えると、ただの連打が連鎖になってしまう。
   「合体で生まれた駒が、間を置かずさらに合体した時」だけを連鎖と数える。 */
var CHAIN_WINDOW = 1400;   // 生まれてからこの時間内に合体すれば繋がったとみなす(ms)
var CHAIN_CAP = 4;         // 倍率の上限
var chainBest = 0;         // そのプレイでの最高連鎖

function chainMult(n) { return Math.min(CHAIN_CAP, 1 + (n - 1) * 0.7); }

var CHAIN_KANJI = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function chainLabel(n) {
  if (n >= 5) return '大 連 鎖 ！';
  return CHAIN_KANJI[n] + ' 連 ！';
}

/* 合体しようとしている二つが、直前の合体から続いているか */
function chainDepthOf(a, b) {
  if (gameMode !== 'order') return 1;
  var now = performance.now(), inherited = 0, i, bd, list = [a, b];
  for (i = 0; i < 2; i++) {
    bd = list[i];
    if (bd.sushi && bd.sushi.mergedAt && now - bd.sushi.mergedAt < CHAIN_WINDOW) {
      if (bd.sushi.chain > inherited) inherited = bd.sushi.chain;
    }
  }
  return inherited + 1;
}

function orderReward(L) { return MERGE_SCORE[L - 1] * 6; }

function newOrder() {
  // 作れる見込みのある範囲から選ぶ。届かない注文は出さない
  var top = Math.min(maxLevelMade + 1, SUSHI.length - 2);
  var lo = Math.max(1, top - 2);
  var L = lo + Math.floor(Math.random() * (top - lo + 1));
  var need = L <= 3 ? 2 + Math.floor(Math.random() * 2)
           : L <= 6 ? 1 + Math.floor(Math.random() * 2)
           : 1;
  var sec = 18 + L * 4 + (need - 1) * 10;
  order = { level: L, need: need, done: 0, span: sec * 1000, until: performance.now() + sec * 1000 };
}

function orderTick(dtMs) {
  if (gameMode !== 'order' || state === 'title' || state === 'over') return;
  if (orderWait > 0) {
    orderWait -= dtMs;
    if (orderWait <= 0) newOrder();
    return;
  }
  if (!order) { newOrder(); return; }
  if (performance.now() > order.until) {
    showPop('相すみません…', 1);
    beep(190, 0.32, 'sawtooth');
    orderStreak = 0;
    orderMult = 1;
    order = null;
    orderWait = 900;
  }
}

/* 合体で level が出来たときに呼ぶ */
function orderMade(level) {
  if (level > maxLevelMade) maxLevelMade = level;
  if (gameMode !== 'order' || !order || level !== order.level) return;
  order.done++;
  if (order.done < order.need) { beep(980, 0.07, 'triangle'); return; }

  var bonus = Math.round(orderReward(order.level) * order.need * orderMult);
  addScore(bonus);
  addFloat(W / 2, BARREL_TOP - 46, '+' + fmt(bonus), '#c8402f');
  orderStreak++;
  orderMult = Math.min(3, 1 + orderStreak * 0.5);
  showPop(orderStreak >= 4 ? 'よっ、日本一！'
        : ORDER_CHEERS[Math.min(orderStreak, ORDER_CHEERS.length) - 1], 1);
  beep(1180, 0.18, 'square');
  burst(W / 2, BARREL_TOP - 34, ['#c8402f', '#ffd76a', '#fffaf0'], 34, 5.5);
  order = null;
  orderWait = 1100;
}

/* 注文の木札（壁に掛ける） */
function drawOrder() {
  if (gameMode !== 'order') return;
  var PW = 224, PH = 78;
  var px = (W - PW) / 2, py = BARREL_TOP - 98;   // 待機中のネタと重ならない位置

  // 掛け紐
  ctx.strokeStyle = 'rgba(70,45,16,.5)';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(px + PW * 0.5 - 20, py - 12);
  ctx.lineTo(px + PW * 0.5, py + 2);
  ctx.lineTo(px + PW * 0.5 + 20, py - 12);
  ctx.stroke();

  // 木札
  var wg = ctx.createLinearGradient(0, py, 0, py + PH);
  wg.addColorStop(0, '#f3e0bd');
  wg.addColorStop(0.5, '#e3caa0');
  wg.addColorStop(1, '#c8a878');
  ctx.fillStyle = wg;
  rr(ctx, px, py, PW, PH, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(96,66,26,.6)';
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,250,232,.55)';
  ctx.lineWidth = 1;
  rr(ctx, px + 3.5, py + 3.5, PW - 7, PH - 7, 4);
  ctx.stroke();

  ctx.textBaseline = 'middle';

  if (!order) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(90,62,24,.75)';
    ctx.font = '600 15px ' + F_MIN;
    ctx.fillText('次 の ご 注 文 を お 待 ち …', px + PW / 2, py + PH / 2);
    return;
  }

  // ネタ
  var sp = sprites[order.level];
  var k = Math.min(52 / sp.w, 46 / sp.h);
  ctx.save();
  ctx.translate(px + 36, py + 32);
  ctx.scale(k, k);
  paintSprite(ctx, sp);
  ctx.restore();

  // 一行目：見出しと、のれん倍率
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(120,86,38,.85)';
  ctx.font = '600 9.5px ' + F_MIN;
  ctx.fillText('ご 注 文', px + 70, py + 15);
  if (orderMult > 1) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#c8402f';
    ctx.font = '700 12px ' + F_GO;
    ctx.fillText('のれん x' + orderMult.toFixed(1), px + PW - 12, py + 15);
  }

  // 二行目：品名。長い名前は札からはみ出すので自動で縮める
  ctx.textAlign = 'left';
  ctx.fillStyle = '#4a3212';
  var nm = SUSHI[order.level].n;
  var avail = PW - 70 - 14, fs = 17;
  ctx.font = '600 ' + fs + 'px ' + F_MIN;
  while (fs > 11 && ctx.measureText(nm).width > avail) {
    fs -= 1;
    ctx.font = '600 ' + fs + 'px ' + F_MIN;
  }
  ctx.fillText(nm, px + 70, py + 36);

  // 三行目：貫数を丸で数える
  for (var i = 0; i < order.need; i++) {
    var cx = px + 75 + i * 15, cy = py + 55;
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, 6.2832);
    ctx.fillStyle = i < order.done ? '#c8402f' : 'rgba(120,86,38,.22)';
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(120,86,38,.85)';
  ctx.font = '600 10px ' + F_MIN;
  ctx.fillText(order.need + '貫', px + 75 + order.need * 15 + 3, py + 56);

  // 残り時間
  var left = Math.max(0, order.until - performance.now());
  var ratio = Math.max(0, Math.min(1, left / order.span));
  var bx = px + 70, bw = PW - 82;
  ctx.fillStyle = 'rgba(120,86,38,.2)';
  rr(ctx, bx, py + PH - 16, bw, 5, 2.5);
  ctx.fill();
  ctx.fillStyle = ratio < 0.25 ? '#c8402f' : '#8a6a2c';
  rr(ctx, bx, py + PH - 16, Math.max(2, bw * ratio), 5, 2.5);
  ctx.fill();
}

/* ============================================================
   18. オンライン番付
   共有データベースはアーティファクトとして公開した時だけ使える。
   単体の index.html には window.claude が無いので、その場合は
   番付の UI ごと隠して、これまで通り端末内のハイスコアだけで動かす。
   ============================================================ */
var RANK_SHOW = 20;      // 一覧に出す人数
var RANK_SCAN = 100;     // 自分の順位を数えるために見る範囲
var rankDb = null;
var rankMode = 'day';
var rankKind = 'normal';     // どちらの遊び方の番付か
var rankBusy = false;

/* 日付は日本時間で切る。閲覧者の時計に任せると日替わりがばらつく */
function jstDay(ms) {
  var d = new Date((ms || Date.now()) + 9 * 3600 * 1000);
  return d.getUTCFullYear() + '-' +
         ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' +
         ('0' + d.getUTCDate()).slice(-2);
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function playerId() {
  var v = lsGet('sushitsumu.pid');
  if (!v) {
    v = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    lsSet('sushitsumu.pid', v);
  }
  return v;
}
/* 他人が書いた名前は信用しない。制御文字を落として長さを切る */
function cleanName(n) {
  var src = String(n == null ? '' : n), out = '', i, c;
  for (i = 0; i < src.length && out.length < 12; i++) {
    c = src.charCodeAt(i);
    if (c < 32 || c === 127) continue;
    out += src.charAt(i);
  }
  return out.trim().slice(0, 12);
}

var nameInput = document.getElementById('nameInput');
var sendNote  = document.getElementById('sendNote');
var rankModal = document.getElementById('rankModal');
var rlistEl   = document.getElementById('rlist');
var rankScope = document.getElementById('rankScope');
var tabDay    = document.getElementById('tabDay');
var tabAll    = document.getElementById('tabAll');
var tabNormal = document.getElementById('tabNormal');
var tabOrder  = document.getElementById('tabOrder');

function initRanking() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  window.claude.use('db').then(function (db) {
    if (!db) return;
    rankDb = db;
    document.body.classList.add('has-rank');
    nameInput.value = cleanName(lsGet('sushitsumu.name') || '');
  })['catch'](function () {});
}

function rankFields(kind) {
  return kind === 'order'
    ? { all: 'bestO', day: 'dayBestO' }
    : { all: 'best',  day: 'dayBest'  };
}
function topQuery(n) {
  var f = rankFields(rankKind);
  var col = rankDb.collection('scores');
  return rankMode === 'day'
    ? col.where('day', '==', jstDay()).orderBy(f.day, 'desc').limit(n)
    : col.orderBy(f.all, 'desc').limit(n);
}
function scoreOf(row) {
  var f = rankFields(rankKind);
  return Number(rankMode === 'day' ? row[f.day] : row[f.all]) || 0;
}

/* 一人一文書。文書数が青天井にならないよう、自己ベストだけを持たせる */
function submitScore(name, sc, kind) {
  if (!rankDb) return Promise.reject({ code: 'unavailable' });
  var today = jstDay();
  var f = rankFields(kind);
  var ref = rankDb.doc('scores/' + playerId());
  return ref.get().then(function (snap) {
    var cur = (snap && snap.exists && snap.data()) || {};
    var sameDay = (cur.day === today);
    // set は全置換なので、触らない側の記録も持ち回す
    var body = {
      name: name, day: today, updatedAt: new Date().toISOString(),
      best:     Number(cur.best)  || 0,
      bestO:    Number(cur.bestO) || 0,
      dayBest:  sameDay ? (Number(cur.dayBest)  || 0) : 0,
      dayBestO: sameDay ? (Number(cur.dayBestO) || 0) : 0
    };
    body[f.all] = Math.max(body[f.all], sc);
    body[f.day] = Math.max(body[f.day], sc);
    return ref.set(body);
  });
}

/* 自分の順位を数える（RANK_SCAN 位まで） */
function myRank() {
  return topQuery(RANK_SCAN).get().then(function (snap) {
    var me = playerId();
    for (var i = 0; i < snap.docs.length; i++) {
      if (snap.docs[i].id === me) return i + 1;
    }
    return 0;
  });
}

function afterSubmit() {
  var keep = rankMode;
  rankKind = gameMode;
  rankMode = 'day';
  return myRank().then(function (d) {
    rankMode = 'all';
    return myRank().then(function (a) { return [d, a]; });
  }).then(function (r) {
    rankMode = keep;
    sendNote.innerHTML = '';
    var mk = function (label, pos) {
      var sp = document.createElement('span');
      sp.appendChild(document.createTextNode(label + ' '));
      var b = document.createElement('b');
      b.textContent = pos ? (pos + '位') : (RANK_SCAN + '位圏外');
      sp.appendChild(b);
      return sp;
    };
    sendNote.appendChild(mk('本日', r[0]));
    sendNote.appendChild(document.createTextNode('　'));
    sendNote.appendChild(mk('総合', r[1]));
  });
}

function doSubmit() {
  if (!rankDb || rankBusy) return;
  var name = cleanName(nameInput.value);
  if (!name) { sendNote.textContent = '名前を入れてください。'; nameInput.focus(); return; }
  lsSet('sushitsumu.name', name);
  rankBusy = true;
  sendNote.textContent = '送っています…';
  submitScore(name, score, gameMode).then(afterSubmit)['catch'](function (e) {
    sendNote.textContent = (e && e.code === 'quota_exceeded')
      ? '番付が満杯で登録できませんでした。'
      : '番付に繋がりませんでした。通信を確かめて、もう一度お試しください。';
  }).then(function () { rankBusy = false; });
}

function rankMessage(text) {
  rlistEl.innerHTML = '';
  var li = document.createElement('li');
  li.className = 'rEmpty';
  li.textContent = text;
  rlistEl.appendChild(li);
}

function renderRank(snap) {
  if (!snap || snap.empty) {
    rankMessage(rankMode === 'day'
      ? '本日はまだ誰も握っていません。一番乗りをどうぞ。'
      : 'まだ誰も番付に載っていません。');
    return;
  }
  rlistEl.innerHTML = '';
  var me = playerId();
  snap.docs.forEach(function (d, i) {
    var row = d.data() || {};
    var li = document.createElement('li');
    if (d.id === me) li.className = 'me';
    var rk = document.createElement('span');
    rk.className = 'rk' + (i < 3 ? ' g' + (i + 1) : '');
    rk.textContent = String(i + 1);
    var rn = document.createElement('span');
    rn.className = 'rn';
    // 他人が入れた名前。textContent なので何を書かれても崩れない
    rn.textContent = cleanName(row.name) || '名無し';
    var rs = document.createElement('span');
    rs.className = 'rs';
    rs.textContent = fmt(Math.max(0, Math.floor(scoreOf(row))));
    li.appendChild(rk); li.appendChild(rn); li.appendChild(rs);
    rlistEl.appendChild(li);
  });
}

function loadRank() {
  if (!rankDb) return;
  tabDay.classList.toggle('is-on', rankMode === 'day');
  tabAll.classList.toggle('is-on', rankMode === 'all');
  tabNormal.classList.toggle('is-on', rankKind === 'normal');
  tabOrder.classList.toggle('is-on', rankKind === 'order');
  rankScope.textContent =
    (rankKind === 'order' ? 'お品書き' : 'お任せ') + '・' +
    (rankMode === 'day' ? '本日（日本時間 ' + jstDay() + '）' : 'これまで') + 'の上位';
  rankMessage('読み込んでいます…');
  topQuery(RANK_SHOW).get().then(renderRank)['catch'](function () {
    rankMessage('番付を読み込めませんでした。');
  });
}

function openRankModal(mode, kind) {
  rankMode = mode || 'day';
  rankKind = kind || gameMode;
  rankModal.hidden = false;
  loadRank();
}

tabDay.addEventListener('click', function () { rankMode = 'day'; loadRank(); });
tabAll.addEventListener('click', function () { rankMode = 'all'; loadRank(); });
tabNormal.addEventListener('click', function () { rankKind = 'normal'; loadRank(); });
tabOrder.addEventListener('click', function () { rankKind = 'order'; loadRank(); });
document.getElementById('closeRank').addEventListener('click', function () {
  rankModal.hidden = true;
});
document.getElementById('sendBtn').addEventListener('click', doSubmit);
nameInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); nameInput.blur(); doSubmit(); }
});
document.getElementById('openRank').addEventListener('click', function () { openRankModal('day'); });
document.getElementById('openRank2').addEventListener('click', function () { openRankModal('day'); });

/* ============================================================
   19. 起動
   ============================================================ */
initRanking();
buildSprites();
buildBarrel();
resize();
// 明朝が遅れて読み込まれた場合、文字を含む絵（寿）を焼き直す
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () {
    buildSprites();
    buildBarrel();
  })['catch'](function () {});
}
setTimeout(resize, 60);
setTimeout(resize, 400);
next = rollItem();
drawNextPreview();
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
