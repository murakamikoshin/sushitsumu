<style>
/* ============================================================
   すし積む  -  iOS(Safari / WKWebView) 最適化 落ち物合体パズル
   意匠：藍の壁に白木のすし桶。差し色は朱と金のみ。
   ============================================================ */

:root{
  --sumi:  #0a121a;   /* 墨紺 */
  --washi: #faf6ec;   /* 和紙 */
  --kiji:  #e6cda6;   /* 白木 */
  --shu:   #c8402f;   /* 朱 */
  --kin:   #c9a227;   /* 金 */
  --mincho:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP","Source Han Serif JP","MS PMincho","Songti SC","SimSun","Nanum Myeongjo","Batang",serif,"Hiragino Sans","Yu Gothic","Noto Sans JP","Noto Sans CJK JP","Meiryo",sans-serif;
  --gothic:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Noto Sans CJK JP","Meiryo",sans-serif;
}

/* ---- リセット & iOS挙動の完全封じ込め ---- */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  /* ダブルタップ拡大・スクロール・ピンチを全部殺す */
  touch-action: none;
  -ms-touch-action: none;
  /* 長押しでのテキスト選択・コールアウト(コピー/検索メニュー)を禁止 */
  -webkit-user-select: none;
  -moz-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  /* タップ時の青いハイライトを消す */
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  -webkit-user-drag: none;
}

html, body {
  width: 100%;
  height: 100%;
  height: -webkit-fill-available;   /* iOS Safari のアドレスバー対策 */
  overflow: hidden;
  /* 引っ張った時のバウンス(ラバーバンド)を禁止 */
  overscroll-behavior: none;
  -webkit-overflow-scrolling: auto;
  position: fixed;
  inset: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: var(--mincho);
  color: var(--washi);
  background-color: var(--sumi);
  /* 藍の壁。極細の織り目だけ乗せる */
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.014) 0 1px, transparent 1px 5px),
    radial-gradient(135% 105% at 50% -15%, #2d5175 0%, #18304a 40%, #0a121a 100%);
  overscroll-behavior: none;
}

/* ---- ルートレイアウト（セーフエリア対応） ---- */
#app {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  /* Notch / Dynamic Island / ホームバー を避ける */
  padding-top:    calc(env(safe-area-inset-top, 0px)    + 10px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left:   calc(env(safe-area-inset-left, 0px)   + 14px);
  padding-right:  calc(env(safe-area-inset-right, 0px)  + 14px);
}

/* ---- ヘッダー：枠を持たせず、字組みだけで見せる ---- */
.hud {
  transition: opacity .4s ease;
  flex: 0 0 auto;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 0 2px 14px;
}
.hud-r { display: flex; flex-direction: column; align-items: center; gap: 5px; }

.lbl {
  font-size: 9.5px;
  letter-spacing: .34em;
  text-indent: .34em;
  color: rgba(230,205,166,.72);
  line-height: 1;
}
.score {
  font-family: var(--gothic);
  font-weight: 300;
  font-size: 33px;
  line-height: 1.05;
  margin-top: 6px;
  color: var(--washi);
  font-variant-numeric: tabular-nums;
}
.hi { font-size: 10px; letter-spacing: .14em; color: rgba(250,246,236,.46); margin-top: 5px; }
.hi b {
  font-family: var(--gothic); font-weight: 400; font-size: 11.5px;
  letter-spacing: 0; color: rgba(250,246,236,.7);
}
.sndBtn {
  margin-top: 7px; font-family: var(--mincho); font-size: 9.5px;
  letter-spacing: .2em; text-indent: .2em; color: rgba(230,205,166,.8);
  background: transparent; border: 1px solid rgba(230,205,166,.4);
  border-radius: 2px; padding: 4px 9px; cursor: pointer;
}
.sndBtn:active { opacity: .6; }

/* NEXT は白木の丸盆に乗せる */
.tray {
  width: 52px; height: 52px; border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #fdfaf3 0%, #efe3ca 68%, #e0d0ae 100%);
  box-shadow: 0 3px 12px rgba(0,0,0,.42), inset 0 0 0 1px rgba(201,162,39,.5);
  display: flex; align-items: center; justify-content: center;
}
#nextCv { width: 42px; height: 42px; display: block; }
body.titling .hud { opacity: 0; pointer-events: none; }

/* ---- ステージ（すし桶キャンバス） ---- */
.stage {
  flex: 1 1 auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}
#game {
  display: block;
  border-radius: 2px;
  box-shadow: 0 26px 62px rgba(0,0,0,.68), 0 6px 16px rgba(0,0,0,.35);
}

/* 店の壁を画面いっぱいに延ばす下地。桶の canvas と縦の縮尺・位置を揃える。
   端に向かうほど暗く落としてあるので、脇の文字は今まで通り読める */
#backdrop { display: none; position: fixed; left: 0; z-index: 0; pointer-events: none; }
@media (min-width: 860px) and (min-height: 600px) { #backdrop { display: block; } }

/* PC でのつまみかたの案内。触れる端末には出さない */
.kbd {
  display: none; margin-top: 4px;
  font-size: 9px; letter-spacing: .12em; line-height: 2;
  color: rgba(230,205,166,.44);
}
.kbd b { color: rgba(230,205,166,.72); font-weight: 400; font-family: var(--gothic); }
@media (pointer: coarse) { .kbd { display: none !important; } }

/* 右の柱は広い画面でだけ立てる */
.deskPad { display: none; }
#sidePanel { width: 192px; align-self: stretch; }
.sideTitle {
  font-size: 9px; letter-spacing: .24em; text-indent: .24em;
  color: rgba(230,205,166,.7); line-height: 1.6; min-height: 1.6em;
}
.sideSub {
  margin-top: 14px; font-size: 8.5px; letter-spacing: .22em; text-indent: .22em;
  color: rgba(230,205,166,.55);
}
.sideList {
  list-style: none; margin-top: 5px;
  border-top: 1px dashed rgba(230,205,166,.26);
}
.sideList li {
  display: flex; align-items: baseline; gap: 7px;
  padding: 5px 1px; font-size: 11px;
  border-bottom: 1px dashed rgba(230,205,166,.14);
  color: rgba(250,246,236,.66);
}
.sideList .k {
  flex: 0 0 auto; width: 1.5em; text-align: right;
  font-family: var(--gothic); font-size: 10px; color: rgba(230,205,166,.55);
  font-variant-numeric: tabular-nums;
}
.sideList .k.g1 { color: #d9ab29; }
.sideList .k.g2 { color: #b9b9b9; }
.sideList .k.g3 { color: #c08a4e; }
.sideList .n { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sideList .s {
  flex: 0 0 auto; font-family: var(--gothic); font-size: 10.5px;
  font-variant-numeric: tabular-nums; color: rgba(250,246,236,.82);
}
.sideList li.me { color: var(--kin); }
.sideList li.me .n { font-weight: 600; }
.sideEmpty { font-size: 9.5px; color: rgba(230,205,166,.4); padding: 12px 0; line-height: 1.9; border: 0; }
/* 番付が使えない配り方では、柱は場所だけ取って何も出さない */
body:not(.has-rank) #sidePanel .sideTitle,
body:not(.has-rank) #sidePanel .sideSub,
body:not(.has-rank) #sidePanel .sideList { display: none; }

/* ---- 広い画面（PC）----
   桶は 9:16 と決まっているので、横に広い画面では必ず余りが出る。
   その余りを「空き地」に見せないために、
     ・ヘッダーを桶の左脇に立てて、縦を桶に明け渡す（そのぶん桶が大きくなる）
     ・桶と同じ幅の余白を右にも置いて、桶を画面の真ん中に据える
     ・桶のうしろに淡い明かりを置いて、卓が照らされているように見せる
   ============================================================ */
@media (min-width: 860px) and (min-height: 600px) {
  /* 桶のうしろの明かり。ここだけが照らされている卓に見せる */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(46% 68% at 50% 44%, rgba(120,168,214,.17) 0%, rgba(10,18,26,0) 72%),
      radial-gradient(120% 52% at 50% 108%, rgba(201,162,39,.07) 0%, rgba(10,18,26,0) 60%);
  }
  #app {
    /* position は fixed のまま触らない。relative にすると inset:0 が効かなくなり、
       高さが中身ぶんに潰れて桶が豆粒になる */
    z-index: 1;
    flex-direction: row; align-items: center; justify-content: center;
    gap: 30px;
  }
  /* 左右の柱は、桶の上端に頭を揃える。真ん中で浮かせるより据わりが良い */
  /* 壁を端まで延ばしたので、脇の文字が木目に乗って読みにくい。
     角の立たない暈しを敷いて、字だけを浮かせる。
     暈しは必ず箱の中で薄れきらせる。楕円が箱より大きいと縁で切られ、
     暗い板を貼ったような角が四方に立つ。
     横と縦の二枚を重ねて、四辺と四隅を残らず抜く */
  .hud, #sidePanel {
    background-image:
      linear-gradient(90deg, rgba(6,12,18,0) 0%, rgba(6,12,18,.62) 22%,
                             rgba(6,12,18,.62) 78%, rgba(6,12,18,0) 100%),
      linear-gradient(180deg, rgba(6,12,18,0) 0%, rgba(6,12,18,.62) 10%,
                              rgba(6,12,18,.62) 45%, rgba(6,12,18,0) 75%);
    padding: 18px 12px;
    text-shadow: 0 1px 3px rgba(0,0,0,.75);
  }
  .hud {
    width: 192px; max-width: none; margin: 0;
    flex-direction: column; align-items: flex-start; justify-content: flex-start;
    gap: 26px;
    align-self: stretch;
  }
  .hud-r { align-items: flex-start; }
  .deskPad { width: 168px; flex: 0 0 auto; }   /* 右にも同じ幅を置いて桶を真ん中に */
  /* 桶の幅は下の resize が入れる。伸ばすとヘッダーが端に取り残されるので伸ばさない */
  .stage { flex: 0 0 auto; height: 100%; }
  .score { font-size: 40px; }
  .tray { width: 62px; height: 62px; }
  #nextCv { width: 50px; height: 50px; }
  .kbd { display: block; font-size: 10px; }
  .deskPad { display: block; }
  /* 壁が地続きになったので、桶だけ影を落とすと板が浮いて見える。
     縁を締める細い線だけ残す */
  #game { box-shadow: 0 0 0 1px rgba(0,0,0,.28), 0 18px 60px rgba(0,0,0,.34); }
}

/* ---- 中央ポップアップ（へい大将！など） ---- */
#popLayer {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  overflow: hidden;
}
.pop {
  position: absolute;
  font-family: var(--mincho);
  font-weight: 600;
  font-size: clamp(25px, 7.2vw, 40px);
  letter-spacing: .16em;
  text-indent: .16em;
  color: #fdf8ec;
  white-space: nowrap;
  background: rgba(196,58,42,.95);
  padding: 9px 24px 11px;
  border-radius: 1px;
  box-shadow: 0 14px 38px rgba(60,10,4,.45), inset 0 0 0 1px rgba(255,232,200,.28);
  animation: popIn 1.2s cubic-bezier(.16,.9,.28,1) forwards;
}
@keyframes popIn {
  0%   { opacity: 0; transform: translateY(14px) scale(.9); }
  18%  { opacity: 1; transform: translateY(0) scale(1.02); }
  30%  { transform: scale(1); }
  70%  { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-38px); }
}

/* ---- モーダル（タイトル / 結果）：和紙の額装 ---- */
.modal {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(6,12,18,.72);
  -webkit-backdrop-filter: blur(7px);
  backdrop-filter: blur(7px);
  z-index: 20;
  padding: 18px;
  /* 背の低い窓（横持ちや、埋め込み枠が浅い時）では札がはみ出す。
     margin:auto で寄せておくと、溢れても頭が切れずに送れる */
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
}
.modal[hidden] { display: none !important; }
.card {
  position: relative;
  margin: auto;
  flex: 0 0 auto;
  width: min(86%, 318px);
  background: var(--washi);
  color: #1d1a15;
  border-radius: 2px;
  padding: 34px 26px 30px;
  text-align: center;
  box-shadow: 0 26px 70px rgba(0,0,0,.6);
}
.card::before {
  content: '';
  position: absolute; inset: 8px;
  border: 1px solid rgba(185,148,95,.5);
  pointer-events: none;
}
.card h1 { font-size: 40px; font-weight: 600; letter-spacing: .24em; text-indent: .24em; }
.card h2 { font-size: 19px; font-weight: 500; letter-spacing: .4em; text-indent: .4em; color: #6d6154; }
.rule { width: 40px; height: 1px; background: var(--shu); margin: 16px auto 14px; }
.sub  { font-size: 10px; letter-spacing: .44em; text-indent: .44em; color: #9a8a72; }

.rankName { font-size: 27px; font-weight: 600; letter-spacing: .12em; text-indent: .12em; margin-top: 4px; }
.rankNote { font-size: 11.5px; letter-spacing: .06em; color: #9a8a72; margin-top: 8px; }

.scoreRow { display: flex; justify-content: center; gap: 42px; margin: 22px 0 4px; }
.scoreRow div { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.scoreRow .k { font-size: 9px; letter-spacing: .3em; text-indent: .3em; color: #9a8a72; }
.scoreRow .v {
  font-family: var(--gothic); font-weight: 300; font-size: 25px;
  color: #1d1a15; font-variant-numeric: tabular-nums;
}

.btn {
  display: inline-block;
  margin-top: 26px;
  font-family: var(--mincho);
  font-size: 13.5px;
  letter-spacing: .3em;
  text-indent: .3em;
  color: #fff;
  background: var(--shu);
  border: 0;
  border-radius: 2px;
  padding: 13px 26px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0,0,0,.22);
  transition: opacity .14s ease;
}
.btn:active { opacity: .72; }

.hint { font-size: 11px; color: #9a8a72; margin-top: 22px; line-height: 2.05; letter-spacing: .04em; }
.err  { color: var(--shu); font-size: 12.5px; line-height: 2; }

/* ---- 遊び方の選択 ----
   初めての人は「とりあえず遊びたい」だけなので、押すものは一つに絞る。
   番付や図鑑は戻ってくる理由になるが、初回の踏み台にはならない ---- */
.playBtn {
  display: block; width: 100%; margin-top: 20px;
  font-family: var(--mincho); font-size: 19px; letter-spacing: .3em; text-indent: .3em;
  color: #fff; background: var(--shu); border: 0; border-radius: 2px;
  padding: 17px 10px; cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,.26);
  transition: opacity .14s ease;
}
.playBtn:active { opacity: .72; }
.subPlay {
  display: block; width: 100%; margin-top: 9px;
  font-family: var(--mincho); font-size: 12px; letter-spacing: .14em; text-indent: .14em;
  color: #6d6154; background: transparent;
  border: 1px solid rgba(185,148,95,.6); border-radius: 2px;
  padding: 10px 8px; cursor: pointer;
}
.subPlay:active { opacity: .6; }

/* 戻ってきた人にだけ、続きがあることを見せる */
.prog {
  display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
  margin-top: 16px; font-size: 10px; letter-spacing: .1em; color: #9a8a72;
}
.prog[hidden] { display: none; }
.prog b { font-family: var(--gothic); font-weight: 600; color: var(--shu); font-size: 12px; letter-spacing: 0; }

/* 下の細い一行。遊ぶ前には要らないものを畳んでおく */
.miniRow {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 18px;
}
.miniRow .langLink { margin-top: 0; font-size: 9.5px; padding: 5px 7px; letter-spacing: .04em; }
body.lat .miniRow .langLink { font-size: 9px; padding: 5px 6px; }

.modeRow { display: flex; flex-direction: column; gap: 9px; margin-top: 22px; }
.modeBtn {
  font-family: var(--mincho); font-size: 15px; letter-spacing: .26em; text-indent: .26em;
  color: #fff; background: var(--shu); border: 0; border-radius: 2px;
  padding: 13px 10px; cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.22);
  transition: opacity .14s ease;
}
.modeBtn.alt { background: #1f3b57; }
.modeBtn:active { opacity: .72; }
.modeBtn small {
  display: block; margin-top: 5px; font-size: 9.5px; letter-spacing: .1em;
  text-indent: .1em; opacity: .8;
}

/* ---- 番付（オンラインランキング） ---- */
/* 共有データベースが使えない配布（単体の index.html など）では丸ごと隠す */
body:not(.has-rank) .needs-rank { display: none !important; }

.btnRow { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 22px; }
.btnRow .btn { margin-top: 0; }
.btn.ghost {
  background: transparent; color: var(--shu);
  border: 1px solid rgba(200,64,47,.55); box-shadow: none;
}
.btn.small {
  font-size: 11.5px; padding: 11px 14px; letter-spacing: .16em; text-indent: .16em;
  white-space: nowrap; flex: 0 0 auto;
}

.nameRow { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
#nameInput {
  flex: 1 1 auto; min-width: 0;
  font-family: var(--mincho); font-size: 14px; color: #1d1a15;
  padding: 10px 12px; border: 1px solid rgba(185,148,95,.75); border-radius: 2px;
  background: #fffdf7;
  -webkit-user-select: text; user-select: text; touch-action: auto;
}
#nameInput::placeholder { color: #b6a68c; }
#nameInput:focus { outline: 2px solid rgba(200,64,47,.45); outline-offset: 1px; }

.rankNote { font-size: 11px; color: #9a8a72; margin-top: 10px; line-height: 1.9; letter-spacing: .04em; }
.rankNote b { font-family: var(--gothic); font-weight: 600; color: #c8402f; font-size: 12.5px; }

.rtabs { display: flex; gap: 6px; justify-content: center; margin: 4px 0 12px; }
.rtab {
  font-family: var(--mincho); font-size: 11.5px; letter-spacing: .2em; text-indent: .2em;
  padding: 7px 16px; border: 1px solid rgba(185,148,95,.7); border-radius: 2px;
  background: transparent; color: #8a7a63; cursor: pointer;
}
.rtab.is-on { background: var(--shu); border-color: var(--shu); color: #fff; }

.rlist {
  list-style: none; text-align: left;
  max-height: 44vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  touch-action: pan-y; overscroll-behavior: contain;
  border-top: 1px dashed rgba(185,148,95,.6);
}
.rlist li {
  display: flex; align-items: baseline; gap: 10px; padding: 8px 4px;
  border-bottom: 1px dashed rgba(185,148,95,.32); font-size: 13px;
}
.rlist .rk {
  font-family: var(--gothic); font-weight: 600; font-size: 12px; color: #9a8a72;
  width: 2.4em; text-align: right; flex: 0 0 auto; font-variant-numeric: tabular-nums;
}
.rlist .rk.g1 { color: #b8901b; } .rlist .rk.g2 { color: #8d8d8d; } .rlist .rk.g3 { color: #a5713c; }
.rlist .rn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rlist .rs {
  font-family: var(--gothic); font-weight: 500; flex: 0 0 auto;
  font-variant-numeric: tabular-nums; color: #1d1a15;
}
.rlist li.me { background: rgba(200,64,47,.1); }
.rlist li.me .rn { font-weight: 700; }
.rEmpty { font-size: 12px; color: #9a8a72; padding: 26px 0; text-align: center; line-height: 2; }

/* ---- 横向き（ランドスケープ）警告 ---- */
/* タイトルの言語切り替え。ヘッダーは題字を出す間だけ隠れるので、
   最初の画面にも置いておかないと言葉を変えられない */
.langLink {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 16px; padding: 6px 12px;
  font-family: var(--mincho); font-size: 11px; letter-spacing: .1em;
  color: #9a8a72; background: transparent;
  border: 1px solid rgba(185,148,95,.55); border-radius: 2px; cursor: pointer;
  max-width: 100%;
}
.langLink:active { opacity: .6; }
/* 差し色は朱と金だけの意匠なので、地球の青は落として墨に寄せる */
.langLink span[aria-hidden] { filter: grayscale(1); opacity: .5; font-size: 12px; }
.langLink #langBtn2Name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 中断の釦は遊んでいる間だけ出す */
#pauseBtn { display: none; }
body.playing #pauseBtn { display: inline-block; }

/* ---- 寿司図鑑 ---- */
.btnRow.tight { margin-top: 18px; gap: 8px; }
.dexCount {
  font-size: 10px; letter-spacing: .18em; text-indent: .18em;
  color: #9a8a72; margin-bottom: 12px;
}
.dexCount b { font-family: var(--gothic); font-weight: 600; color: var(--shu); font-size: 13px; letter-spacing: 0; }
.dexGrid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
  max-height: 46vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  touch-action: pan-y; overscroll-behavior: contain;
  margin-bottom: 18px;
}
.dexCell {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 7px 3px 6px;
  background: rgba(185,148,95,.07);
  border: 1px solid rgba(185,148,95,.3); border-radius: 2px;
}
.dexCell.got { background: rgba(200,64,47,.06); border-color: rgba(185,148,95,.6); }
.dexCell canvas { display: block; width: 56px; height: 40px; }
.dexName {
  font-size: 8.5px; line-height: 1.35; text-align: center;
  color: #8a7a63; letter-spacing: .02em;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.dexCell.got .dexName { color: #4a3212; }

/* ---- 言葉えらび ---- */
.langGrid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
  margin: 4px 0 18px;
}
.langGrid button {
  font-family: var(--mincho); font-size: 12px; letter-spacing: .06em;
  padding: 9px 6px; border: 1px solid rgba(185,148,95,.7); border-radius: 2px;
  background: transparent; color: #6d6154; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.langGrid button.is-on { background: var(--shu); border-color: var(--shu); color: #fff; }

/* ---- 欧文のとき ----
   和文は字間を大きく開けると格好がつくが、同じ値を欧文に当てると
   ただ間の抜けた字並びになる。英語の時だけ詰め直す。 */
/* 題名は日本語のときだけ和字。それ以外は SUSHI TSUMU なので詰める */
body:not(.lang-ja) .card h1 { font-size: 26px; letter-spacing: .1em; text-indent: .1em; white-space: nowrap; }

/* 欧文（ラテン文字・キリル文字）は和文の字間だとただ間が抜ける */
body.lat .card h2 { letter-spacing: .16em; text-indent: .16em; font-size: 16px; }
body.lat .sub    { letter-spacing: .18em; text-indent: .18em; font-size: 8.5px; }
body.lat .lbl    { letter-spacing: .18em; text-indent: .18em; }
body.lat .scoreRow .k { letter-spacing: .14em; text-indent: .14em; }
body.lat .btn, body.lat .modeBtn, body.lat .rtab,
body.lat .sndBtn { letter-spacing: .1em; text-indent: .1em; }
body.lat .modeBtn { font-size: 13.5px; }
body.lat .modeBtn small { letter-spacing: .03em; text-indent: .03em; font-size: 9px; }
body.lat .btn.small { letter-spacing: .06em; text-indent: .06em; font-size: 11px; }
body.lat .rtab { font-size: 10.5px; padding: 7px 10px; }
body.lat .rankName { letter-spacing: .03em; text-indent: .03em; font-size: 23px; }
body.lat .hint { line-height: 1.8; font-size: 10.5px; }
body.lat #rotate p { letter-spacing: .12em; text-indent: .12em; font-size: 13px; }
body.lat .pop { letter-spacing: .04em; text-indent: .04em; font-size: clamp(21px, 6vw, 34px); }
body.lat .sndBtn { font-size: 9px; padding: 4px 7px; }
body.lat .rankNote { font-size: 10.5px; }

/* 広告の幕。広告そのものは SDK が上に被せるので、裏を隠すだけの役 */
#adCurtain {
  position: fixed; inset: 0; z-index: 60;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; background: var(--sumi); color: var(--washi);
  font-family: var(--mincho);
}
#adCurtain[hidden] { display: none; }
#adCurtain .noren {
  font-size: 22px; letter-spacing: .5em; text-indent: .5em;
  padding: 10px 24px; border: 1px solid rgba(250, 246, 236, .28); border-radius: 2px;
  color: var(--kin);
}
#adCurtain p { font-size: 12px; letter-spacing: .22em; opacity: .6; }

#rotate { display: none; }
@media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) {
  #rotate {
    position: fixed; inset: 0; z-index: 60;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(8,16,24,.96);
    color: var(--washi); text-align: center;
    padding: calc(env(safe-area-inset-top, 0px) + 10px)
             calc(env(safe-area-inset-right, 0px) + 10px)
             calc(env(safe-area-inset-bottom, 0px) + 10px)
             calc(env(safe-area-inset-left, 0px) + 10px);
  }
  #rotate .ico { font-size: 34px; opacity: .85; animation: tilt 1.8s ease-in-out infinite; }
  #rotate p { font-size: 14px; letter-spacing: .3em; text-indent: .3em; line-height: 2.2; }
}
@keyframes tilt {
  0%, 100% { transform: rotate(-10deg); }
  50%      { transform: rotate(10deg); }
}
/* 絵文字は端末によって出ないことがあるので、図形で描く */
.langLink .gl { width: 11px; height: 11px; vertical-align: -1px; margin-right: 2px;
  fill: none; stroke: currentColor; stroke-width: 1.3; }
#rotate .ico svg { width: 34px; height: 56px; fill: none;
  stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
</style>
</head>
<body>

<!-- 広い画面で、店の壁を画面の端まで延ばすための下地。狭い画面では出ない -->
<canvas id="backdrop" aria-hidden="true"></canvas>

<div id="app">
  <header class="hud">
    <div class="hud-l">
      <div class="lbl" data-t="lblScore">&#x30b9;&#x30b3;&#x30a2;</div>
      <div class="score" id="scoreEl">0</div>
      <div class="hi"><span data-t="lblHi">&#x30cf;&#x30a4;&#x30b9;&#x30b3;&#x30a2;</span> <b id="hiEl">0</b></div>
      <button class="sndBtn" id="sndBtn" type="button">&#x97f3; &#x5165;</button>
      <button class="sndBtn" id="langBtn" type="button" aria-label="Language">EN</button>
      <button class="sndBtn" id="pauseBtn" type="button" data-t="pause">&#x4e2d; &#x65ad;</button>
    </div>
    <div class="hud-r">
      <div class="lbl" data-t="lblNext">&#x3064;&#x304e;</div>
      <div class="tray"><canvas id="nextCv" width="132" height="132"></canvas></div>
      <div class="kbd" id="kbdHint"></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="game"></canvas>
    <div id="popLayer"></div>

    <!-- 桶を画面の真ん中に据えるための、左のヘッダーと同じ幅の余白 -->
    <!-- （中身は無い。広い画面でだけ効く） -->
    <!-- タイトル -->
    <div class="modal" id="titleModal">
      <div class="card">
        <h1 data-t="title">&#x3059;&#x3057;&#x7a4d;&#x3080;</h1>
        <div class="rule"></div>
        <div class="sub" data-t="sub">&#x6c5f;&#x6238;&#x524d;&#x5408;&#x4f53;&#x904a;&#x622f;</div>
        <div class="prog" id="titleProg" hidden></div>

        <button class="playBtn" id="startBtn" data-t="play">&#x904a; &#x3076;</button>
        <button class="subPlay" id="startOrderBtn" data-t="tryOrders">&#x300c;&#x304a;&#x54c1;&#x66f8;&#x304d;&#x300d;&#x3067;&#x904a;&#x3076;</button>

        <p class="hint">
          <span data-t="hint1">&#x6307;&#x3067;&#x306a;&#x305e;&#x3063;&#x3066;&#x4f4d;&#x7f6e;&#x3092;&#x6c7a;&#x3081;&#x3001;&#x96e2;&#x305b;&#x3070;&#x843d;&#x3061;&#x308b;&#x3002;</span><br>
          <span data-t="hint2">&#x540c;&#x3058;&#x30cd;&#x30bf;&#x304c;&#x89e6;&#x308c;&#x5408;&#x3048;&#x3070;&#x5408;&#x4f53;&#x3002;</span><br>
          <span data-t="hint3">&#x300c;&#x30ac;&#x30ea;&#x300d;&#x306f;&#x89e6;&#x308c;&#x305f;&#x30cd;&#x30bf;&#x3092;&#x4e00;&#x3064;&#x6d88;&#x3059;&#x3002;</span>
          <span id="hintKeys" hidden></span>
        </p>

        <div class="miniRow">
          <button class="langLink needs-rank" id="openRank" data-t="rankShort">&#x756a; &#x4ed8;</button>
          <button class="langLink" id="openDex" data-t="dexOpen">&#x5bff; &#x53f8; &#x56f3; &#x9451;</button>
          <button class="langLink" id="langBtn2" type="button" aria-label="Language">
            <svg class="gl" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6.4"/><ellipse cx="8" cy="8" rx="2.7" ry="6.4"/><path d="M1.9 5.8h12.2M1.9 10.2h12.2"/></svg> <span id="langBtn2Name">&#x65e5;&#x672c;&#x8a9e;</span>
          </button>
          <button class="langLink" id="openPrivacy" type="button" data-t="privacy">&#x3042;&#x3064;&#x304b;&#x3044;</button>
        </div>
      </div>
    </div>

    <!-- 結果 -->
    <div class="modal" id="overModal" hidden>
      <div class="card">
        <h2 data-t="over">&#x3057;&#x307e;&#x3044;</h2>
        <div class="rule"></div>
        <div class="rankName" id="rankName">&#x898b;&#x7fd2;&#x3044;&#x8077;&#x4eba;</div>
        <div class="rankNote" id="rankNote"></div>
        <div class="scoreRow">
          <div><span class="k" data-t="lblScore">&#x30b9;&#x30b3;&#x30a2;</span><span class="v" id="finalScore">0</span></div>
          <div><span class="k" data-t="lblHi">&#x30cf;&#x30a4;&#x30b9;&#x30b3;&#x30a2;</span><span class="v" id="finalHi">0</span></div>
        </div>
        <div class="nameRow needs-rank">
          <input id="nameInput" type="text" maxlength="12" data-tp="namePh" placeholder="&#x540d;&#x524d;&#xff08;12&#x6587;&#x5b57;&#x307e;&#x3067;&#xff09;"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <button class="btn small" id="sendBtn" data-t="send">&#x8f09; &#x305b; &#x308b;</button>
        </div>
        <div class="rankNote needs-rank" id="sendNote"></div>

        <div class="btnRow tight">
          <button class="btn ghost small needs-rank" id="openRank2" data-t="rankShort">&#x756a; &#x4ed8;</button>
          <button class="btn ghost small" id="toTitleBtn" data-t="toTitle">&#x30bf;&#x30a4;&#x30c8;&#x30eb;&#x3078;</button>
        </div>
        <button class="btn" id="retryBtn" data-t="retry">&#x3082;&#x3046;&#x4e00;&#x4e01;</button>
      </div>
    </div>

    <!-- 預かるものの説明。番付に名前を送る以上、黙っているわけにいかない -->
    <div class="modal" id="privacyModal" hidden>
      <div class="card">
        <h2 data-t="privacyTitle">&#x3042;&#x3064;&#x304b;&#x3044;</h2>
        <div class="rule"></div>
        <p class="hint">
          <span data-t="priv1"></span><br><br>
          <span data-t="priv2"></span><br><br>
          <span data-t="priv3"></span>
        </p>
        <button class="btn" id="closePrivacy" data-t="close">&#x9589; &#x3058; &#x308b;</button>
      </div>
    </div>

    <!-- 中断 -->
    <div class="modal" id="pauseModal" hidden>
      <div class="card">
        <h2 data-t="pauseTitle">&#x4e00;&#x6642;&#x505c;&#x6b62;</h2>
        <div class="rule"></div>
        <p class="hint" data-t="pauseNote">&#x3084;&#x3081;&#x3066;&#x3082;&#x3001;&#x904a;&#x3093;&#x3060;&#x56de;&#x6570;&#x306b;&#x306f;&#x6570;&#x3048;&#x307e;&#x3059;&#x3002;</p>
        <button class="btn" id="resumeBtn" data-t="resume">&#x3064; &#x3065; &#x3051; &#x308b;</button>
        <div class="btnRow tight">
          <button class="btn ghost small" id="quitBtn" data-t="quit">&#x3084;&#x3081;&#x3066;&#x30bf;&#x30a4;&#x30c8;&#x30eb;&#x3078;</button>
        </div>
      </div>
    </div>

    <!-- 寿司図鑑 -->
    <div class="modal" id="dexModal" hidden>
      <div class="card">
        <h2 data-t="dexTitle">&#x5bff;&#x53f8;&#x56f3;&#x9451;</h2>
        <div class="rule"></div>
        <div class="dexCount" id="dexCount"></div>
        <div class="dexGrid" id="dexGrid"></div>
        <button class="btn" id="closeDex" data-t="close">&#x9589; &#x3058; &#x308b;</button>
      </div>
    </div>

    <!-- 言葉えらび -->
    <div class="modal" id="langModal" hidden>
      <div class="card">
        <h2 data-t="langTitle">&#x8a00;&#x8449;</h2>
        <div class="rule"></div>
        <div class="langGrid" id="langGrid"></div>
        <button class="btn" id="closeLang" data-t="close">&#x9589; &#x3058; &#x308b;</button>
      </div>
    </div>

    <!-- 番付（オンラインランキング） -->
    <div class="modal" id="rankModal" hidden>
      <div class="card">
        <h2 data-t="rankTitle">&#x756a;&#x4ed8;</h2>
        <div class="rule"></div>
        <div class="rtabs">
          <button class="rtab is-on" id="tabDay" data-t="tabDay">&#x672c; &#x65e5;</button>
          <button class="rtab" id="tabAll" data-t="tabAll">&#x7dcf; &#x5408;</button>
        </div>
        <div class="rtabs">
          <button class="rtab is-on" id="tabNormal" data-t="tabNormal">&#x304a; &#x4efb; &#x305b;</button>
          <button class="rtab" id="tabOrder" data-t="tabOrder">&#x304a; &#x54c1; &#x66f8; &#x304d;</button>
        </div>
        <ol class="rlist" id="rlist"></ol>
        <div class="rankNote" id="rankScope"></div>
        <button class="btn" id="closeRank" data-t="close">&#x9589; &#x3058; &#x308b;</button>
      </div>
    </div>

    <!-- ライブラリ読み込み失敗時 -->
    <div class="modal" id="libModal" hidden>
      <div class="card">
        <h2 data-t="libTitle">&#x6e96;&#x5099;&#x4e2d;</h2>
        <div class="rule"></div>
        <p class="err" id="libBody">
          &#x7269;&#x7406;&#x30a8;&#x30f3;&#x30b8;&#x30f3;&#x3092;&#x521d;&#x671f;&#x5316;&#x3067;&#x304d;&#x307e;&#x305b;&#x3093;&#x3067;&#x3057;&#x305f;&#x3002;<br>
          &#x30da;&#x30fc;&#x30b8;&#x3092;&#x518d;&#x8aad;&#x307f;&#x8fbc;&#x307f;&#x3057;&#x3066;&#x304f;&#x3060;&#x3055;&#x3044;&#x3002;
        </p>
      </div>
    </div>
  </main>

  <!-- 広い画面でだけ立つ、番付の柱。桶を真ん中に据える重しも兼ねる -->
  <aside class="deskPad" id="sidePanel">
    <div class="sideTitle" id="sideScope"></div>
    <div class="sideSub" id="sideDayLbl"></div>
    <ol class="sideList" id="sideListDay"></ol>
    <div class="sideSub" id="sideAllLbl"></div>
    <ol class="sideList" id="sideListAll"></ol>
  </aside>

  <!-- 広告のあいだの幕。SDK が無い時は一度も出ない -->
  <div id="adCurtain" hidden>
    <div class="noren" data-t="adTitle">&#x5e83;&#x544a;</div>
    <p data-t="adBody">&#x3053;&#x306e;&#x3042;&#x3068;&#x3001;&#x3059;&#x3050;&#x306b;&#x518d;&#x958b;&#x3057;&#x307e;&#x3059;</p>
  </div>

  <!-- 横向き時のご案内 -->
  <div id="rotate">
    <div class="ico"><svg viewBox="0 0 24 40" aria-hidden="true" focusable="false"><rect x="1.6" y="1.6" width="20.8" height="36.8" rx="4.2"/><path d="M9.4 5.2h5.2"/></svg></div>
    <p id="rotateMsg">&#x753b;&#x9762;&#x3092;&#x7e26;&#x306b;&#x3057;&#x3066;<br>&#x304a;&#x697d;&#x3057;&#x307f;&#x304f;&#x3060;&#x3055;&#x3044;</p>
  </div>
</div>

(function () {
'use strict';

/* ============================================================
   0. iOS の余計な挙動を JS 側でも殺す
   ============================================================ */
// スクロール／ラバーバンド禁止
document.addEventListener('touchmove', function (e) {
  // 番付の一覧だけは指で送れるようにする
  var t = e.target;
  while (t && t !== document) {
    if (t.classList && t.classList.contains('rlist')) return;
    t = t.parentNode;
  }
  if (e.cancelable) e.preventDefault();
}, { passive: false });
// ピンチズーム(Safari独自イベント)禁止
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
  document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
});
// ダブルタップズーム禁止（300ms判定つき）
var lastTouchEnd = 0;
document.addEventListener('touchend', function (e) {
  var now = Date.now();
  if (now - lastTouchEnd <= 350) { if (e.cancelable) e.preventDefault(); }
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
// 長押しメニュー禁止
document.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });

function makeSushi(level, x, y) {

  var d = SUSHI[level];

    label: 'sushi',
    density: 0.0011,

    frictionStatic: d.nori ? 1.1 : (d.bar ? 1.2 : 0.6),

    slop: 0.02

  if (d.shape === 'circle') {
    b = Bodies.circle(x, y, d.r, opt, d.r > 60 ? 34 : 22);
  } else if (d.shape === 'ellipse') {
    b = Bodies.polygon(x, y, 16, d.w / 2, opt);

                       : makeSushi(current.level, previewX, previewY);
  Body.setVelocity(b, { x: 0, y: 1.2 });
  Composite.add(world, b);

  current = null;

Events.on(engine, 'collisionStart', function (ev) {
  if (state === 'over') return;
  for (var i = 0; i < ev.pairs.length; i++) {
    var a = ev.pairs[i].bodyA, b = ev.pairs[i].bodyB;

    /* --- ガリ：触れたネタをレベル問わず1つ消す --- */
    var g = a.gari ? a : (b.gari ? b : null);
    if (g) {
      var target = (g === a) ? b : a;
      if (!g.gari.used && target.sushi && !target.sushi.merged) {
        g.gari.used = true;
        target.sushi.merged = true;
        pendingOps.push({ type: 'gari', gari: g, target: target });
      }
      continue;
    }

    /* --- 合体：同レベル同士 --- */
    if (!a.sushi || !b.sushi) continue;
    if (a.sushi.merged || b.sushi.merged) continue;
    if (a.sushi.level !== b.sushi.level) continue;
    a.sushi.merged = true;
    b.sushi.merged = true;
    pendingOps.push({ type: 'merge', a: a, b: b, level: a.sushi.level });

      Composite.remove(world, op.b);

      var nb = makeSushi(op.level + 1, mx, my);
      nb.sushi.chain = chain;
      nb.sushi.mergedAt = performance.now();
      Composite.add(world, nb);
      Body.setVelocity(nb, { x: 0, y: -1.6 });

      var gain = Math.round(MERGE_SCORE[op.level] * chainMult(chain));
      recAdd('m', op.level, chain);
      addScore(gain);
      orderMade(op.level + 1);
      var fy = my - SUSHI[op.level + 1].hh - 6;
      if (chain >= 2) {
        if (chain > chainBest) chainBest = chain;
        addFloat(mx, fy, chain + t('chainFloat') + '+' + fmt(gain), chain >= 3 ? '#c8402f' : '#c2690f');
      } else {
        addFloat(mx, fy, '+' + fmt(gain),
                 op.level + 1 >= 7 ? '#c8402f' : 'rgba(58,40,16,.95)');
      }
      var col = SUSHI[op.level + 1].col;
      burst(mx, my, [col, '#ffffff', '#fff2c8'],
            (14 + op.level * 3) * (chain >= 2 ? 2 : 1), (3 + op.level * 0.5) * (chain >= 2 ? 1.5 : 1));
      seMerge(op.level + 1, chain);
      // 3連鎖は1ゲームに20回以上出て有り難みが無かったので、
      // 画面中央に出すのは4連鎖から。2〜3連鎖は浮き文字と音だけ
      if (chain >= 4) showPop(chainLabel(chain), 1);
      if (chain >= 5) burst(mx, my, ['#c9a227', '#c8402f', '#fffaf0'], 40, 6);

      if (op.level + 1 >= 7) {   // 出来上がりがレベル8(大トロ)以上
        var sh = t('shouts');
        showPop(sh[Math.floor(Math.random() * sh.length)], 1);
        if (op.level + 1 >= 9) seHuge(); else seBig();
      }
    }
  }
}

function addScore(v) {
  score += v;
  scoreEl.textContent = fmt(score);
  if (score > hiScore) {
    // 記録そのものはその場で更新して控える（途中で閉じても残るように）。
    // ただし画面の数字は動かさない。動かすと「追いかけている記録」が
    // 消えて、スコアと同じ数字が並ぶだけになってしまう
    hiScore = score;
    saveHi(hiScore);
  }
  if (state === 'over' || state === 'title') return;

  // 段が上がったら祝う。中堅職人から上だけ
  var ri = rankIndex(score);
  if (ri > rankShown) {
    rankShown = ri;
    if (ri >= 3) {
      showPop(rankName(ri) + (lang === 'ja' ? '\uff01' : '!'), 1);
      seFanfare(ri >= 5);
      burst(W / 2, BARREL_TOP + 70, ['#c9a227', '#c8402f', '#fffaf0'], 46, 6.5);
    }
  }
  // 自己記録を抜いた瞬間
  if (!hiBeaten && startHi > 0 && score > startHi) {
    hiBeaten = true;
    showPop(t('newBest'), 1);
    seFanfare(false);
  }
}

/* ============================================================
   9. パーティクル
   ============================================================ */
function burst(x, y, colors, n, spd) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var s = (0.4 + Math.random() * 0.9) * (spd || 3);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 1.2,
      life: 1, decay: 0.016 + Math.random() * 0.02,
      r: 2 + Math.random() * 4,
      c: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 0.4,
      sq: Math.random() < 0.45
    });
  }
  if (particles.length > 500) particles.splice(0, particles.length - 500);
}
function stepParticles() {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.22; p.vx *= 0.985;
    p.rot += p.vr;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ---- 加算点の浮き文字 ---- */
var floats = [];
function addFloat(x, y, text, color) {
  /* 連鎖の途中は字が続けて出る。近いものがあれば上へ逃がして重ねない */
  for (var pass = 0; pass < 8; pass++) {
    var hit = false;
    for (var i = 0; i < floats.length; i++) {
      var g = floats[i];
      if (Math.abs(g.x - x) < 58 && Math.abs(g.y - y) < 15) { y = g.y - 15; hit = true; }
    }
    if (!hit) break;
  }
  if (y < 14) y = 14;
  floats.push({ x: x, y: y, t: text, c: color, life: 1 });
  if (floats.length > 24) floats.shift();
}
function stepFloats() {
  for (var i = floats.length - 1; i >= 0; i--) {
    var f = floats[i];
    f.y -= 0.62;
    f.life -= 0.017;
    if (f.life <= 0) floats.splice(i, 1);
  }
}

/* ============================================================
   10. ポップアップ（DOM）
   ============================================================ */
var popLayer = document.getElementById('popLayer');
function showPop(text, scale) {
  var stale = popLayer.firstChild;
  while (stale) { popLayer.removeChild(stale); stale = popLayer.firstChild; }
  var el = document.createElement('div');
  el.className = 'pop';
  el.textContent = text;
  if (scale && scale !== 1) el.style.fontSize = (scale * 100) + '%';
  // 注文の木札を覆わないよう、桶の中ほどに出す
  el.style.top = (54 + Math.random() * 10) + '%';
  popLayer.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1250);
}

/* ============================================================
   11. 音（BGM と 効果音）
   外部ライブラリは使わない。単体配布でも通信なしで鳴らしたいので、
   WebAudio で和楽器を合成する。
   音階は陽旋法（レ・ミ・ソ・ラ・シ）。和の響きが崩れない。
   ============================================================ */
var actx = null, master = null, musBus = null, sfxBus = null, noiseBuf = null;
var soundOn = true;
var bgm = { on: false, step: 0, next: 0, timer: null, level: 0 };

var YO = [0, 2, 5, 7, 9];          // 陽旋法（Dを主音とする）
var BPM = 100, SP8 = 30 / BPM;     // 八分音符の秒数

function nf(semi) { return 293.665 * Math.pow(2, semi / 12); }   // D4 基準

function initAudio() {
  if (actx) return true;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.85;
    var comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    comp.attack.value = 0.004; comp.release.value = 0.22;
    master.connect(comp); comp.connect(actx.destination);
    musBus = actx.createGain(); musBus.gain.value = 0.0001; musBus.connect(master);
    sfxBus = actx.createGain(); sfxBus.gain.value = 0.95;   sfxBus.connect(master);
    var n = Math.floor(actx.sampleRate * 1.5);
    noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var k = 0; k < n; k++) d[k] = Math.random() * 2 - 1;
    return true;
  } catch (e) { actx = null; return false; }
}
function audioReady() { return soundOn && actx && sfxBus; }

function unlockAudio() {
  if (!initAudio()) return;
  try {
    if (actx.state === 'suspended') actx.resume();
    var b = actx.createBuffer(1, 1, 22050), s2 = actx.createBufferSource();
    s2.buffer = b; s2.connect(actx.destination); s2.start(0);
  } catch (e) {}
}

/* ---- 素の音 ---- */
function tone(bus, t, freq, dur, type, peak) {
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus);
  o.start(t); o.stop(t + dur + 0.05);
}
function noiseHit(bus, t, dur, peak, type, freq, q) {
  var s2 = actx.createBufferSource(); s2.buffer = noiseBuf; s2.loop = true;
  var f = actx.createBiquadFilter();
  f.type = type || 'bandpass';
  f.frequency.setValueAtTime(freq, t);
  if (q) f.Q.setValueAtTime(q, t);
  var g = actx.createGain();
  g.gain.setValueAtTime(Math.max(0.0002, peak), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s2.connect(f); f.connect(g); g.connect(bus);
  s2.start(t); s2.stop(t + dur + 0.04);
}
/* 箏（爪弾き）：立ち上がりが鋭く、余韻が伸びる */
function koto(bus, t, freq, dur, peak) {
  var o = actx.createOscillator(), g = actx.createGain(), lp = actx.createBiquadFilter();
  o.type = 'triangle';
  o.frequency.setValueAtTime(freq * 1.015, t);
  o.frequency.exponentialRampToValueAtTime(freq, t + 0.04);
  lp.type = 'lowpass';
  lp.frequency.setValueAtTime(freq * 7, t);
  lp.frequency.exponentialRampToValueAtTime(freq * 2.2, t + dur * 0.7);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(lp); lp.connect(g); g.connect(bus);
  o.start(t); o.stop(t + dur + 0.05);
  noiseHit(bus, t, 0.028, peak * 0.45, 'bandpass', freq * 4, 7);
}
/* 太鼓：頭で高く、すぐ沈む */
function taiko(bus, t, f0, dur, peak) {
  var o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(f0 * 2.4, t);
  o.frequency.exponentialRampToValueAtTime(f0, t + 0.07);
  g.gain.setValueAtTime(Math.max(0.0002, peak), t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus);
  o.start(t); o.stop(t + dur + 0.05);
  noiseHit(bus, t, 0.05, peak * 0.55, 'lowpass', 800, 1);
}
/* 拍子木 */
function clap(bus, t, peak) {
  noiseHit(bus, t, 0.04, peak, 'bandpass', 2400, 3);
  tone(bus, t, 1500, 0.045, 'square', peak * 0.28);
}
/* 鉦・鈴：倍音が非整数で金属らしくなる */
function bell(bus, t, freq, dur, peak) {
  tone(bus, t, freq, dur, 'sine', peak);
  tone(bus, t, freq * 2.76, dur * 0.7, 'sine', peak * 0.3);
  tone(bus, t, freq * 5.4, dur * 0.4, 'sine', peak * 0.14);
}

/* ---- BGM ----
   桶の埋まり具合で厚みを変える。静かに始まり、危なくなるほど太鼓が増える。 */
function bgmStep(step, t) {
  var I = bgm.level;
  var bar = Math.floor(step / 8) % 8, b = step % 8;
  var ROOT = [0, 0, 5, 7, 0, 0, 5, -3][bar];

  if (b === 0) tone(musBus, t, nf(ROOT - 24), SP8 * 1.8, 'triangle', 0.34);
  if (b === 4) tone(musBus, t, nf(ROOT - 24 + 7), SP8 * 1.4, 'triangle', 0.24);

  var seq = [0, 2, 4, 3, 1, 2, 4, 3];
  var play = I >= 2 ? true : (I === 1 ? (b % 2 === 0) : (b === 0 || b === 4));
  if (play) koto(musBus, t, nf(YO[seq[b]] + ROOT + (I >= 3 ? 12 : 0)), 0.55, 0.15);

  if (I >= 1 && (b === 0 || b === 4)) taiko(musBus, t, 82, 0.3, 0.42);
  if (I >= 2 && b === 6) taiko(musBus, t, 108, 0.2, 0.28);
  if (I >= 3 && (b === 2 || b === 7)) taiko(musBus, t, 96, 0.18, 0.26);
  if (I >= 2 && b % 2 === 1) noiseHit(musBus, t, 0.045, 0.04, 'highpass', 5200, 1);
}
function bgmTick() {
  if (!actx || !bgm.on) return;
  var guard = 0;
  while (bgm.next < actx.currentTime + 0.16 && guard++ < 40) {
    bgmStep(bgm.step++, bgm.next);
    bgm.next += SP8;
  }
}
function bgmStart() {
  if (!soundOn || !initAudio()) return;
  if (bgm.on) return;
  bgm.on = true; bgm.step = 0; bgm.next = actx.currentTime + 0.12;
  try {
    musBus.gain.cancelScheduledValues(actx.currentTime);
    musBus.gain.setValueAtTime(0.0001, actx.currentTime);
    musBus.gain.exponentialRampToValueAtTime(0.34, actx.currentTime + 1.4);
  } catch (e) {}
  if (bgm.timer) clearInterval(bgm.timer);
  bgm.timer = setInterval(bgmTick, 25);
}
function bgmStop(fade) {
  bgm.on = false;
  if (bgm.timer) { clearInterval(bgm.timer); bgm.timer = null; }
  if (!actx) return;
  try {
    musBus.gain.cancelScheduledValues(actx.currentTime);
    musBus.gain.setValueAtTime(musBus.gain.value, actx.currentTime);
    musBus.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (fade || 0.5));
  } catch (e) {}
}
function bgmIntensity(fill, danger) {
  var I = danger ? 3 : fill > 0.8 ? 3 : fill > 0.58 ? 2 : fill > 0.32 ? 1 : 0;
  if (I !== bgm.level) bgm.level = I;
}

/* ---- 効果音 ---- */
function seDrop(isGari) {
  if (!audioReady()) return;
  var t = actx.currentTime;
  if (isGari) noiseHit(sfxBus, t, 0.09, 0.18, 'highpass', 4200, 1);
  else noiseHit(sfxBus, t, 0.026, 0.22, 'bandpass', 1500, 5);
}
function seMerge(level, chain) {
  if (!audioReady()) return;
  var t = actx.currentTime;
  koto(sfxBus, t, nf(YO[level % 5] + Math.floor(level / 5) * 12), 0.45, 0.72);
  if (chain >= 2) {                      // 連鎖は駆け上がる
    var n = Math.min(chain, 6);
    for (var i = 0; i < n; i++)
      koto(sfxBus, t + 0.045 * (i + 1), nf(YO[i % 5] + 12 + Math.floor(i / 5) * 12), 0.34, 0.52);
    if (chain >= 3) taiko(sfxBus, t, 96, 0.28, 0.6);
  }
}
function seBig() {                        // 大トロ以上
  if (!audioReady()) return;
  var t = actx.currentTime;
  taiko(sfxBus, t, 70, 0.5, 0.8);
  bell(sfxBus, t + 0.02, nf(12), 0.9, 0.3);
  for (var i = 0; i < 5; i++) koto(sfxBus, t + 0.05 + i * 0.06, nf(YO[i] + 12), 0.4, 0.48);
}
function seHuge() {                       // 伊勢海老・ゴールデン誕生
  if (!audioReady()) return;
  var t = actx.currentTime;
  taiko(sfxBus, t, 58, 0.85, 0.85);
  taiko(sfxBus, t + 0.13, 68, 0.6, 0.6);
  bell(sfxBus, t + 0.04, nf(0), 1.7, 0.38);
  for (var i = 0; i < 10; i++)
    koto(sfxBus, t + 0.08 + i * 0.055, nf(YO[i % 5] + Math.floor(i / 5) * 12), 0.5, 0.5);
}
function seJackpot() {                    // ゴールデン同士。この曲で一番派手にする
  if (!audioReady()) return;
  var t = actx.currentTime;
  for (var r = 0; r < 3; r++) taiko(sfxBus, t + r * 0.13, 54 + r * 7, 0.85, 0.6);
  bell(sfxBus, t, nf(0), 2.4, 0.26);
  bell(sfxBus, t + 0.36, nf(12), 2.0, 0.2);
  for (var i = 0; i < 15; i++)
    koto(sfxBus, t + 0.14 + i * 0.055, nf(YO[i % 5] + Math.floor(i / 5) * 12), 0.55, 0.4);
  for (var k = 0; k < 14; k++)
    tone(sfxBus, t + 0.3 + Math.random(), 1800 + Math.random() * 2600, 0.22, 'sine', 0.05);
}
function seOrder(streak) {
  if (!audioReady()) return;
  var t = actx.currentTime, up = Math.min(streak, 5);
  clap(sfxBus, t, 0.55); clap(sfxBus, t + 0.085, 0.44);
  for (var i = 0; i < 3; i++)
    bell(sfxBus, t + 0.06 + i * 0.07, nf(YO[i] + 12 + (up - 1) * 2), 0.7, 0.34);
}
function seOrderStep() {
  if (!audioReady()) return;
  clap(sfxBus, actx.currentTime, 0.4);
}
function seOrderFail() {
  if (!audioReady()) return;
  var t = actx.currentTime;
  taiko(sfxBus, t, 58, 0.55, 0.42);
  tone(sfxBus, t, 175, 0.42, 'triangle', 0.13);
}
function seGari() {
  if (!audioReady()) return;
  var t = actx.currentTime;
  noiseHit(sfxBus, t, 0.16, 0.26, 'highpass', 3200, 1);
  tone(sfxBus, t, 1500, 0.12, 'sine', 0.2);
}
function seFanfare(big) {                 // 記録更新・大台
  if (!audioReady()) return;
  var t = actx.currentTime;
  var mel = big ? [0, 4, 7, 9, 12, 16, 19] : [0, 4, 7, 12];
  taiko(sfxBus, t, 62, 0.7, big ? 0.8 : 0.5);
  mel.forEach(function (m, i) {
    koto(sfxBus, t + 0.08 * i, nf(m + 12), 0.6, 0.5);
    if (big) bell(sfxBus, t + 0.08 * i, nf(m + 24), 0.8, 0.2);
  });
  if (big) for (var k = 0; k < 10; k++)
    tone(sfxBus, t + 0.4 + Math.random() * 0.8, 2000 + Math.random() * 2400, 0.2, 'sine', 0.06);
}
function seOver() {
  if (!audioReady()) return;
  var t = actx.currentTime;
  taiko(sfxBus, t, 52, 1.0, 0.7);
  [9, 7, 5, 0].forEach(function (m, i) { koto(sfxBus, t + i * 0.17, nf(m - 12), 0.9, 0.45); });
}

/* ---- 音の入切 ---- */
function applySound() {
  var btn = document.getElementById('sndBtn');
  if (btn) btn.textContent = soundOn ? t('sndOn') : t('sndOff');
  if (!soundOn) bgmStop(0.25);
  else if (state !== 'title' && state !== 'over') bgmStart();
}
function toggleSound() {
  soundOn = !soundOn;
  lsSet('sushitsumu.snd', soundOn ? '1' : '0');
  if (soundOn) unlockAudio();
  applySound();
}

/* ============================================================
   12. キャンバス & レスポンシブ
   ============================================================ */
var cv  = document.getElementById('game');
var ctx = cv.getContext('2d');
var stage = document.getElementById('stage');
var hud = document.querySelector('.hud');
var scale = 1;

/* 広い画面ではヘッダーを桶の左脇に立てる。組み方が変わるので、
   桶の大きさの決め方も変わる（下の resize を参照） */
var deskQ = window.matchMedia('(min-width: 860px) and (min-height: 600px)');
function onDeskChange() { resize(); loadSidePanel(); }
if (deskQ.addEventListener) deskQ.addEventListener('change', onDeskChange);
else if (deskQ.addListener) deskQ.addListener(onDeskChange);

var DESK_SIDE = 192, DESK_GAP = 30;   /* CSS の .hud/.deskPad の幅と gap に合わせる */

function resize() {
  var availW, availH;
  if (deskQ.matches) {
    // 横並びの時、桶の幅を測ってから決めると堂々巡りになる（桶が広がる→
    // 場所が無くなる→桶が縮む）。画面の側から先に決めてしまう
    var app = document.getElementById('app');
    var ar = app.getBoundingClientRect(), cs = getComputedStyle(app);
    availH = ar.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    availW = ar.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)
             - DESK_SIDE * 2 - DESK_GAP * 2;
  } else {
    var r = stage.getBoundingClientRect();
    availW = r.width; availH = r.height;
  }
  if (availW <= 0 || availH <= 0) return;
  var s = Math.min(availW / W, availH / H);
  var cssW = Math.floor(W * s), cssH = Math.floor(H * s);
  var dpr = Math.min(window.devicePixelRatio || 1, 2);  // iOS(x3)は重いので2で頭打ち
  cv.style.width  = cssW + 'px';
  cv.style.height = cssH + 'px';
  // 縦並びの時だけ、スコアと NEXT を桶の左右端に揃える。
  // 横並び（PC）でこれをやると、ヘッダーが桶の幅まで広がって場所を奪い、
  // 桶がさらに縮み…と際限なく小さくなる。あちらは CSS の幅に任せる
  hud.style.width = deskQ.matches ? '' : cssW + 'px';
  // 横並びでは桶の幅をそのまま入れて、ヘッダーが桶の脇に寄るようにする
  stage.style.width = deskQ.matches ? cssW + 'px' : '';
  if (deskQ.matches) {
    // 桶と縦位置を揃えて、店の壁を画面の端まで延ばす
    var cr = cv.getBoundingClientRect();
    buildBackdrop(cssH, cr.top);
  }
  cv.width  = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  scale = (cssW * dpr) / W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* ============================================================
   13. 入力（PointerEvent / TouchEvent フォールバック）
   ============================================================ */
function toWorld(clientX, clientY) {
  var r = cv.getBoundingClientRect();
  return {
    x: (clientX - r.left) / r.width * W,
    y: (clientY - r.top) / r.height * H
  };
}
function onDown(clientX, clientY) {
  unlockAudio();
  if (state === 'title' || state === 'over' || state === 'paused') return;
  // 落下クールダウン中に触れても取りこぼさない
  pointerDown = true;
  onMove(clientX, clientY);
}
function onMove(clientX, clientY) {
  if (!pointerDown) return;
  lastPtr = toWorld(clientX, clientY);
  if (!current) return;                 // 次のネタ待ち。位置だけ覚えておく
  previewX = lastPtr.x;
  // 指の真上に出して、ネタが指で隠れないようにする
  previewY = Math.max(172, Math.min(DROP_Y, lastPtr.y - FINGER_OFFSET_Y));
  clampPreview();
}
function onUp() {
  if (!pointerDown) return;
  pointerDown = false;
  dropCurrent();
  previewY = DROP_Y;
}

/* ---- 鍵盤（PC）----
   PC では引きずるより、左右で狙って落とす方が速い。
   触れる端末には案内も出さないし、何も変わらない。 */
var keyDir = 0, keyRepeat = 0;
var KEY_SPEED = 190;          // 1秒あたりに動く幅（論理座標）
function keyMove(dt) {
  if (!keyDir || !current || state !== 'ready') return;
  previewX += keyDir * KEY_SPEED * dt;
  previewY = DROP_Y;
  clampPreview();
}
window.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  var k = e.key;
  // 名前を打っている最中は横取りしない
  var ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  if (e.target && e.target.tagName === 'INPUT') return;

  if (state === 'title') {
    if (k === 'Enter' || k === ' ') { e.preventDefault(); beginGame('normal'); }
    return;
  }
  if (state === 'over') {
    if (k === 'Enter' || k === ' ') { e.preventDefault(); document.getElementById('retryBtn').click(); }
    return;
  }
  if (state === 'paused') {
    if (k === 'Enter' || k === ' ' || k === 'Escape' || k === 'p' || k === 'P') {
      e.preventDefault(); resumeGame();
    }
    return;
  }
  if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); pauseGame(); return; }
  if (k === 'ArrowLeft'  || k === 'a' || k === 'A') { keyDir = -1; e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keyDir = 1; e.preventDefault(); }
  else if (k === ' ' || k === 'ArrowDown' || k === 'Enter' || k === 's' || k === 'S') {
    e.preventDefault();
    unlockAudio();
    if (state === 'ready' && current && !dropLock) { previewY = DROP_Y; dropCurrent(); }
  }
}, { passive: false });
window.addEventListener('keyup', function (e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A' || k === 'ArrowRight' || k === 'd' || k === 'D') keyDir = 0;
});
window.addEventListener('blur', function () { keyDir = 0; });

if (window.PointerEvent) {
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    onDown(e.clientX, e.clientY);
  }, { passive: false });
  cv.addEventListener('pointermove', function (e) {
    e.preventDefault();
    onMove(e.clientX, e.clientY);
  }, { passive: false });
  cv.addEventListener('pointerup',     function (e) { e.preventDefault(); onUp(); }, { passive: false });
  cv.addEventListener('pointercancel', function ()  { pointerDown = false; previewY = DROP_Y; }, { passive: false });
} else {
  cv.addEventListener('touchstart', function (e) {
    e.preventDefault(); onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  cv.addEventListener('touchmove', function (e) {
    e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  cv.addEventListener('touchend', function (e) { e.preventDefault(); onUp(); }, { passive: false });
  cv.addEventListener('mousedown', function (e) { onDown(e.clientX, e.clientY); });
  window.addEventListener('mousemove', function (e) { onMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', onUp);
}

/* ============================================================
   14. 描画ユーティリティ
   ============================================================ */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);       c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);   c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);       c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);           c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}
/* 軍艦の海苔の外形。
   上の角は丸めるのではなく斜めに削ぎ落とす。角丸だと角が残って見える。
   削ぎの繋ぎ目だけわずかに均して、折り紙のように尖らせない。 */
function noriPath(c, w, h, bottom, cutX, cutY, rBot, soft) {
  var L = -w / 2, R = w / 2, T = -h / 2, B = bottom;
  c.beginPath();
  c.moveTo(0, T);
  c.arcTo(R - cutX, T, R, T + cutY, soft);
  c.arcTo(R, T + cutY, R, B, soft);
  c.arcTo(R, B, L, B, rBot);
  c.arcTo(L, B, L, T + cutY, rBot);
  c.arcTo(L, T + cutY, L + cutX, T, soft);
  c.arcTo(L + cutX, T, 0, T, soft);
  c.closePath();
}

/* 角ごとに半径を変えられる角丸矩形 */
function rr4(c, x, y, w, h, rtl, rtr, rbr, rbl) {
  var m = Math.min(w, h) / 2;
  rtl = Math.min(rtl, m); rtr = Math.min(rtr, m);
  rbr = Math.min(rbr, m); rbl = Math.min(rbl, m);
  c.beginPath();
  c.moveTo(x + rtl, y);
  c.lineTo(x + w - rtr, y);        c.quadraticCurveTo(x + w, y, x + w, y + rtr);
  c.lineTo(x + w, y + h - rbr);    c.quadraticCurveTo(x + w, y + h, x + w - rbr, y + h);
  c.lineTo(x + rbl, y + h);        c.quadraticCurveTo(x, y + h, x, y + h - rbl);
  c.lineTo(x, y + rtl);            c.quadraticCurveTo(x, y, x + rtl, y);
  c.closePath();
}

function lg(c, x0, y0, x1, y1, stops) {
  var g = c.createLinearGradient(x0, y0, x1, y1);
  for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
  return g;
}

/* ---- 握りの基本パーツ ----------------------------------------
   「寿司に見える」条件は二つ。
   (1) シャリが俵形の山で、米粒が見えること
   (2) ネタがシャリより大きく、両端からはみ出して垂れること
   平たい板を白い棒に載せると消しゴムに見えるので、必ずこの形で作る。 */

/* シャリ（俵形の山） */
function riceBase(c, w, h) {
  var rw = w * 0.87, rh = h * 0.55;
  var top = h * 0.5 - rh;
  var g = c.createLinearGradient(0, top, 0, h * 0.5);
  g.addColorStop(0, '#fdfbf5');
  g.addColorStop(0.5, '#f5f1e5');
  g.addColorStop(1, '#dbd5c1');
  c.fillStyle = g;
  rr(c, -rw / 2, top, rw, rh, Math.min(rh * 0.5, rw * 0.22));
  c.fill();
  c.strokeStyle = 'rgba(156,144,113,.55)';
  c.lineWidth = 1;
  c.stroke();

  // 米粒
  var n = Math.max(4, Math.round(rw / 7.5));
  var grx = Math.min(3.1, rw * 0.055), gry = Math.min(2.0, rh * 0.13);
  for (var i = 0; i < n; i++) {
    var gx = -rw / 2 + rw * (0.14 + 0.72 * ((i + 0.5) / n)) + (Math.random() - 0.5) * 2.6;
    var gy = top + rh * (0.44 + Math.random() * 0.42);
    c.save();
    c.translate(gx, gy);
    c.rotate((Math.random() - 0.5) * 1.5);
    c.fillStyle = 'rgba(255,255,255,.96)';
    c.beginPath(); c.ellipse(0, 0, grx, gry, 0, 0, 6.2832); c.fill();
    c.strokeStyle = 'rgba(176,166,138,.55)'; c.lineWidth = 0.6; c.stroke();
    c.restore();
  }
}

/* ネタの輪郭。上は丸く盛り、下端は中央が垂れてシャリに被さる */
function netaPath(c, w, h) {
  var top = -h * 0.5, bot = h * 0.1;
  var r = Math.min(h * 0.42, w * 0.2);
  c.beginPath();
  c.moveTo(-w / 2, bot - h * 0.15);
  c.quadraticCurveTo(-w / 2, top, -w / 2 + r, top);
  c.lineTo(w / 2 - r, top);
  c.quadraticCurveTo(w / 2, top, w / 2, bot - h * 0.15);
  c.quadraticCurveTo(0, bot + h * 0.12, -w / 2, bot - h * 0.15);
  c.closePath();
}

/* 握り一貫を組み立てる */
function nigiri(c, w, h, fill, detail, edge) {
  riceBase(c, w, h);
  netaPath(c, w, h);
  c.fillStyle = fill;
  c.fill();
  if (detail) {
    c.save(); netaPath(c, w, h); c.clip(); detail(c); c.restore();
  }
  // 上面のつや
  c.save();
  netaPath(c, w, h); c.clip();
  var sg = c.createLinearGradient(0, -h * 0.5, 0, h * 0.05);
  sg.addColorStop(0, 'rgba(255,255,255,.4)');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = sg;
  c.fillRect(-w / 2, -h * 0.5, w, h * 0.6);
  c.restore();
  netaPath(c, w, h);
  c.strokeStyle = edge || 'rgba(80,40,30,.3)';
  c.lineWidth = 1.2;
  c.stroke();
}

/* 軍艦巻き
   海苔は胴に「巻いてある」ので、横から見たときの外形は海苔そのもの。
   シャリの上に黒い帯を載せる描き方だと、帯が別の物に見えて軍艦にならない。
   海苔を外形にし、その内側の窪みへ具を盛る。シャリは底から少しだけ覗かせる。 */
function gunkan(c, w, h, topping) {
  var cutX = w * 0.13;                      // 上の角の削ぎ（横）
  var cutY = h * 0.21;                      // 上の角の削ぎ（縦）
  var rBot = Math.min(h * 0.18, w * 0.10);
  var soft = Math.min(h * 0.06, w * 0.035); // 削ぎの繋ぎ目を均す量
  var nt = Math.max(3.5, w * 0.055);   // 海苔の厚み（左右に縁として見える）
  var noriBot = h * 0.43;              // 海苔の下端（巻いてあるので、シャリはほぼ隠れる）
  var rimY = -h * 0.04;                // 海苔の縁（具はここから上）
  var crest = -h * 0.52;               // 具の盛り上がりの頂点

  // シャリ（底からわずかに覗く）
  var rg = c.createLinearGradient(0, h * 0.2, 0, h / 2);
  rg.addColorStop(0, '#fdfbf5');
  rg.addColorStop(1, '#dbd5c1');
  c.fillStyle = rg;
  rr(c, -w * 0.46, h * 0.22, w * 0.92, h * 0.28, Math.min(h * 0.12, w * 0.08));
  c.fill();
  c.strokeStyle = 'rgba(156,144,113,.6)';
  c.lineWidth = 1;
  c.stroke();
  for (var i = 0; i < 4; i++) {
    c.save();
    c.translate(-w * 0.24 + i * (w * 0.16), h * 0.47);
    c.rotate((i - 1.5) * 0.35);
    c.fillStyle = 'rgba(255,255,255,.9)';
    c.beginPath(); c.ellipse(0, 0, w * 0.03, h * 0.018, 0, 0, 6.2832); c.fill();
    c.restore();
  }

  // 海苔＝胴の外形
  var ng = c.createLinearGradient(-w / 2, 0, w / 2, 0);
  ng.addColorStop(0, '#0d120e');
  ng.addColorStop(0.14, '#283326');
  ng.addColorStop(0.44, '#36432f');
  ng.addColorStop(0.82, '#1d261d');
  ng.addColorStop(1, '#0b0f0b');
  c.fillStyle = ng;
  noriPath(c, w, h, noriBot, cutX, cutY, rBot, soft);
  c.fill();

  c.save();
  noriPath(c, w, h, noriBot, cutX, cutY, rBot, soft);
  c.clip();
  // 海苔の繊維
  c.strokeStyle = 'rgba(255,255,255,.05)';
  c.lineWidth = 1.2;
  for (var v = -6; v <= 6; v++) {
    c.beginPath();
    c.moveTo(v * w * 0.075, -h / 2);
    c.lineTo(v * w * 0.075, noriBot);
    c.stroke();
  }
  // 巻き終わりの継ぎ目
  c.strokeStyle = 'rgba(255,255,255,.12)';
  c.lineWidth = 1.8;
  c.beginPath();
  c.moveTo(-w * 0.28, -h / 2);
  c.lineTo(-w * 0.28, noriBot);
  c.stroke();
  // 巻きの丸みを出すつや
  var sh = c.createLinearGradient(-w / 2, 0, w / 2, 0);
  sh.addColorStop(0, 'rgba(255,255,255,0)');
  sh.addColorStop(0.3, 'rgba(255,255,255,.10)');
  sh.addColorStop(0.55, 'rgba(255,255,255,.03)');
  sh.addColorStop(1, 'rgba(0,0,0,.25)');
  c.fillStyle = sh;
  c.fillRect(-w / 2, -h / 2, w, noriBot + h / 2);
  c.restore();

  // 具（海苔の縁から上へ浅く盛り上がる。深い窓にすると画面に見えてしまう）
  c.save();
  var tx0 = -w / 2 + nt, tx1 = w / 2 - nt;
  c.beginPath();
  c.moveTo(tx0, rimY);
  c.bezierCurveTo(tx0 + w * 0.045, rimY - h * 0.22,
                  -w * 0.35, crest,
                  -w * 0.25, crest);
  c.lineTo(w * 0.25, crest);
  c.bezierCurveTo(w * 0.35, crest,
                  tx1 - w * 0.045, rimY - h * 0.22,
                  tx1, rimY);
  c.closePath();
  c.clip();
  topping(c, w, h);
  c.restore();

  // 具と海苔の境
  c.strokeStyle = 'rgba(0,0,0,.45)';
  c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(-w / 2 + nt * 0.6, rimY);
  c.lineTo(w / 2 - nt * 0.6, rimY);
  c.stroke();

  // 海苔の切り口（具の左右に覗く縁）
  c.strokeStyle = 'rgba(196,186,168,.35)';
  c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(-w / 2 + nt * 0.7, rimY - h * 0.02);
  c.lineTo(-w / 2 + nt * 0.7, -h * 0.17);
  c.moveTo(w / 2 - nt * 0.7, rimY - h * 0.02);
  c.lineTo(w / 2 - nt * 0.7, -h * 0.17);
  c.stroke();

  // 全体の縁
  c.strokeStyle = 'rgba(0,0,0,.55)';
  c.lineWidth = 1.4;
  noriPath(c, w, h, noriBot, cutX, cutY, rBot, soft);
  c.stroke();
}

/* ---- ネタ描画（原点中心・ローカル座標） ---- */
function drawItem(c, level) {
  var d = SUSHI[level];
  var w = d.w, h = d.h;

  switch (level) {

    /* 1. シャリ（握る前の飯玉） */
    case 0: {
      var R = d.r;
      var g = c.createRadialGradient(-R * 0.3, -R * 0.35, R * 0.1, 0, 0, R);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.6, '#f7f3e8');
      g.addColorStop(1, '#ddd7c5');
      c.fillStyle = g;
      c.beginPath(); c.arc(0, 0, R, 0, 6.2832); c.fill();
      c.strokeStyle = 'rgba(156,144,113,.6)'; c.lineWidth = 1; c.stroke();
      // 米粒をはっきり見せる
      c.save();
      c.beginPath(); c.arc(0, 0, R - 0.6, 0, 6.2832); c.clip();
      for (var i = 0; i < 11; i++) {
        var a = i * 1.13, rad = R * (0.18 + 0.62 * ((i % 4) / 3));
        c.save();
        c.translate(Math.cos(a) * rad, Math.sin(a) * rad);
        c.rotate(a * 1.7);
        c.fillStyle = 'rgba(255,255,255,.98)';
        c.beginPath(); c.ellipse(0, 0, R * 0.24, R * 0.145, 0, 0, 6.2832); c.fill();
        c.strokeStyle = 'rgba(178,168,140,.6)'; c.lineWidth = 0.7; c.stroke();
        c.restore();
      }
      c.restore();
      break;
    }

    /* 2. 玉子（海苔の帯で締める） */
    case 1: {
      nigiri(c, w, h,
        lg(c, 0, -h * 0.5, 0, h * 0.1, [[0, '#ffe081'], [0.45, '#f8c53a'], [1, '#e0a01c']]),
        function (cc) {
          cc.strokeStyle = 'rgba(255,255,255,.5)';
          cc.lineWidth = h * 0.09;
          cc.beginPath();
          cc.moveTo(-w * 0.36, -h * 0.3);
          cc.lineTo(w * 0.36, -h * 0.34);
          cc.stroke();
          cc.fillStyle = 'rgba(190,120,26,.35)';
          cc.fillRect(-w / 2, h * 0.0, w, h * 0.1);
        },
        'rgba(150,95,15,.55)');
      // 海苔の帯（ネタとシャリをまたいで巻く）
      var bw = Math.max(4.5, w * 0.17);
      var bg = c.createLinearGradient(-bw / 2, 0, bw / 2, 0);
      bg.addColorStop(0, '#171410');
      bg.addColorStop(0.45, '#372f26');
      bg.addColorStop(1, '#191612');
      c.fillStyle = bg;
      c.fillRect(-bw / 2, -h * 0.5, bw, h);
      c.fillStyle = 'rgba(255,255,255,.1)';
      c.fillRect(-bw / 2, -h * 0.5, bw * 0.22, h);
      break;
    }

    /* 3. エビ（白地に紅の縞。茹でエビの配色） */
    case 2: {
      nigiri(c, w, h,
        lg(c, 0, -h * 0.5, 0, h * 0.1, [[0, '#fff4f3'], [0.55, '#ffe4e2'], [1, '#f7cdc9']]),
        function (cc) {
          // 紅の帯を斜めに走らせる
          cc.fillStyle = '#f2603f';
          for (var k = -2; k <= 2; k++) {
            var x = k * (w * 0.2) + w * 0.02;
            cc.beginPath();
            cc.moveTo(x - w * 0.055, -h * 0.7);
            cc.lineTo(x + w * 0.055, -h * 0.7);
            cc.lineTo(x + w * 0.015, h * 0.5);
            cc.lineTo(x - w * 0.095, h * 0.5);
            cc.closePath();
            cc.fill();
          }
          // 背側の濃い筋
          cc.strokeStyle = 'rgba(198,52,32,.55)';
          cc.lineWidth = h * 0.1;
          cc.beginPath();
          cc.moveTo(-w * 0.46, -h * 0.34);
          cc.quadraticCurveTo(0, -h * 0.46, w * 0.46, -h * 0.32);
          cc.stroke();
        },
        'rgba(196,86,72,.6)');
      // 尾（右端で跳ね上げる）
      c.fillStyle = '#e8452a';
      c.beginPath();
      c.moveTo(w * 0.42, -h * 0.26);
      c.lineTo(w * 0.62, -h * 0.66);
      c.lineTo(w * 0.66, -h * 0.24);
      c.lineTo(w * 0.5, -h * 0.12);
      c.closePath(); c.fill();
      c.strokeStyle = 'rgba(150,30,18,.65)'; c.lineWidth = 0.9; c.stroke();
      break;
    }

    /* 4. サーモン（強い白い脂の筋） */
    case 3: {
      nigiri(c, w, h,
        lg(c, 0, -h * 0.5, 0, h * 0.1, [[0, '#ffb377'], [0.45, '#ff8d3f'], [1, '#ea6f22']]),
        function (cc) {
          cc.strokeStyle = 'rgba(255,252,246,.92)';
          cc.lineWidth = h * 0.105;
          cc.lineCap = 'round';
          for (var m = 0; m < 3; m++) {
            var y = -h * 0.3 + m * h * 0.21;
            cc.beginPath();
            cc.moveTo(-w * 0.48, y + h * 0.05);
            cc.bezierCurveTo(-w * 0.16, y - h * 0.1, w * 0.16, y + h * 0.08, w * 0.48, y - h * 0.03);
            cc.stroke();
          }
          cc.lineCap = 'butt';
        },
        'rgba(178,84,20,.6)');
      break;
    }

    /* 5. マグロ（深い赤身に細い筋） */
    case 4: {
      nigiri(c, w, h,
        lg(c, 0, -h * 0.5, 0, h * 0.1, [[0, '#e84550'], [0.5, '#cf2635'], [1, '#a81628']]),
        function (cc) {
          cc.strokeStyle = 'rgba(255,255,255,.2)';
          cc.lineWidth = h * 0.06;
          for (var t = 0; t < 3; t++) {
            var y = -h * 0.28 + t * h * 0.2;
            cc.beginPath();
            cc.moveTo(-w * 0.46, y);
            cc.quadraticCurveTo(0, y - h * 0.05, w * 0.46, y + h * 0.02);
            cc.stroke();
          }
        },
        'rgba(120,15,30,.65)');
      break;
    }

    /* 6. いくら軍艦 */
    case 5: {
      gunkan(c, w, h, function (cc, gw, gh) {
        cc.fillStyle = '#7e1517';
        cc.fillRect(-gw, -gh, gw * 2, gh * 2);
        var pr = gh * 0.095;
        var cols = 8, rows = 4;   // 最下段は海苔の縁で切れる
        for (var row = 0; row < rows; row++) {
          for (var col = 0; col < cols; col++) {
            var px = -gw * 0.44 + col * (gw * 0.125) + (row % 2 ? gw * 0.062 : 0);
            var py = -gh * 0.45 + row * (gh * 0.145);
            var rgd = cc.createRadialGradient(px - pr * 0.35, py - pr * 0.42, pr * 0.1, px, py, pr);

    /* 7. ウニ軍艦

function drawGari(c) {
  var R = GARI.r;
  for (var i = 0; i < 3; i++) {
    c.save();
    c.translate((i - 1) * R * 0.3, (i - 1) * R * 0.16);
    c.rotate((i - 1) * 0.5);
    var g = c.createLinearGradient(0, -R, 0, R);
    g.addColorStop(0, '#fff2f5');
    g.addColorStop(1, '#ffa8c2');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-R * 0.95, R * 0.25);
    c.quadraticCurveTo(-R * 0.5, -R * 1.25, R * 0.55, -R * 0.5);
    c.quadraticCurveTo(R * 1.1, R * 0.2, 0, R * 0.95);
    c.quadraticCurveTo(-R * 0.6, R * 0.85, -R * 0.95, R * 0.25);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(198,104,138,.7)'; c.lineWidth = 0.9; c.stroke();
    c.restore();
  }
  c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.1;
  c.beginPath();
  c.moveTo(-R * 0.45, R * 0.35);
  c.quadraticCurveTo(0, -R * 0.3, R * 0.5, -R * 0.3);
  c.stroke();
}

/* ---- ネタをスプライトに焼く ----
   毎フレーム全ネタを描き直すと重いので、起動時に一度だけ
   オフスクリーンへ描いて、あとは drawImage で回す。 */
var sprites = [];
var gariSprite = null;
var SPR_SCALE = 3;

function makeSprite(w, h, pad, drawFn) {
  var cw = w + pad * 2, ch = h + pad * 2;
  var cv = document.createElement('canvas');
  cv.width = Math.ceil(cw * SPR_SCALE);
  cv.height = Math.ceil(ch * SPR_SCALE);
  var c = cv.getContext('2d');
  c.scale(SPR_SCALE, SPR_SCALE);
  c.translate(cw / 2, ch / 2);
  drawFn(c);
  return { cv: cv, w: cw, h: ch };
}

function buildSprites() {
  for (var i = 0; i < SUSHI.length; i++) {
    (function (lv) {
      var d = SUSHI[lv];
      sprites[lv] = makeSprite(d.hw * 2, d.hh * 2, d.pad || 8,
        function (c) { drawItem(c, lv); });
    })(i);
  }
  gariSprite = makeSprite(GARI.r * 2, GARI.r * 2, 8, drawGari);
}

function spriteOf(item) {
  return item.gari ? gariSprite : sprites[item.level];
}
function paintSprite(c, sp) {
  c.drawImage(sp.cv, -sp.w / 2, -sp.h / 2, sp.w, sp.h);
}
